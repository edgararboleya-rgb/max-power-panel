<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Max Power — Contractor Portal</title>
  <meta name="theme-color" content="#071A2E">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/styles.css?v=131">
  <style>
    .gc-hero { text-align: center; padding: 1rem 0 0.6rem; }
    .gc-nombre { font-size: 1.35rem; font-weight: 800; color: var(--mp-ink); margin: 0.2rem 0 0.15rem; }
    .gc-sub { font-size: 0.88rem; color: var(--mp-ink-2); }
    .gc-lista { display: grid; gap: 0.75rem; }
    .gc-obra {
      position: relative; display: block; text-decoration: none; color: inherit;
      background: var(--mp-card); border: 1px solid var(--mp-line); border-radius: 16px;
      box-shadow: var(--mp-shadow); padding: 0.85rem 1rem 0.9rem 1.15rem; overflow: hidden;
      transition: transform .24s var(--mp-ease), box-shadow .24s var(--mp-ease);
    }
    .gc-obra::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--mp-grad); }
    .gc-obra:hover { transform: translateY(-2px); box-shadow: var(--mp-shadow-lg); }
    .gc-obra-tit { font-size: 1rem; font-weight: 750; color: var(--mp-ink); }
    .gc-obra-dir { font-size: 0.8rem; color: var(--mp-ink-2); margin-top: 0.1rem; }
    .gc-obra-pie { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.55rem; align-items: center; }
    .gc-eti {
      display: inline-flex; align-items: center; gap: 0.35rem; border-radius: 999px;
      background: var(--mp-sky-2); border: 1px solid var(--mp-line);
      font-size: 10.5px; font-weight: 650; padding: 0.28rem 0.65rem;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--mp-ink-2);
    }
    .gc-aviso {
      display: block; margin-top: 0.55rem; border-radius: 12px; padding: 0.45rem 0.7rem;
      background: var(--mp-warn-bg); border: 1px solid var(--mp-warn-bd); color: var(--mp-warn-tx);
      font-size: 0.8rem; font-weight: 650;
    }
    .gc-ok { color: var(--mp-ok); font-size: 0.78rem; font-weight: 650; margin-top: 0.5rem; display: block; }
    .gc-card {
      background: var(--mp-card); border: 1px solid var(--mp-line); border-radius: 16px;
      box-shadow: var(--mp-shadow); padding: 0.85rem 1rem; margin-top: 1rem;
    }
    .gc-card-tit { font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em;
                   color: var(--mp-teal-text); font-weight: 700; margin-bottom: 0.5rem; }
    .gc-item { display: block; padding: 0.3rem 0; font-size: 0.86rem; }
    .gc-item a { color: var(--mp-navy); font-weight: 650; text-decoration: none; }
    .gc-item a:hover { text-decoration: underline; }
    .gc-wa {
      display: inline-flex; align-items: center; gap: 0.45rem; margin-top: 0.4rem;
      background: linear-gradient(135deg, var(--mp-blue), var(--mp-cyan)); color: #04222B;
      border-radius: 999px; padding: 0.5rem 0.95rem; font-size: 0.82rem; font-weight: 800; text-decoration: none;
    }
    .gc-cargando { text-align: center; color: var(--mp-ink-2); padding: 2.5rem 1rem; font-size: 0.92rem; }
    @media (min-width: 700px) {
      html { font-size: 18px; }
      .container, .membrete-inner { max-width: 720px; margin-left: auto; margin-right: auto; }
      .pie { text-align: center; }
    }
    @media (min-width: 1024px) {
      html { font-size: 16px; }
      /* Sin menú lateral: se anula el grid y la franja oscura de la app */
      #vista-app { display: flex; flex-direction: column; background: none; }
      #vista-app > .membrete, #vista-app > main, #vista-app > .pie { grid-column: auto; width: 100%; align-self: stretch; }
      .membrete-inner, .container { max-width: 1120px; padding-left: 1.5rem; padding-right: 1.5rem; }
      .gc-lista { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); align-items: start; }
      #gc-panel { display: grid; grid-template-columns: minmax(0, 1fr) 340px; column-gap: 1.4rem; align-items: start; }
      .gc-hero, .gc-cargando { grid-column: 1 / -1; }
      .gc-col-main { grid-column: 1; }
      .gc-col-side { grid-column: 2; position: sticky; top: 1rem; }
      .gc-col-side .gc-card:first-child { margin-top: 0; }
    }
  </style>
</head>
<body>
  <div id="vista-app">
    <header class="membrete">
      <div class="membrete-inner">
        <img id="logo" class="membrete-logo" alt="Max Power logo" src="">
        <div>
          <div class="wordmark">max power</div>
          <div class="wordmark-sub">Electrical Solutions Inc.</div>
        </div>
        <div class="membrete-der">
          <button id="gc-idioma" class="btn-idioma" title="English / Español">ES</button>
        </div>
      </div>
    </header>
    <main class="container">
      <div id="gc-panel"><p class="gc-cargando">Loading your jobs…</p></div>
    </main>
    <footer class="pie">
      <p>Max Power Electrical Solutions, Inc. · mxpes.com · (305) 967-9311</p>
      <div class="licencia">FL EC LICENSE #EC13016045</div>
    </footer>
  </div>

  <script src="assets/logo.js?v=131"></script>
  <script>
  (function () {
    "use strict";
    var PORTAL = "https://zeogjvwcmstmkwxjvykz.supabase.co/functions/v1/portal";
    var WHATSAPP = "https://wa.me/13059679311";

    var logo = document.getElementById("logo");
    if (logo && window.MAXPOWER_LOGO) logo.src = window.MAXPOWER_LOGO;

    // Idioma: inglés por defecto (los GC trabajan en inglés); ES con el botoncito
    var lang = localStorage.getItem("mxp_cl_idioma") || "en";
    var btnIdioma = document.getElementById("gc-idioma");
    btnIdioma.textContent = lang === "en" ? "ES" : "EN";
    btnIdioma.addEventListener("click", function () {
      localStorage.setItem("mxp_cl_idioma", lang === "en" ? "es" : "en");
      location.reload();
    });

    var TXT = lang === "en" ? {
      kicker: "CONTRACTOR PORTAL",
      jobs: "jobs with Max Power", job: "job with Max Power",
      abrir: "Open job →",
      proximo: "Next work day", sinProximo: "No work day scheduled",
      insp: "Last inspection", inspProx: "Next inspection", todoBien: "All good",
      avisoFirmar: "Action needed: sign ", avisoSinPagar: function (n, d) {
        return "Invoice " + n + " has been unpaid for " + d + " day" + (d === 1 ? "" : "s"); },
      nuestro: "Our contract", coordina: "Owner pays direct",
      licT: "License & insurance", ayudaT: "Questions about a job?",
      ayuda: "Reply to any email from info@mxpes.com or call (305) 967-9311.",
      wa: "WhatsApp us", cargando: "Loading your jobs…",
      vacio: "No open jobs right now.",
      errLink: "This link is incomplete — please ask Max Power for your contractor link.",
      errAbrir: "We couldn't open this link. It may have been renewed — please ask Max Power for a fresh one.",
      estados: { estimando: "Estimating", enviado: "Proposal sent", aprobado: "Approved",
                 ejecucion: "In progress", pausa: "On hold", completado: "Completed" },
      insps: { paso: "Passed", fallo: "Failed", programada: "Scheduled", parcial: "Partial" }
    } : {
      kicker: "PORTAL DEL CONTRATISTA",
      jobs: "obras con Max Power", job: "obra con Max Power",
      abrir: "Abrir la obra →",
      proximo: "Próximo día de trabajo", sinProximo: "Sin día de trabajo programado",
      insp: "Última inspección", inspProx: "Próxima inspección", todoBien: "Todo al día",
      avisoFirmar: "Te toca firmar: ", avisoSinPagar: function (n, d) {
        return "La factura " + n + " lleva " + d + " día" + (d === 1 ? "" : "s") + " sin pagar"; },
      nuestro: "Contrato con ustedes", coordina: "La paga el dueño",
      licT: "Licencia y seguros", ayudaT: "¿Alguna pregunta de una obra?",
      ayuda: "Responde a cualquier correo de info@mxpes.com o llama al (305) 967-9311.",
      wa: "Escríbenos por WhatsApp", cargando: "Cargando tus obras…",
      vacio: "Ahora mismo no hay obras abiertas.",
      errLink: "Este enlace está incompleto — pídele a Max Power el enlace de tu empresa.",
      errAbrir: "No pudimos abrir este enlace. Puede que se haya renovado — pídele a Max Power uno nuevo.",
      estados: { estimando: "Estimando", enviado: "Propuesta enviada", aprobado: "Aprobado",
                 ejecucion: "En ejecución", pausa: "En pausa", completado: "Completado" },
      insps: { paso: "Pasó", fallo: "No pasó", programada: "Programada", parcial: "Parcial" }
    };

    var g = new URLSearchParams(location.search).get("g") || "";
    var caja = document.getElementById("gc-panel");
    caja.querySelector(".gc-cargando").textContent = TXT.cargando;

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function urlSegura(u) { return /^https?:\/\//i.test(String(u || "").trim()) ? String(u).trim() : ""; }
    function fechaCorta(f) {
      if (!f) return "";
      var d = new Date(String(f) + "T12:00:00");
      if (isNaN(d.getTime())) return String(f);
      return d.toLocaleDateString(lang === "en" ? "en-US" : "es-ES",
        { weekday: "short", month: "short", day: "numeric" });
    }

    if (!g) { caja.innerHTML = '<p class="gc-cargando">' + esc(TXT.errLink) + '</p>'; return; }

    // La llave viaja en el cuerpo del POST — no queda en los registros del
    // servidor. Solo si el guardián contesta 4xx (y no 401) se reintenta por GET.
    fetch(PORTAL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ g: g })
    })
      .then(function (r) {
        if (r.ok) return r.json();
        if (r.status >= 400 && r.status < 500 && r.status !== 401) {
          return fetch(PORTAL + "?g=" + encodeURIComponent(g))
            .then(function (r2) { if (!r2.ok) throw new Error("bad"); return r2.json(); });
        }
        throw new Error("bad");
      })
      .then(pintar)
      .catch(function () {
        caja.innerHTML = '<p class="gc-cargando">' + esc(TXT.errAbrir) + '</p>';
      });

    function pintar(p) {
      var obras = p.obras || [];
      var tarjetas = obras.map(function (o) {
        var etiquetas =
          '<span class="gc-eti">' + esc(TXT.estados[o.estado] || o.estado || "") + '</span>' +
          '<span class="gc-eti">' + esc(o.es_nuestro_contrato ? TXT.nuestro : TXT.coordina) + '</span>' +
          (o.ultima_inspeccion
            ? '<span class="gc-eti">' +
              esc(o.ultima_inspeccion.resultado === "programada" ? TXT.inspProx : TXT.insp) + ": " +
              esc(TXT.insps[o.ultima_inspeccion.resultado] || o.ultima_inspeccion.resultado || "") + '</span>'
            : "");
        var prox = o.proximo
          ? '<div class="gc-obra-dir">📅 ' + esc(TXT.proximo) + ": " + esc(fechaCorta(o.proximo.fecha)) +
            (o.proximo.hora ? " · " + esc(String(o.proximo.hora).slice(0, 5)) : "") + '</div>'
          : "";
        // El aviso llega en piezas para poder escribirlo en el idioma que tenga puesto
        var aviso = "";
        if (o.aviso && o.aviso.tipo === "firmar") aviso = TXT.avisoFirmar + (o.aviso.que || "");
        else if (o.aviso && o.aviso.tipo === "sin_pagar") aviso = TXT.avisoSinPagar(o.aviso.num, o.aviso.dias);
        else if (typeof o.aviso === "string") aviso = o.aviso;   // por si queda un guardián viejo
        var semaforo = aviso
          ? '<span class="gc-aviso">⚠️ ' + esc(aviso) + '</span>'
          : '<span class="gc-ok">✓ ' + esc(TXT.todoBien) + '</span>';
        return '<a class="gc-obra" href="cliente.html?g=' + encodeURIComponent(g) +
          '&p=' + encodeURIComponent(o.id) + '">' +
          '<div class="gc-obra-tit">' + esc(o.nombre) + '</div>' +
          (o.direccion ? '<div class="gc-obra-dir">📍 ' + esc(o.direccion) + '</div>' : "") +
          prox +
          '<div class="gc-obra-pie">' + etiquetas + '</div>' +
          semaforo +
          '</a>';
      }).join("");

      var lic = (p.licencias || []).map(function (d) {
        var tt = lang === "en" ? (d.titulo_en || d.titulo) : d.titulo;
        if (!urlSegura(d.url)) return "";
        return '<span class="gc-item"><a target="_blank" rel="noopener" href="' +
          esc(urlSegura(d.url)) + '">🛡️ ' + esc(tt) + '</a></span>';
      }).join("");

      var n = obras.length;
      caja.innerHTML =
        '<div class="gc-hero">' +
          '<div class="kicker">' + esc(TXT.kicker) + '</div>' +
          '<div class="gc-nombre">' + esc(p.empresa ? p.empresa.nombre : "") + '</div>' +
          '<div class="gc-sub">' + n + " " + esc(n === 1 ? TXT.job : TXT.jobs) + '</div>' +
        '</div>' +
        '<div class="gc-col gc-col-main">' +
          (n ? '<div class="gc-lista">' + tarjetas + '</div>'
             : '<div class="gc-card"><p class="gc-item">' + esc(TXT.vacio) + '</p></div>') +
        '</div>' +
        '<div class="gc-col gc-col-side">' +
          (lic ? '<div class="gc-card"><div class="gc-card-tit">' + esc(TXT.licT) + '</div>' + lic + '</div>' : "") +
          '<div class="gc-card"><div class="gc-card-tit">' + esc(TXT.ayudaT) + '</div>' +
            '<p class="gc-item">' + esc(TXT.ayuda) + '</p>' +
            '<a class="gc-wa" target="_blank" rel="noopener" href="' + WHATSAPP + '">💬 ' + esc(TXT.wa) + '</a>' +
          '</div>' +
        '</div>';
    }
  })();
  </script>
</body>
</html>
