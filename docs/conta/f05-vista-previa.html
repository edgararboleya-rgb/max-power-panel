  };

  const resultados = {
    ingresos: [['4010', 'Contrato — residencial', 18500.00, 18500.00], ['4020', 'Contrato — comercial', 9600.00, 9600.00], ['4030', 'Servicio y T&M', 2150.00, 2150.00]],
    costos: [['5000', 'Mano de obra directa', 6840.00, 0], ['5100', 'Material', 7412.36, 7391.20], ['5200', 'Subcontratos', 3200.00, 3200.00], ['5300', 'Equipo y renta', 640.00, 640.00], ['5400', 'Permisos e inspecciones', 385.00, 385.00]],
    gastos: [['6130', 'Cargos bancarios', 89.00, 89.00], ['6200', 'Seguros', 980.00, 980.00], ['6300', 'Vehículos — combustible', 612.40, 612.40], ['6500', 'Oficina y software', 214.99, 214.99]],
    notas: { '5000': 'QuickBooks no devenga: el sueldo entra cuando Gusto paga (día 3). El libro lo devenga el 31 y lo reversa el 1.', '5100': 'Diferencia $21.16: el recibo 325 (Lowe’s, $19.48) espera en la bandeja y el 319 se redondeó a centavos.' } };

  const S = { vista: 'conta', tab: 'bandeja', cuenta: null, asiento: null, senal: true, vacia: false, hechos: new Set() };
  const main = document.getElementById('main');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function toast(msg) {
    const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2600);
  }

  // ---------- inicio (mosaico) ----------
  const ICO = {
    horas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="m8 12 2.5 2.5L16 9"/></svg>',
    mat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.5A2 2 0 0 0 9.4 17h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg>',
    gastos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-9M21 20H3"/></svg>',
    conta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H20v14H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 6.5v14"/><path d="M9 9h7M9 12.5h7M9 16h4"/></svg>',
  };
  function vistaInicio(equipo) {
    const tiles = [['horas', 'Reportar mis horas'], ['cal', 'Calendario'], ['check', 'Checklist'], ['mat', 'Materiales']];
    if (!equipo) tiles.push(['gastos', 'Gastos'], ['conta', 'Contabilidad', true]);
    return `
      <div class="titulo-fila"><h1>${equipo ? 'Hola, Gustavo' : 'Hola, Edgar'}</h1></div>
      <div class="mosaico">${tiles.map(([k, t, nuevo]) => `<button class="tile ${nuevo ? 'nuevo' : ''}" type="button" data-tile="${k}">${ICO[k]}<span>${t}</span></button>`).join('')}</div>
      ${equipo ? `<div class="nota-equipo"><b>Así lo ve el equipo:</b> no hay botón de Contabilidad, y aunque alguien adivinara la dirección, la base no le devuelve ni una fila. El candado no es el botón, es la base (probado: un trabajador lee 0 asientos, 0 cuentas, 0 períodos).</div>`
               : `<div class="nota-equipo">El mosaico de hoy, con el botón nuevo. Lo demás sigue igual para todos.</div>`}`;
  }

  // ---------- contabilidad ----------
  function cabecera(titulo, volver) {
    return `<div class="titulo-fila">
      <button class="btn-volver" type="button" data-volver="${volver}" title="Volver">←</button>
      <h1>${titulo}</h1>
      <span class="mes">Octubre 2026 ▾</span>
    </div>`;
  }
  function estado() {
    return `<div class="estado"><span class="punto"></span><span>Libro en verde · 10/10 · puentes 13/13</span><small>ronda de las 6:00</small></div>`;
  }
  function tabs() {
    const pend = bandeja.filter(b => b.tipo === 'pregunta' && !S.hechos.has(b.id)).length;
    const T = [['bandeja', 'Bandeja'], ['balanza', 'Balanza'], ['resultados', 'Resultados'], ['libro', 'Libro']];
    return `<div class="tabs" role="tablist">${T.map(([k, t]) => `<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${S.tab === k}">${t}${k === 'bandeja' && pend ? `<span class="n">${pend}</span>` : ''}</button>`).join('')}</div>`;
  }

  function vistaBandeja() {
    const items = bandeja.filter(b => !S.hechos.has(b.id));
    if (!items.length) return `<div class="vacio"><b>Bandeja vacía</b>Todo lo de octubre está en el libro.</div>`;
    return `<div class="lista">${items.map(b => `
      <article class="card ${b.tipo}">
        <div class="card-cab"><span class="quien">${esc(b.quien)}</span><span class="monto num">${$(b.monto)}</span></div>
        <div class="card-sub"><span>${b.papel}</span><span>·</span><span>${b.fecha}</span>${b.pago ? `<span>·</span><span>${esc(b.pago)}</span>` : ''}${b.obra ? `<span>·</span><span>${OBRAS[b.obra]}</span>` : ''}</div>
        <div class="card-sub" style="margin-top:.35rem"><span class="chip ${b.tipo === 'aviso' ? 'warn' : 'azul'}">${b.tipo === 'aviso' ? 'aviso · ya en el libro' : 'espera tu respuesta'}</span><span class="chip">${b.codigo.replace('_', ' ')}</span></div>
        <p class="motivo">${b.motivo}</p>
        <div class="acciones">${b.acciones.map(([t, k]) => `<button class="accion ${k === 'sec' ? 'sec' : ''}" type="button" data-resolver="${b.id}" data-k="${k}">${esc(t)}</button>`).join('')}</div>
      </article>`).join('')}</div>`;
  }

  function vistaBalanza() {
    if (S.asiento) return vistaAsiento(S.asiento);
    if (S.cuenta) return vistaCuenta(S.cuenta);
    const d = balanza.reduce((s, c) => s + c.d, 0), h = balanza.reduce((s, c) => s + c.h, 0);
    const grupo = (t, f) => `<div class="seccion"><span>${t}</span></div>` + balanza.filter(f).map(c => `
      <button class="fila doble num" type="button" data-cuenta="${c.cod}">
        <span><span class="cod">${c.cod}</span><br><span class="nom">${esc(c.nom)}</span></span>
        <span class="val">${c.d ? $(c.d) : ''}</span><span class="val">${c.h ? $(c.h) : ''}</span>
        <span class="sub">${c.mov} asiento${c.mov === 1 ? '' : 's'} · toca para ver cada uno</span>
      </button>`).join('');
    return `<div class="cab-doble"><span>Balanza de comprobación</span><span>Debe</span><span>Haber</span></div>
      ${grupo('Activo', c => c.cod[0] === '1')}${grupo('Pasivo', c => c.cod[0] === '2')}${grupo('Capital', c => c.cod[0] === '3')}
      ${grupo('Ingresos', c => c.cod[0] === '4')}${grupo('Costo de obra', c => c.cod[0] === '5')}${grupo('Gastos', c => c.cod[0] === '6')}
      <div class="total cuadra doble num"><span>Cuadra al centavo</span><span class="val">${$(d)}</span><span class="val">${$(h)}</span></div>`;
  }

  function vistaCuenta(cod) {
    const c = balanza.find(x => x.cod === cod);
    const lista = asientos[cod] || [];
    return `<div class="seccion"><span>${cod} · ${esc(c.nom)}</span><span class="num">${$(c.d || c.h)}</span></div>
      ${lista.length ? lista.map(a => `
        <button class="fila num" type="button" data-asiento="${a.num}">
          <span><span class="cod">${a.num} · ${a.fecha}</span><br><span class="nom">${esc(a.desc)}</span></span>
          <span class="val">${$(a.monto)}</span>
          <span class="sub">${OBRAS[a.obra]}${a.co ? ' · ' + a.co : ''} · contra ${a.cr}</span>
        </button>`).join('')
        : `<div class="vacio">En la vista previa solo la cuenta 5100 tiene asientos para abrir. En la app, todas.</div>`}`;
  }

  function vistaAsiento(num) {
    const a = Object.values(asientos).flat().find(x => x.num === num);
    const p = a.papel;
    return `<article class="card">
      <div class="asiento-cab"><span class="asiento-num">ASIENTO ${a.num}</span><span class="asiento-fecha">${a.fecha} 2026 · período 2026-10</span>
        <div class="asiento-desc">${esc(a.desc)}</div></div>
      <div class="card-sub" style="margin-top:.4rem"><span class="chip ok">sellado</span><span class="chip azul">camino: puente</span><span class="chip">por Edgar · app</span></div>
      <div class="lineas num">
        <div class="linea"><span class="cta">5100 Material</span><span class="d">${$(a.monto)}</span><span class="h"></span><span class="dim">${OBRAS[a.obra]}${a.co ? ' · cost code ' + a.co : ''}</span></div>
        <div class="linea"><span class="cta">${a.cr} ${esc(a.crNom)}</span><span class="d"></span><span class="h">${$(a.monto)}</span></div>
      </div>
      <div class="papel">
        <div class="foto">foto del ticket<br>(la de verdad, firmada 1 h)</div>
        <div class="papel-datos">
          <span><b>${p.tipo} ${p.id}</b> · ${esc(p.prov)} #${esc(p.numero)}</span>
          <span class="num">Subtotal ${$(p.sub)} + tax ${$(p.tax)} = <b>${$(p.sub + p.tax)}</b></span>
          <span>Pagado con ${esc(p.pago)}</span>
          <span>Subido por Edgar · leído por la rutina</span>
        </div>
      </div>
      <div class="sello">
        <span>Procedencia: <code>${esc(p.foto)}</code></span>
        <span>Firma del papel: <code>md5 7b1e…</code> · Hash del asiento: <code>${a.hash}</code> · enlaza con el anterior</span>
      </div>
      <div class="nota-regla">Este asiento nació de un recibo: no se reversa a mano. Si el ticket está mal, se corrige el recibo (✎) o se anula, y el libro pone el reverso y el asiento nuevo, enlazados.</div>
    </article>`;
  }

  function vistaResultados() {
    if (S.vacia) return `<div class="falla"><h2>La pantalla se detuvo</h2>
      <p>Esperaba <b>88 cuentas</b> en el plan y la base devolvió <b>0 filas</b>. No se pinta ningún número: un cero aquí sería mentira. Revisa la conexión o la vista <code>v_resultados</code>; el libro no ha cambiado.</p></div>`;
    const sum = (arr, i) => arr.reduce((s, r) => s + r[i], 0);
    const ing = sum(resultados.ingresos, 2), cos = sum(resultados.costos, 2), gas = sum(resultados.gastos, 2);
    const ingQ = sum(resultados.ingresos, 3), cosQ = sum(resultados.costos, 3), gasQ = sum(resultados.gastos, 3);
    const grupo = (t, arr, tot, totQ) => `<div class="seccion"><span>${t}</span></div>` + arr.map(([c, n, v, q]) => `
      <button class="fila num" type="button" data-cuenta="${c}">
        <span><span class="cod">${c}</span><br><span class="nom">${esc(n)}</span></span>
        <span class="val">${$(v)}</span>
        ${v !== q ? `<span class="sub dif">QuickBooks ${$(q)} · <b>dif. ${$(v - q)}</b> — ${esc(resultados.notas[c] || '')}</span>` : `<span class="sub">= QuickBooks</span>`}
        ${t === 'Costo de obra' ? `<span class="barra"><i style="width:${Math.round(v / ing * 100)}%"></i></span>` : ''}
      </button>`).join('') + `<div class="total num"><span>${t}</span><span class="val">${$(tot)}</span></div>`;
    const util = ing - cos - gas, utilQ = ingQ - cosQ - gasQ;
    return `
      <div class="fila num" style="grid-template-columns:1fr auto;border-left:4px solid var(--mp-blue)">
        <span><span class="cod">MARCHA EN PARALELO</span><br><span class="nom">Utilidad de octubre</span></span>
        <span class="val">${$(util)}</span>
        <span class="sub">QuickBooks: ${$(utilQ)} · la diferencia (${$(util - utilQ)}) está explicada línea por línea abajo. Margen ${Math.round(util / ing * 100)} %.</span>
      </div>
      ${grupo('Ingresos', resultados.ingresos, ing, ingQ)}
      ${grupo('Costo de obra', resultados.costos, cos, cosQ)}
      ${grupo('Gastos', resultados.gastos, gas, gasQ)}
      <div class="comparativa"><div class="fila num" style="grid-template-columns:1fr auto"><span class="nom">Contribución (ingresos − costo)</span><span class="val">${$(ing - cos)}</span><span class="sub">${Math.round((ing - cos) / ing * 100)} % de la venta · el plan de agosto decía 74 %</span></div></div>`;
  }

  function vistaLibro() {
    const todos = Object.values(asientos).flat();
    return `<div class="seccion"><span>Libro diario · octubre</span><span>${todos.length} de 61 asientos</span></div>
      ${todos.map(a => `<button class="fila num" type="button" data-asiento="${a.num}">
        <span><span class="cod">${a.num} · ${a.fecha}</span><br><span class="nom">${esc(a.desc)}</span></span>
        <span class="val">${$(a.monto)}</span>
        <span class="sub">Dr 5100 / Cr ${a.cr} · ${OBRAS[a.obra]} · sellado</span>
      </button>`).join('')}
      <div class="vacio">Numeración sin huecos: 2026-000001 … 2026-000061. Cada asiento lleva el hash del anterior; nadie lo edita ni lo borra.</div>`;
  }

  function render() {
    document.getElementById('usuario-chip').textContent = S.vista === 'equipo' ? 'Gustavo' : 'Edgar';
    if (S.vista === 'inicio') { main.innerHTML = vistaInicio(false); return; }
    if (S.vista === 'equipo') { main.innerHTML = vistaInicio(true); return; }
    if (!S.senal) {
      main.innerHTML = cabecera('Contabilidad', 'inicio') + `<div class="sin-senal">
        <div style="font-size:2rem">📵</div><h2>Sin señal</h2>
        <p>La contabilidad solo se enseña con conexión. Nada de cifras guardadas en el teléfono que puedan estar viejas: cuando vuelva la señal, se lee la base y se pinta.</p></div>`;
      return;
    }
    const titulo = S.asiento ? 'Asiento' : S.cuenta ? 'Cuenta' : 'Contabilidad';
    const volver = S.asiento ? 'cuenta' : S.cuenta ? 'tab' : 'inicio';
    let cuerpo = '';
    if (S.tab === 'bandeja') cuerpo = vistaBandeja();
    else if (S.tab === 'balanza') cuerpo = vistaBalanza();
    else if (S.tab === 'resultados') cuerpo = S.asiento ? vistaAsiento(S.asiento) : S.cuenta ? vistaCuenta(S.cuenta) : vistaResultados();
    else cuerpo = S.asiento ? vistaAsiento(S.asiento) : vistaLibro();
    main.innerHTML = cabecera(titulo, volver) + (S.cuenta || S.asiento ? '' : estado() + tabs()) + cuerpo;
  }

  // ---------- interacción ----------
  main.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.tab) { S.tab = b.dataset.tab; S.cuenta = null; S.asiento = null; render(); return; }
    if (b.dataset.volver) {
      if (b.dataset.volver === 'inicio') S.vista = 'inicio';
      else if (b.dataset.volver === 'cuenta') { S.asiento = null; if (S.tab === 'libro') S.cuenta = null; }
      else { S.cuenta = null; S.asiento = null; }
      render(); return;
    }
    if (b.dataset.cuenta) { S.cuenta = b.dataset.cuenta; S.asiento = null; if (S.tab === 'bandeja') S.tab = 'balanza'; render(); return; }
    if (b.dataset.asiento) { S.asiento = b.dataset.asiento; render(); return; }
    if (b.dataset.tile) {
      if (b.dataset.tile === 'conta') { S.vista = 'conta'; render(); } else toast('En la vista previa solo abre Contabilidad.');
      return;
    }
    if (b.dataset.resolver) {
      const id = Number(b.dataset.resolver); const k = b.dataset.k; S.hechos.add(id);
      const msg = { obra: 'Contabilizado · asiento 2026-000058', cta: 'Regla guardada y contabilizado · 2026-000059', tarjeta: 'Tarjeta 4417 dada de alta · contabilizado 2026-000060',
                    anular: 'Recibo 327 anulado: el ticket cuenta una vez', confirmar: 'Confirmado: dos compras · contabilizado 2026-000061', ret: 'Retención a 1120 · factura contabilizada 2026-000062', sec: 'Listo' }[k] || 'Listo';
      render(); toast(msg); return;
    }
  });

  const demo = (id, prop, on) => document.getElementById(id).addEventListener('click', (e) => {
    const p = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    ['d-senal', 'd-vacia', 'd-equipo'].forEach(x => document.getElementById(x).setAttribute('aria-pressed', 'false'));
    e.currentTarget.setAttribute('aria-pressed', String(p));
    on(p); render();
  });
  demo('d-senal', 'senal', (p) => { S.senal = !p; S.vacia = false; S.vista = 'conta'; });
  demo('d-vacia', 'vacia', (p) => { S.vacia = p; S.senal = true; S.vista = 'conta'; S.tab = 'resultados'; S.cuenta = null; S.asiento = null; });
  demo('d-equipo', 'equipo', (p) => { S.senal = true; S.vacia = false; S.vista = p ? 'equipo' : 'conta'; });

  render();
})();
</script>
