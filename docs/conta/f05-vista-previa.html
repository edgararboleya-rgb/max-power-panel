<title>Contabilidad Max Power</title>
<style>
  :root {

    color-scheme: dark;

  .pill { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; border-radius: 999px; padding: .15rem .5rem; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
  .pill.ok { color: var(--ok); border-color: var(--ok-bd); background: var(--ok-bg); }

  .margen { display: inline-block; width: 60px; height: 6px; background: var(--sky-3); border-radius: 3px; overflow: hidden; vertical-align: middle; margin-left: .4rem; }
  .margen i { display: block; height: 100%; background: var(--s1); }

  /* ---------- estados financieros ---------- */

  .ef .l { display: grid; grid-template-columns: 1fr auto; gap: .8rem; padding: .38rem 0; border-bottom: 1px solid var(--line); }

  .ef .cab3 { display: grid; grid-template-columns: 1fr auto auto; gap: .8rem; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; padding: .2rem 0; }

<script>
(() => {
  // Datos DE EJEMPLO (obras y cifras inventadas). Las cuentas, las reglas y
  // los mensajes son los de c1, c2 y c3 (24-sep-2026). Octubre de 2026 es el
  // primer mes de la marcha en paralelo con QuickBooks.
  const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
  const money0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  const $ = (n) => money.format(n), $0 = (n) => money0.format(n);
  const pct = (n) => `${Math.round(n * 100)} %`;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sum = (a, f = (x) => x) => a.reduce((s, x) => s + f(x), 0);

  // ---- datos ----
  const bancos = [
    { cod: '1010', nom: 'Chase · cuenta operativa', libro: 23418.62, banco: 23418.62, al: '24 oct', pend: 0, ult4: '···4392' },
    { cod: '1050', nom: 'Efectivo (caja chica)', libro: 57.00, banco: null, al: null, pend: 0 },
    { cod: '2100-2013', nom: 'Amex Business Gold', libro: -2941.85, banco: -3002.06, al: 'corte 18 oct', pend: 2, ult4: '···2013', vence: '12 nov', pago: 3002.06 },
    { cod: '2100-2009', nom: 'Amex Business Blue', libro: -812.40, banco: -812.40, al: 'corte 20 oct', pend: 0, ult4: '···2009', vence: '14 nov', pago: 812.40 },

        return `<tr><td><b>${esc(p.nom)}</b><br><small style="color:var(--ink-2)">${p.tipo} · ${p.estado}</small></td><td class="r">${$0(p.contrato)}</td><td class="r">${$0(p.facturado)}</td><td class="r">${$0(p.cobrado)}${p.cobrado < p.facturado ? `<br><span class="pill warn">${$0(p.facturado - p.cobrado)} abierto</span>` : ''}</td><td class="r">${$(p.costo)}</td><td class="r">${$0(p.estimado)}<br><span class="pill ${sobre ? 'bad' : 'ok'}">${sobre ? '+' : ''}${pct((p.costo - p.estimado) / p.estimado)}</span></td><td class="r"><b>${pct(m)}</b><span class="margen"><i style="width:${Math.max(0, Math.min(100, m * 100))}%"></i></span></td></tr>`; }).join('')}
      <tr class="fila-tot"><td>Total obras activas</td><td class="r">${$0(sum(proyectos, p => p.contrato))}</td><td class="r">${$0(sum(proyectos, p => p.facturado))}</td><td class="r">${$0(sum(proyectos, p => p.cobrado))}</td><td class="r">${$(sum(proyectos, p => p.costo))}</td><td class="r">${$0(sum(proyectos, p => p.estimado))}</td><td class="r">${pct((sum(proyectos, p => p.facturado) - sum(proyectos, p => p.costo)) / sum(proyectos, p => p.facturado))}</td></tr></tbody></table></div>
      <p class="nota">Costo real = lo que hay en el libro por obra (material, subcontratos, mano de obra devengada, equipo, permisos). Estimado = el de la app. Toca una obra para ver cada recibo y cada hora.</p>`;
  }
  function resultados() {
    const ing = sum(pl.ingresos, r => r[2]), cos = sum(pl.costos, r => r[2]), gas = sum(pl.gastos, r => r[2]);
    const ingQ = sum(pl.ingresos, r => r[3]), cosQ = sum(pl.costos, r => r[3]), gasQ = sum(pl.gastos, r => r[3]);
    const bloque = (t, arr) => `<h3>${t}</h3>` + arr.map(([c, n, v, q]) => `<div class="l l3 sub num"><span><button type="button" data-cuenta="${c}">${c} ${esc(n)}</button>${v !== q ? `<br><small class="dif">dif. ${$(v - q)} — ${esc(pl.notas[c] || '')}</small>` : ''}</span><span>${$(v)}</span><span>${$(q)}</span></div>`).join('');
    return cab('Estado de resultados', 'Octubre 2026 · marcha en paralelo: el libro a la izquierda, QuickBooks a la derecha, la diferencia explicada línea por línea.') + `<section class="card ef">
      <div class="cab3"><span></span><span>Libro</span><span>QuickBooks</span></div>
      ${bloque('Ingresos', pl.ingresos)}<div class="l l3 tot num"><span>Total ingresos</span><span>${$(ing)}</span><span>${$(ingQ)}</span></div>
      ${bloque('Costo de obra', pl.costos)}<div class="l l3 tot num"><span>Total costo</span><span>${$(cos)}</span><span>${$(cosQ)}</span></div>
      <div class="l l3 tot num"><span>Utilidad bruta · ${pct((ing - cos) / ing)}</span><span>${$(ing - cos)}</span><span>${$(ingQ - cosQ)}</span></div>
      ${bloque('Gastos', pl.gastos)}<div class="l l3 tot num"><span>Total gastos</span><span>${$(gas)}</span><span>${$(gasQ)}</span></div>
      <div class="l l3 gran num"><span>Utilidad neta · ${pct((ing - cos - gas) / ing)}</span><span>${$(ing - cos - gas)}</span><span>${$(ingQ - cosQ - gasQ)}</span></div>
      <p class="nota">Toca una cuenta y bajas a sus asientos; de un asiento, al recibo con su foto. La diferencia con QuickBooks (${$(ing - cos - gas - (ingQ - cosQ - gasQ))}) es toda del devengo de nómina: QuickBooks la registra cuando Gusto paga.</p></section>`;
  }
  function balance() {
    const l = (n, v, cls = 'sub') => `<div class="l ${cls} num"><span>${n}</span><span>${$(v)}</span></div>`;
    const act = 23418.62 + 57 + 12650 + 960 + 4200 + 18400 - 6120, pas = 4308.10 + 2941.85 + 812.40 + 6840 + 1094.40 + 960 + 14800;
    return cab('Balance general', 'Al 24 de octubre de 2026 · cuadra al centavo (activo = pasivo + capital).') + `<section class="card ef">
      <h3>Activo</h3>${l('1010 Chase', 23418.62)}${l('1030 Reserva de impuestos', 4200)}${l('1050 Caja chica', 57)}${l('1110 Cuentas por cobrar', 12650)}${l('1120 Retención por cobrar', 960)}${l('1510 Vehículos', 18400)}${l('1590 Depreciación acumulada', -6120)}${l('Total activo', act, 'tot')}
      <h3>Pasivo</h3>${l('2010 Cuentas por pagar', 4308.10)}${l('2020 Retención a subcontratistas', 960)}${l('2100-2013 Amex Gold', 2941.85)}${l('2100-2009 Amex Blue', 812.40)}${l('2210 Sueldos acumulados (devengo)', 6840)}${l('2220 Impuestos de nómina', 1094.40)}${l('2520 Préstamo de vehículo', 14800)}${l('Total pasivo', pas, 'tot')}
      <h3>Capital</h3>${l('3000 Capital social', 1000)}${l('3200 Distribuciones al accionista', -6936.67)}${l('3900 Utilidades retenidas + resultado', act - pas - 1000 + 6936.67)}${l('Total capital', act - pas, 'tot')}
      <div class="l gran num"><span>Pasivo + capital</span><span>${$(act)}</span></div>
      <p class="nota">La apertura al 30-sep sale de la balanza de QuickBooks; cada saldo tiene clic hasta sus asientos. El préstamo del vehículo se separa en corriente y largo plazo al cierre del año.</p></section>`;
  }
  function flujoPag() {
    return cab('Flujo de caja', 'Entradas y salidas reales del banco, y lo que viene.') + `<section class="card">${barrasFlujo()}</section>
      <div class="rejilla" style="margin-top:.8rem">
      ${card('Próximos 30 días', `<div class="ef num">${[['Cobros esperados (facturas abiertas al día)', 15140], ['Pago Amex Gold (12 nov)', -3002.06], ['Pago Amex Blue (14 nov)', -812.40], ['Nómina (Gusto, 2 corridas)', -9700], ['Proveedores a cuenta (Platt, CES)', -3908.10], ['Reserva de impuestos (semanal)', -1200]].map(([n, v]) => `<div class="l sub"><span>${n}</span><span style="${v < 0 ? 'color:var(--danger)' : ''}">${v < 0 ? '−' : '+'}${$(Math.abs(v))}</span></div>`).join('')}<div class="l gran"><span>Efectivo estimado al 24 nov</span><span>${$(23475.62 + 15140 - 3002.06 - 812.40 - 9700 - 3908.10 - 1200)}</span></div></div>`)}
      ${card('Octubre, por dónde entró y salió', barrasH([['Cobros de clientes', 21400], ['Pagos a proveedores', 6210, 'salida'], ['Nómina (Gusto)', 7460, 'salida'], ['Pagos de tarjetas', 1980, 'salida'], ['Seguros y préstamo', 590, 'salida']], 21400))}
      </div>`;
  }
  function bancosPag() {
    return cab('Bancos y tarjetas', 'Saldo del libro contra el statement. Cada movimiento del banco casa con su ticket, factura o transferencia.') + `<div class="rejilla">${bancos.map(b => card(esc(b.nom), `<div class="kpi num"><span class="val">${$(Math.abs(b.libro))}</span><span class="cmp">${b.banco == null ? 'Efectivo que debe haber en el bolsillo; se cuenta al cierre.' : `Statement: ${$(Math.abs(b.banco))} ${b.al}`}</span></div>
        <div class="nota">${b.banco == null ? '' : Math.abs(b.banco - b.libro) < .005 ? `<span class="pill ok">Conciliado</span> Cada movimiento del banco tiene su papel en el libro.` : `<span class="pill warn">${b.pend} cargos sin ticket</span> Diferencia ${$(Math.abs(b.banco - b.libro))}: Sunpass $61.21 (21 oct) y Shell $... esperan su recibo. La app te los pregunta.`}${b.vence ? `<br>Pago del statement: <b>${$(b.pago)}</b> vence el ${b.vence}. Al pagarlo desde Chase es una transferencia, no un gasto.` : ''}</div>`)).join('')}</div>
      <p class="nota" style="margin-top:.8rem">Los movimientos llegan solos por Plaid cada mañana; el archivo QFX del banco es el respaldo. Un cargo que no tenga ticket sale en la bandeja al día siguiente.</p>`;
  }
  function cobrosPag() {
    return cab('Por cobrar', `${$(sum(cxc, c => c.saldo))} abiertos en ${cxc.length} facturas · ${$0(960)} en retención por cobrar al final de la obra.`) + `<section class="card">${aging()}<div class="tabla-env" style="margin-top:.8rem"><table class="num"><thead><tr><th>Factura</th><th>Cliente</th><th class="r">Monto</th><th class="r">Abierto</th><th class="r">Días</th><th></th></tr></thead><tbody>
      ${cxc.map(c => `<tr><td><b>${c.fac}</b><br><small style="color:var(--ink-2)">${c.fecha}</small></td><td>${esc(c.cliente)}</td><td class="r">${$(c.monto)}</td><td class="r"><b>${$(c.saldo)}</b>${c.ret ? `<br><small style="color:var(--ink-2)">+ ${$0(c.ret)} retención</small>` : ''}</td><td class="r">${c.dias}</td><td><span class="pill ${c.dias > 60 ? 'bad' : c.dias > 30 ? 'warn' : 'ok'}">${c.dias > 60 ? 'vencida' : c.dias > 30 ? 'seguir' : 'al día'}</span></td></tr>`).join('')}</tbody></table></div>
      <p class="nota">Un depósito en Chase se casa solo con su factura. Cobro parcial, anticipo y cheque rebotado tienen su camino; nada se marca «pagada» a mano.</p></section>`;
  }
  function pagosPag() {
    const tot = sum(cxp, c => c.monto);
    return cab('Por pagar', `${$(tot + 2941.85 + 812.40)} en total: ${$(tot)} a proveedores y ${$(2941.85 + 812.40)} en tarjetas.`) + `<section class="card"><div class="tabla-env"><table class="num"><thead><tr><th>Proveedor</th><th>Documento</th><th class="r">Monto</th><th>Vence</th></tr></thead><tbody>
      ${cxp.map(c => `<tr><td><b>${esc(c.prov)}</b></td><td>${esc(c.doc)}</td><td class="r">${$(c.monto)}</td><td>${c.vence}</td></tr>`).join('')}
      <tr class="fila-tot"><td>Total a proveedores</td><td></td><td class="r">${$(tot)}</td><td></td></tr></tbody></table></div>
      <p class="nota">Lo que entró a cuenta (Net 30) ya es costo de su obra desde el ticket; el pago al supply solo baja la deuda, nunca vuelve a ser gasto. El ayudante 1099 se acumula para el formulario de enero.</p></section>`;
  }
  function gastosPag() {
    const cats = [...pl.costos, ...pl.gastos].map(r => [r[1], r[2], r[0]]).sort((a, b) => b[1] - a[1]);
    const tot = sum(cats, r => r[1]);
    const prov = [['City Electric Supply', 3212.40], ['Home Depot', 1846.11], ['Platt', 1288.10], ['Yordan (ayudante 1099)', 3200], ['Sunbelt Rentals', 640], ['Shell / Wawa', 612.40]];
    return cab('Gastos', `${$(tot)} en octubre entre costo de obra y gastos generales.`) + `<div class="rejilla">
      ${card('Por categoría', barrasH(cats.map(r => [`${r[2]} ${r[0]}`, r[1]]), tot))}
      ${card('Por proveedor', barrasH(prov, prov[0][1]) + `<p class="nota">Toca un proveedor y ves cada ticket con su foto.</p>`)}
      ${card('Lo que cuesta la gente', `<div class="ef num">${[['5000 Mano de obra directa (devengo, horas aprobadas)', 6840], ['5010 Burden de obra (FICA, FUTA, RT-6, WC)', 1094.40], ['6000 Sueldo administrativo (Edgar)', 6900], ['6010 Burden administrativo', 621], ['5200 Subcontratos / ayudantes 1099', 3200]].map(([n, v]) => `<div class="l sub"><span>${n}</span><span>${$(v)}</span></div>`).join('')}<div class="l gran"><span>Total gente · ${pct(18655.4 / 30250)} de la venta</span><span>${$(18655.40)}</span></div></div><p class="nota">El plan de agosto decía mano de obra directa 12.6 % de la venta; octubre va en ${pct((6840 + 1094.4) / 30250)}. La nómina real entra con el journal de Gusto.</p>`, 'nomina', 'ancha')}
      </div>`;
  }
  function proyectosPag() {
    return cab('Proyectos', 'Lo financiero de cada obra: contrato, facturado, cobrado, costo real contra el estimado y margen.') + `<section class="card">${tablaProyectos()}</section>
      <div class="rejilla" style="margin-top:.8rem">${proyectos.map(p => card(esc(p.nom), `<div class="ef num">${[['Material', p.id === 'oficina-nch' ? 4312 : p.id === 'casa-perez' ? 5102.36 : 463.10], ['Mano de obra (horas aprobadas × costo)', p.id === 'oficina-nch' ? 2400 : p.id === 'casa-perez' ? 4040 : 400], ['Subcontratos / equipo / permisos', p.id === 'oficina-nch' ? 0 : p.id === 'casa-perez' ? 700 : 0]].map(([n, v]) => `<div class="l sub"><span>${n}</span><span>${$(v)}</span></div>`).join('')}<div class="l tot"><span>Costo real</span><span>${$(p.costo)}</span></div><div class="l tot"><span>Estimado</span><span>${$(p.estimado)}</span></div></div><p class="nota">${p.costo > p.estimado ? `<span class="pill bad">Se pasó del estimado ${pct((p.costo - p.estimado) / p.estimado)}</span>` : `<span class="pill ok">Dentro del estimado</span>`} · ${p.estado}</p>`)).join('')}</div>`;
  }
  function nominaPag() {
    return cab('Nómina', 'Gusto paga; el libro devenga por horas aprobadas y cuadra con el journal.') + `<div class="rejilla">
      ${card('Octubre', `<div class="ef num">${[['Horas aprobadas del equipo', '228.5 h'], ['Devengo estándar (5000)', $(6840)], ['Burden (5010)', $(1094.40)], ['Sueldo de Edgar (6000, W-2)', $(6900)], ['Journal de Gusto recibido', 'corrida del 17 oct · falta la del 31']].map(([n, v]) => `<div class="l sub"><span>${n}</span><span>${v}</span></div>`).join('')}</div><p class="nota">El costo de mano de obra por obra sale de las horas que aprobaste, al costo por hora de cada quien. Nadie se aprueba solo.</p>`)}
      ${card('Por persona', `<div class="tabla-env"><table class="num"><thead><tr><th>Quién</th><th class="r">Horas</th><th class="r">Costo</th><th>Obras</th></tr></thead><tbody>${[['Gustavo', 92, 2760, 'Casa Pérez · NCH'], ['Jian', 78.5, 2355, 'NCH'], ['Osbel', 58, 1725, 'Casa Pérez · Taller Ruiz']].map(r => `<tr><td><b>${r[0]}</b></td><td class="r">${r[1]}</td><td class="r">${$(r[2])}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>`)}
      </div>`;
  }
  function impuestosPag() {
    return cab('Impuestos', 'Lo que la empresa debe y lo que se aparta para el estimado de Edgar.') + `<div class="rejilla">
      ${card('Reserva de impuestos (1030)', `<div class="kpi num"><span class="val">${$(4200)}</span><span class="cmp">Objetivo a la fecha ${$0(5926)}: utilidad del año × % del CPA − pagado</span></div><div class="ef num"><div class="l sub"><span>Transferencia semanal programada</span><span>$300</span></div><div class="l sub"><span>Próximo estimado (15 ene 2027)</span><span>${$0(5900)}</span></div><div class="l sub"><span>Pagos al IRS del año (van a 3200, no son gasto)</span><span>${$0(12400)}</span></div></div>`)}
      ${card('De la empresa', `<div class="ef num">${[['2220 Impuestos de nómina (941), los deposita Gusto', $(1094.40)], ['2225 FUTA (940)', $(42)], ['2230 Reempleo de Florida (RT-6)', $(61.20)], ['2300 Use tax por pagar (DR-15)', $(0)], ['1099 acumulado · Yordan', $(3200)]].map(([n, v]) => `<div class="l sub"><span>${n}</span><span>${v}</span></div>`).join('')}</div><p class="nota">En enero el paquete para el CPA sale de aquí: balanza, mayor, 1099, K-1 aparte (intereses, donaciones), M&E 50 %, vehículo.</p>`)}
      </div>`;
  }
  function contadorPag() {
    return cab('Contador (IA)', 'Revisa los libros cada mañana. Propone; nunca postea. Cada propuesta lleva su costo y su motivo.') + `<div class="lista">
      ${[['Cobranza', 'La factura 1102 (Villa Mar HOA, $3,200.50) lleva 77 días. No hay nota de seguimiento desde el 2 sep. Propongo un recordatorio en inglés al cliente.', ['Mandar recordatorio', 'Ya hablé con ellos']],
         ['Cargo sin ticket', 'Amex Gold, 21 oct, Sunpass $61.21. No hay recibo. Por el día y el calendario, la camioneta estuvo en Oficina NCH. Propongo 6300 Vehículos, sin obra.', ['Sí, 6300', 'Es de otra cosa']],
         ['Duplicado probable', 'El recibo 327 (CED $245.37) tiene el mismo número y total que el 312. Está en la bandeja como duplicado.', ['Ir a la bandeja']],
         ['Cierre', 'Octubre cierra el 5 nov. Faltan: el journal de Gusto del 31, el statement de Amex Blue y 2 cargos sin ticket. Sin eso el cierre no pasa.', ['Ver la lista']]].map(([t, m, a]) => `<article class="card papel"><div class="cabp"><span class="quien">${t}</span></div><p class="motivo">${m}</p><div class="acciones">${a.map((x, i) => `<button class="accion ${i ? 'sec' : ''}" type="button" data-toast="Anotado">${x}</button>`).join('')}</div></article>`).join('')}
      </div><p class="nota" style="margin-top:.8rem">Costo de la ronda de hoy: $0.09 (Opus, esfuerzo bajo). Si algo huele mal, sube a esfuerzo máximo y te lo dice.</p>`;
  }
  function cierrePag() {
    return cab('Cierre del mes', 'Octubre se cierra el 5 de noviembre. Un mes cerrado no se reabre: lo que llegue tarde entra al mes siguiente con su nota.') + `<section class="card"><div class="ef">${[['Cuadre del libro', 'ok'], ['Conciliación Chase al 31 oct', 'falta el statement'], ['Amex Gold', '2 cargos sin ticket'], ['Amex Blue', 'ok'], ['Journal de Gusto (31 oct)', 'falta'], ['Bandeja vacía', '5 papeles esperan'], ['Devengo estándar puesto al día', 'ok'], ['Auxiliar por obra = mayor', 'ok'], ['Comparado con QuickBooks', 'diferencia explicada: devengo']].map(([n, v]) => `<div class="l sub"><span>${n}</span><span class="pill ${v === 'ok' ? 'ok' : v.startsWith('diferencia') ? '' : 'warn'}">${v}</span></div>`).join('')}</div><p class="nota">Cuando todo está en verde, un toque cierra el mes: se sella, se exporta el CSV con procedencia y el PDF, y se archivan siete años.</p></section>`;
  }
  function balanzaPag() {
    return cab('Balanza y libro', 'Cada cuenta con su saldo; toca una y bajas a sus asientos, y del asiento al papel.') + `<section class="card ef">
      <div class="cab3"><span>Cuenta</span><span>Debe</span><span>Haber</span></div>
      ${[['1010 Chase', 23418.62, 0], ['1050 Caja chica', 57, 0], ['1110 Cuentas por cobrar', 12650, 0], ['1120 Retención por cobrar', 960, 0], ['2010 Cuentas por pagar', 0, 4308.10], ['2100-2013 Amex Gold', 0, 2941.85], ['2100-2009 Amex Blue', 0, 812.40], ['2210 Sueldos acumulados', 0, 6840], ['4010 Contrato — residencial', 0, 18500], ['4020 Contrato — comercial', 0, 9600], ['4030 Servicio y T&M', 0, 2150], ['5000 Mano de obra directa', 6840, 0], ['5100 Material', 7412.36, 0], ['5200 Subcontratos', 3200, 0]].map(([n, d, h]) => `<div class="l l3 sub num"><span><button type="button" data-cuenta="${n.slice(0, 4)}">${n}</button></span><span>${d ? $(d) : ''}</span><span>${h ? $(h) : ''}</span></div>`).join('')}
      <p class="nota">Se muestran 14 de 88 cuentas. Libro diario: 61 asientos en octubre, numerados sin huecos (2026-000001 … 2026-000061), cada uno con el hash del anterior.</p></section>
      <section class="card" style="margin-top:.8rem"><div class="card-cab"><h2>Asiento 2026-000041 · 5 oct</h2></div>
      <div class="ef num"><div class="l l3 sub"><span>5100 Material · Casa Pérez · CO-9</span><span>${$(245.37)}</span><span></span></div><div class="l l3 sub"><span>2100-2013 Amex Business Gold</span><span></span><span>${$(245.37)}</span></div></div>
      <div class="sello"><span>Papel: <b>Recibo 312</b> · CED #88121 · subtotal $229.32 + tax $16.05 · foto <code>recibos/casa-perez/2026-10-05-ced-88121.jpg</code></span><span>Camino: puente · por Edgar (app) · sellado · hash <code>9f3a…c41e</code> enlaza con 2026-000040</span></div>
      <p class="nota">Nació de un recibo: no se reversa a mano. Si el ticket está mal, se corrige o se anula el recibo y el libro pone el reverso y el asiento nuevo, enlazados.</p></section>`;
  }

  const PAGINAS = { panel, bandeja: () => cab('Bandeja', 'Lo que el libro no pudo contabilizar solo, y por qué. Contestas aquí; nada se inventa.') + bandejaLista(), resultados, balance, flujo: flujoPag, balanza: balanzaPag, bancos: bancosPag, cobros: cobrosPag, pagos: pagosPag, proyectos: proyectosPag, gastos: gastosPag, nomina: nominaPag, impuestos: impuestosPag, contador: contadorPag, cierre: cierrePag };

  const main = document.getElementById('main'), menuEl = document.getElementById('menu'), lateral = document.getElementById('lateral');
  function render() {
    menuEl.innerHTML = menu();
    main.innerHTML = PAGINAS[S.pagina]();
    lateral.dataset.abierto = String(S.menu);
    document.getElementById('btn-menu').setAttribute('aria-expanded', String(S.menu));
  }
  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2400); }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'btn-menu') { S.menu = !S.menu; render(); return; }
    if (b.dataset.pag) { S.pagina = b.dataset.pag; S.menu = false; render(); window.scrollTo({ top: 0 }); return; }
    if (b.dataset.resolver) { S.hechos.add(Number(b.dataset.resolver)); render(); toast('Contabilizado · asiento 2026-000058'); return; }
    if (b.dataset.cuenta) { S.pagina = 'balanza'; render(); window.scrollTo({ top: 0 }); toast(`Cuenta ${b.dataset.cuenta}: en la app bajas a cada asiento`); return; }
    if (b.dataset.toast) { toast(b.dataset.toast); return; }
  });
  document.getElementById('lateral-fondo').addEventListener('click', () => { S.menu = false; render(); });
  // tooltip de las gráficas
  const tip = document.getElementById('tip');
  document.addEventListener('pointermove', (e) => {
    const el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!el) { tip.hidden = true; return; }
    tip.textContent = el.dataset.tip; tip.hidden = false;
    const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + 'px'; tip.style.top = (e.clientY - 34) + 'px';
  });
  document.addEventListener('pointerleave', () => { tip.hidden = true; });
  render();
})();
</script>
