<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Max Power — Your Project</title>
  <meta name="theme-color" content="#071A2E">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/styles.css?v=75">
  <style>
    .cl-hero { text-align: center; padding: 1rem 0 0.4rem; }
    .cl-nombre { font-size: 1.3rem; font-weight: 800; color: var(--mp-ink); margin: 0.2rem 0 0.1rem; }
    .cl-dir { font-size: 0.9rem; color: var(--mp-ink-2); }
    .cl-pasos { display: flex; gap: 0.3rem; margin: 0.9rem 0; }
    .cl-paso { flex: 1; text-align: center; font-size: 0.78rem; font-weight: 800; color: var(--mp-ink-2); letter-spacing: 0.01em; }
    .cl-paso .cl-barra { height: 6px; border-radius: 999px; background: var(--mp-line); margin-bottom: 0.3rem; }
    .cl-paso.hecho .cl-barra { background: #6FBF3C; }
    .cl-paso.hecho { color: #4a8c28; }
    .cl-paso.actual .cl-barra { background: linear-gradient(90deg, var(--mp-blue), var(--mp-cyan)); }
    .cl-paso.actual { color: var(--mp-teal-text); }
    .cl-item { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; padding: 0.4rem 0; border-top: 1px solid var(--mp-sky-2); font-size: 0.92rem; line-height: 1.45; color: var(--mp-ink); }
    .cl-item:first-of-type { border-top: none; }
    .cl-item.hecho { color: var(--mp-ink-3); }
    .cl-item.hecho .cl-txt { text-decoration: line-through; }
    .cl-check { flex-shrink: 0; }
    .cl-wa {
      display: block; text-align: center; margin: 1rem 0;
      background: linear-gradient(135deg, #25D366, #128C7E); color: #fff;
      font-weight: 800; padding: 0.8rem; border-radius: 12px; text-decoration: none;
    }
    .cl-doc { display: inline-block; padding: 0.5rem 0.75rem; font-size: 0.9rem; max-width: 100%; }
    .cl-cargando { text-align: center; padding: 3rem 1rem; color: var(--mp-ink-3); }
    /* width:0 + min-width:100% = el carrusel NUNCA empuja el ancho de la
       página (con muchas fotos el teléfono abría en "modo computadora") */
    .cl-fotos { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.3rem; width: 0; min-width: 100%; }
    .cl-foto { flex: 0 0 auto; width: 150px; }
    .cl-foto img, .cl-foto video { width: 150px; height: 110px; object-fit: cover; border-radius: 10px; border: 1px solid var(--mp-line); }
    .cl-foto video { background: #000; }
    .cl-foto figcaption { font-size: 0.75rem; color: var(--mp-ink-2); margin-top: 2px; }
    .cl-todo { border: 1px solid #EDDFAE; background: #FFFDF3; border-radius: 10px; padding: 0.5rem 0.6rem; margin-bottom: 0.4rem; display: flex; gap: 0.5rem; align-items: center; }
    .cl-todo.hecha { border-color: var(--mp-line); background: var(--mp-card); opacity: 0.7; }
    .cl-todo-txt { flex: 1; font-size: 0.92rem; line-height: 1.4; color: var(--mp-ink); }
    .cl-todo-fecha { display: block; font-size: 0.78rem; color: #7A6200; font-weight: 800; }
    .cl-boton { background: linear-gradient(135deg, var(--mp-blue), var(--mp-cyan)); color: #04222B; border: 0; border-radius: 999px; font: inherit; font-size: 0.82rem; font-weight: 800; padding: 0.5rem 0.85rem; cursor: pointer; flex-shrink: 0; }
    .cl-aprobado { font-size: 0.8rem; font-weight: 800; color: #3E7A20; }
    .cl-diario-fecha { font-size: 0.74rem; font-weight: 800; color: var(--mp-ink-2); flex-shrink: 0; }
    .cl-tico { display: inline-block; vertical-align: -4px; margin-right: 7px; color: var(--mp-teal-text); }
    .cl-tico svg { width: 19px; height: 19px; display: block; }
    .cl-firma-fondo { position: fixed; inset: 0; background: rgba(4, 20, 35, 0.55); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 50; }
    .cl-firma-caja { background: var(--mp-card, #fff); border-radius: 14px; padding: 1rem; max-width: 420px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
    .cl-firma-caja h3 { margin: 0 0 0.3rem; font-size: 1.05rem; color: var(--mp-ink); }
    .cl-firma-doc { font-size: 0.85rem; color: var(--mp-ink-2); margin-bottom: 0.6rem; overflow-wrap: anywhere; }
    .cl-firma-caja input { width: 100%; font: inherit; padding: 0.55rem 0.6rem; border: 1px solid var(--mp-line); border-radius: 10px; margin-bottom: 0.6rem; }
    .cl-firma-lienzo { width: 100%; height: 140px; border: 1.5px dashed var(--mp-line); border-radius: 10px; touch-action: none; background: #fff; display: block; }
    .cl-firma-nota { font-size: 0.74rem; line-height: 1.4; color: var(--mp-ink-3); margin: 0.5rem 0; }
    .cl-firma-botones { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .cl-firma-sub { font-size: 0.8rem; font-weight: 800; color: var(--mp-ink-2); margin: 0.2rem 0; }
    .cl-boton.secundario { background: none; border: 1.5px solid var(--mp-line); color: var(--mp-ink-2); }
    /* Blindaje: si el navegador abre en "modo escritorio" (o en una
       computadora de verdad), la página se acomoda como una columna
       centrada tipo teléfono con letra grande — nunca texto regado
       de lado a lado */
    @media (min-width: 700px) {
      html { font-size: 19px; }
      .container, .membrete-inner { max-width: 640px; margin-left: auto; margin-right: auto; }
      .pie { text-align: center; }
    }
  </style>
</head>
<body>
  <div id="vista-app">
    <header class="membrete">
      <div class="membrete-inner">
        <img id="logo" class="membrete-logo" alt="Max Power logo" src="">
        <div>
          <div class="wordmark">max power</div>
          <div class="wordmark-sub">Electrical Solutions Inc.</div>
        </div>
        <div class="membrete-der">
          <button id="cl-idioma" class="btn-idioma" title="English / Español">ES</button>
        </div>
      </div>
    </header>
    <main class="container">
      <div id="cl-panel"><p class="cl-cargando">Loading your project…</p></div>
    </main>
    <footer class="pie">
      <p>Max Power Electrical Solutions, Inc. · mxpes.com · (305) 967-9311</p>
      <div class="licencia">FL EC LICENSE #EC13016045</div>
    </footer>
  </div>

  <script src="assets/logo.js?v=75"></script>
  <script>
  (function () {
    "use strict";
    var PORTAL = "https://zeogjvwcmstmkwxjvykz.supabase.co/functions/v1/portal";
    var WHATSAPP = "https://wa.me/13059679311";
    var RESENA = ""; // link de Google Reviews — se activa cuando Edgar lo mande

    var logo = document.getElementById("logo");
    if (logo && window.MAXPOWER_LOGO) logo.src = window.MAXPOWER_LOGO;

    // Idioma: inglés por defecto (el de los clientes); ES con el botoncito
    var lang = localStorage.getItem("mxp_cl_idioma") || "en";
    var btnIdioma = document.getElementById("cl-idioma");
    btnIdioma.textContent = lang === "en" ? "ES" : "EN";
    btnIdioma.addEventListener("click", function () {
      localStorage.setItem("mxp_cl_idioma", lang === "en" ? "es" : "en");
      location.reload();
    });
    var TXT = lang === "en" ? {
      kicker: "YOUR PROJECT WITH MAX POWER", pasos: ["Approved", "In progress", "Inspections", "Completed"],
      complete: "complete", de: "of", items: "items done",
      todos: "Your to-dos — we need your input", necesita: "⏰ We need it by ", decidi: "I've decided ✓", done: "✓ Done",
      fotosT: "Progress photos", alcance: "Scope of work", inspT: "Inspections",
      proxT: "Upcoming work days", actividad: "Recent activity", docsT: "Documents",
      aprobar: "Approve ✓", aprobado: "✓ Approved ", garantiaT: "Your warranty",
      pagosT: "Payments", contratoT: "Contract total", cobradoT: "Paid to date", saldoT: "Balance",
      pagadaF: "Paid ✓", pendienteF: "Pending",
      firmar: "Review & sign 🖊", firmadoPor: "🖊 Signed by ", firmaTitulo: "Sign this document",
      licT: "License & Insurance",
      firmaNombre: "Your full legal name", firmaDibuja: "Draw your signature below (finger or mouse)",
      firmaLimpiar: "Clear", firmaEnviar: "Sign ✓", firmaCancelar: "Cancel",
      firmaLegal: "I have reviewed this document and agree to its terms. My name, signature, date, time and device will be recorded.",
      modoEscribir: "Type your signature", modoDibujar: "Draw it instead",
      firmaConsent: "Please check the consent box to sign.",
      firmaFalta: "Please write your name and draw your signature.",
      garantia: "All our workmanship is covered by a 1-year warranty from completion. Keep this link — it's your home's electrical file.",
      resena: "⭐ Happy with our work? Leave us a Google review!",
      wa: "💬 Questions? Message us on WhatsApp",
      cargando: "Loading your project…",
      errLink: "This link is incomplete — please ask Max Power for your project link.",
      errAbrir: "We couldn't open this link. It may have been renewed — please ask Max Power for a fresh one.",
      reintentar: "Try again",
      res: { paso: "✅ Passed", fallo: "❌ Needs correction", programada: "🗓 Scheduled" }
    } : {
      kicker: "TU PROYECTO CON MAX POWER", pasos: ["Aprobado", "En obra", "Inspecciones", "Terminado"],
      complete: "completado", de: "de", items: "puntos hechos",
      todos: "Te toca a ti — necesitamos tu decisión", necesita: "⏰ La necesitamos antes del ", decidi: "Ya decidí ✓", done: "✓ Hecha",
      fotosT: "Fotos del avance", alcance: "Alcance del trabajo", inspT: "Inspecciones",
      proxT: "Próximos días de trabajo", actividad: "Actividad reciente", docsT: "Documentos",
      aprobar: "Aprobar ✓", aprobado: "✓ Aprobado ", garantiaT: "Tu garantía",
      pagosT: "Pagos", contratoT: "Contrato total", cobradoT: "Pagado a la fecha", saldoT: "Saldo",
      pagadaF: "Pagada ✓", pendienteF: "Pendiente",
      firmar: "Revisar y firmar 🖊", firmadoPor: "🖊 Firmado por ", firmaTitulo: "Firmar este documento",
      firmaNombre: "Tu nombre legal completo", firmaDibuja: "Dibuja tu firma abajo (dedo o mouse)",
      firmaLimpiar: "Borrar", firmaEnviar: "Firmar ✓", firmaCancelar: "Cancelar",
      firmaLegal: "Revisé este documento y acepto sus términos. Se guardará mi nombre, mi firma, la fecha, la hora y el dispositivo.",
      modoEscribir: "Escribe tu firma", modoDibujar: "Prefiero dibujarla",
      firmaConsent: "Marca la casilla de consentimiento para firmar.",
      firmaFalta: "Escribe tu nombre y dibuja tu firma, por favor.",
      garantia: "Toda nuestra mano de obra tiene garantía de 1 año desde la entrega. Guarda este link — es el expediente eléctrico de tu casa.",
      resena: "⭐ ¿Quedaste contento? ¡Déjanos tu reseña en Google!",
      wa: "💬 ¿Preguntas? Escríbenos por WhatsApp",
      cargando: "Cargando tu proyecto…",
      errLink: "Este link está incompleto — pídele a Max Power el link de tu proyecto.",
      errAbrir: "No pudimos abrir este link. Puede que se haya renovado — pídele a Max Power uno nuevo.",
      reintentar: "Intentar otra vez",
      res: { paso: "✅ Pasada", fallo: "❌ Necesita corrección", programada: "🗓 Programada" }
    };

    // Iconos de línea (mismo estilo moderno que los botones de la app)
    var ICO = {
      todos: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
      fotos: '<rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7l1.5-2.5h3L15 7"/><circle cx="12" cy="13" r="3.5"/>',
      alcance: '<rect x="3" y="4" width="18" height="17" rx="3"/><path d="m8 12 2.5 2.5L16 9"/>',
      insp: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="m9 12 2 2 4-4"/>',
      prox: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',
      actividad: '<path d="M4 6h16M4 12h16M4 18h10"/>',
      docs: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
      pagos: '<rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5h.01M18 14.5h.01"/>',
      garantia: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/>'
    };
    function tit(icono, texto) {
      return '<span class="cl-tico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        ICO[icono] + '</svg></span>' + esc(texto);
    }

    var t = new URLSearchParams(location.search).get("t") || "";
    var caja = document.getElementById("cl-panel");
    caja.querySelector(".cl-cargando").textContent = TXT.cargando;
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    // Solo enlaces reales (https) — nada de esquemas raros
    function urlSegura(u) { return /^https?:\/\//i.test(String(u || "").trim()) ? String(u).trim() : ""; }
    if (!t) { caja.innerHTML = '<p class="cl-cargando">' + esc(TXT.errLink) + '</p>'; return; }

    function mandar(cuerpo, boton) {
      boton.disabled = true;
      boton.textContent = "…";
      cuerpo.t = t;
      fetch(PORTAL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) })
        .then(function (r) { if (!r.ok) throw new Error("bad"); return cargar(); })
        .catch(function () { boton.disabled = false; boton.textContent = TXT.reintentar; });
    }

    // La llave viaja en el cuerpo del POST — no queda en los registros del
    // servidor. Solo si el guardián es el viejo (contesta 4xx al POST) se
    // reintenta por GET; un fallo de red NO manda la llave por la query.
    function cargar() {
      return fetch(PORTAL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: t }) })
        .then(function (r) {
          if (r.ok) return r.json();
          if (r.status >= 400 && r.status < 500 && r.status !== 401) {
            return fetch(PORTAL + "?t=" + encodeURIComponent(t))
              .then(function (r2) { if (!r2.ok) throw new Error("bad"); return r2.json(); });
          }
          throw new Error("bad");
        })
        .then(pintar);
    }

    cargar()
      .catch(function () {
        caja.innerHTML = '<p class="cl-cargando">' + esc(TXT.errAbrir) + '</p>';
      });

    function pintar(p) {
      var hechas = p.checklist.filter(function (x) { return x.hecho; }).length;
      var total = p.checklist.length;
      var pct = total ? Math.round(hechas / total * 100) : 0;

      var pasos = TXT.pasos;
      var idx = p.estado === "completado" ? 3
        : (p.inspecciones || []).some(function (i) { return i.resultado === "paso"; }) ? 2
        : p.estado === "ejecucion" ? 1 : 0;
      var stepper = pasos.map(function (nombre, i) {
        var clase = i < idx ? "hecho" : i === idx ? "actual" : "";
        return '<div class="cl-paso ' + clase + '"><div class="cl-barra"></div>' + nombre + '</div>';
      }).join("");

      var pendientesDec = (p.decisiones || []).filter(function (d) { return !d.hecha; });
      var todos = (p.decisiones || []).map(function (d) {
        return '<div class="cl-todo' + (d.hecha ? " hecha" : "") + '">' +
          '<span class="cl-todo-txt">' + esc(d.texto) +
          (d.fecha_limite && !d.hecha ? '<span class="cl-todo-fecha">' + esc(TXT.necesita) + esc(d.fecha_limite) + '</span>' : '') +
          '</span>' +
          (d.hecha ? '<span class="cl-aprobado">' + esc(TXT.done) + '</span>'
            : '<button class="cl-boton" data-decision="' + d.id + '">' + esc(TXT.decidi) + '</button>') +
          '</div>';
      }).join("");

      var fotos = (p.fotos || []).filter(function (f) { return urlSegura(f.url); }).map(function (f) {
        var esVideo = /\.(mp4|mov|webm)(\?|$)/i.test(urlSegura(f.url));
        return '<figure class="cl-foto">' +
          (esVideo
            ? '<video src="' + esc(urlSegura(f.url)) + '" controls preload="metadata" playsinline></video>'
            : '<a href="' + esc(urlSegura(f.url)) + '" target="_blank" rel="noopener">' +
              '<img src="' + esc(urlSegura(f.url)) + '" alt="' + esc(f.nota || "Job photo") + '" loading="lazy"></a>') +
          (f.nota || f.fecha ? '<figcaption>' + esc(f.nota || "") + (f.fecha ? " · " + esc(f.fecha) : "") + '</figcaption>' : '') +
          '</figure>';
      }).join("");

      var lista = p.checklist.map(function (x) {
        var texto = lang === "en" ? (x.texto_en || x.texto) : x.texto;
        return '<div class="cl-item' + (x.hecho ? " hecho" : "") + '">' +
          '<span class="cl-check">' + (x.hecho ? "✅" : "⬜") + '</span>' +
          '<span class="cl-txt">' + esc(texto) + '</span></div>';
      }).join("");

      var RES = TXT.res;
      var insp = (p.inspecciones || []).map(function (i) {
        return '<div class="cl-item"><span class="cl-check">' + (RES[i.resultado] || "🗓") + '</span>' +
          '<span class="cl-txt">' + esc(i.tipo) + (i.fecha ? " · " + esc(i.fecha) : "") + '</span></div>';
      }).join("");

      var prox = (p.proximos || []).map(function (e) {
        var tituloEv = lang === "en" ? (e.titulo_en || e.titulo) : e.titulo;
        return '<div class="cl-item"><span class="cl-check">📅</span><span class="cl-txt">' +
          esc(e.fecha) + (e.hora ? " · " + esc(e.hora) : "") + " — " + esc(tituloEv) + '</span></div>';
      }).join("");

      var diario = (p.diario || []).map(function (d) {
        return '<div class="cl-item"><span class="cl-diario-fecha">' + esc(d.fecha) + '</span>' +
          '<span class="cl-txt">' + esc(d.texto) + '</span></div>';
      }).join("");

      // 💵 Pagos — solo llega si Edgar autorizó el dinero de este proyecto
      var pagos = "";
      if (p.dinero) {
        var usd = function (n) { return (Number(n) || 0).toLocaleString("en-US", { style: "currency", currency: "USD" }); };
        var filasF = (p.dinero.facturas || []).map(function (f) {
          return '<div class="cl-item"><span class="cl-check">' + (f.pagada ? "✅" : "🕓") + '</span>' +
            '<span class="cl-txt">' + esc(f.fecha || "") + (f.num ? " · " + esc(f.num) : "") +
            ' — <strong>' + esc(usd(f.monto)) + '</strong> · ' + esc(f.pagada ? TXT.pagadaF : TXT.pendienteF) + '</span></div>';
        }).join("");
        pagos = '<div class="cl-item"><span class="cl-txt">' + esc(TXT.contratoT) + '</span><strong>' + esc(usd(p.dinero.contrato)) + '</strong></div>' +
          '<div class="cl-item"><span class="cl-txt">' + esc(TXT.cobradoT) + '</span><strong style="color:#3E7A20">' + esc(usd(p.dinero.cobrado)) + '</strong></div>' +
          '<div class="cl-item"><span class="cl-txt">' + esc(TXT.saldoT) + '</span><strong>' + esc(usd(p.dinero.falta)) + '</strong></div>' +
          filasF;
      }

      var docs = (p.documentos || []).map(function (d) {
        var aprob = "";
        if (d.pide_firma) {
          aprob = d.firmado_el
            ? ' <span class="cl-aprobado">' + esc(TXT.firmadoPor) + esc(d.firma_nombre || "") + ' · ' + esc(String(d.firmado_el).slice(0, 10)) + '</span>'
            : ' <button class="cl-boton" data-firmar="' + d.id + '" data-titulo="' + esc(d.titulo) + '">' + esc(TXT.firmar) + '</button>';
        } else if (d.pide_aprobacion) {
          aprob = d.aprobado_el
            ? ' <span class="cl-aprobado">' + esc(TXT.aprobado) + esc(String(d.aprobado_el).slice(0, 10)) + '</span>'
            : ' <button class="cl-boton" data-aprobar="' + d.id + '">' + esc(TXT.aprobar) + '</button>';
        }
        if (!urlSegura(d.url)) return '';
        return '<span class="cl-item"><a class="doc-link cl-doc" data-doc="' + d.id + '" target="_blank" rel="noopener" href="' + esc(urlSegura(d.url)) + '">📄 ' + esc(d.titulo) + '</a>' + aprob + '</span>';
      }).join("");

      var emp = (p.empresa || []).map(function (d) {
        var tt = lang === "en" ? (d.titulo_en || d.titulo) : d.titulo;
        if (!urlSegura(d.url)) return '';
        return '<span class="cl-item"><a class="doc-link" target="_blank" rel="noopener" href="' + esc(urlSegura(d.url)) + '">🛡️ ' + esc(tt) + '</a></span>';
      }).join("");

      caja.innerHTML =
        '<div class="cl-hero">' +
          '<div class="kicker">' + esc(TXT.kicker) + '</div>' +
          '<div class="cl-nombre">' + esc(p.nombre) + '</div>' +
          (p.direccion ? '<div class="cl-dir">📍 ' + esc(p.direccion) + '</div>' : '') +
        '</div>' +
        '<div class="cal-panel-card"><div class="cl-pasos">' + stepper + '</div>' +
          (total ? '<div class="barra horas-barra"><div class="barra-relleno ' + (pct >= 100 ? "ok" : "") + '" style="width:' + pct + '%"></div></div>' +
          '<div class="alcance-estado" style="text-align:center;margin-top:.3rem"><strong>' + pct + '%</strong> ' + esc(TXT.complete) + ' · ' + hechas + ' ' + esc(TXT.de) + ' ' + total + ' ' + esc(TXT.items) + '</div>' : '') +
        '</div>' +
        (pendientesDec.length ? '<div class="cal-panel-card"><div class="cal-form-titulo">' + tit("todos", TXT.todos) + '</div>' + todos + '</div>' : '') +
        (fotos ? '<div class="cal-panel-card"><div class="cal-form-titulo">' + tit("fotos", TXT.fotosT) + '</div><div class="cl-fotos">' + fotos + '</div></div>' : '') +
        (total ? '<div class="cal-panel-card"><div class="cal-form-titulo">' + tit("alcance", TXT.alcance) + '</div>' + lista + '</div>' : '') +
        (insp ? '<div class="cal-panel-card"><div class="cal-form-titulo">' + tit("insp", TXT.inspT) + '</div>' + insp + '</div>' : '') +
        (prox ? '<div class="cal-panel-card"><div class="cal-form-titulo">' + tit("prox", TXT.proxT) + '</div>' + prox + '</div>' : '') +
        (diario ? '<div class="cal-panel-card"><div class="cal-form-titulo">' + tit("actividad", TXT.actividad) + '</div>' + diario + '</div>' : '') +
        (pagos ? '<div class="cal-panel-card"><div class="cal-form-titulo">' + tit("pagos", TXT.pagosT) + '</div>' + pagos + '</div>' : '') +
        (docs ? '<div class="cal-panel-card"><div class="cal-form-titulo">' + tit("docs", TXT.docsT) + '</div>' + docs + '</div>' : '') +
        (emp ? '<div class="cal-panel-card"><div class="cal-form-titulo">' + tit("docs", TXT.licT) + '</div>' + emp + '</div>' : '') +
        (p.estado === "completado" ? '<div class="cal-panel-card" style="text-align:center">' +
          '<div class="cal-form-titulo">' + tit("garantia", TXT.garantiaT) + '</div>' +
          '<p class="alcance-estado" style="font-size:0.9rem">' + esc(TXT.garantia) + '</p>' +
          (RESENA ? '<a class="doc-link" target="_blank" rel="noopener" href="' + esc(RESENA) + '">' + esc(TXT.resena) + '</a>' : '') +
          '</div>' : '') +
        '<a class="cl-wa" target="_blank" rel="noopener" href="' + WHATSAPP + '">' + esc(TXT.wa) + '</a>';

      caja.querySelectorAll("[data-aprobar]").forEach(function (b) {
        b.addEventListener("click", function () { mandar({ accion: "aprobar_doc", id: Number(b.dataset.aprobar) }, b); });
      });
      caja.querySelectorAll("[data-decision]").forEach(function (b) {
        b.addEventListener("click", function () { mandar({ accion: "decision_lista", id: Number(b.dataset.decision) }, b); });
      });
      // Cuando el cliente abre un documento queda constancia (mejor esfuerzo)
      caja.querySelectorAll(".cl-doc[data-doc]").forEach(function (a) {
        a.addEventListener("click", function () {
          fetch(PORTAL, { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
            body: JSON.stringify({ t: t, accion: "visto_doc", id: Number(a.dataset.doc) }) }).catch(function () {});
        });
      });
      caja.querySelectorAll("[data-firmar]").forEach(function (b) {
        b.addEventListener("click", function () { abrirFirma(Number(b.dataset.firmar), b.dataset.titulo || ""); });
      });
      document.title = "Max Power — " + p.nombre;
    }

    // ---- 🖊 Panel de firma: nombre + firma dibujada ----
    function abrirFirma(docId, titulo) {
      if (document.querySelector(".cl-firma-fondo")) return; // ya hay uno abierto
      var fondo = document.createElement("div");
      fondo.className = "cl-firma-fondo";
      fondo.innerHTML =
        '<div class="cl-firma-caja">' +
          '<h3>' + esc(TXT.firmaTitulo) + '</h3>' +
          '<div class="cl-firma-doc">📄 ' + esc(titulo) + '</div>' +
          '<input type="text" id="cl-firma-nombre" placeholder="' + esc(TXT.firmaNombre) + '" autocomplete="name">' +
          '<div class="cl-firma-tabs" style="display:flex;gap:.5rem;margin:.5rem 0">' +
            '<button type="button" class="cl-boton cl-tab on" id="cl-tab-escribir">✒️ ' + esc(TXT.modoEscribir) + '</button>' +
            '<button type="button" class="cl-boton secundario cl-tab" id="cl-tab-dibujar">🖊 ' + esc(TXT.modoDibujar) + '</button>' +
          '</div>' +
          '<div class="cl-firma-sub" id="cl-firma-sub">' + esc(TXT.firmaDibuja) + '</div>' +
          '<canvas class="cl-firma-lienzo" width="640" height="260" style="width:100%;height:auto;touch-action:none"></canvas>' +
          '<label class="cl-firma-nota" style="display:flex;gap:.5rem;align-items:flex-start;cursor:pointer">' +
            '<input type="checkbox" id="cl-firma-acepto" style="margin-top:.2rem;width:1.1rem;height:1.1rem"> ' +
            '<span>' + esc(TXT.firmaLegal) + '</span></label>' +
          '<div class="cl-firma-botones">' +
            '<button type="button" class="cl-boton" id="cl-firma-ok">' + esc(TXT.firmaEnviar) + '</button>' +
            '<button type="button" class="cl-boton secundario" id="cl-firma-borrar">' + esc(TXT.firmaLimpiar) + '</button>' +
            '<button type="button" class="cl-boton secundario" id="cl-firma-no">' + esc(TXT.firmaCancelar) + '</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(fondo);

      var lienzo = fondo.querySelector(".cl-firma-lienzo");
      var ctx = lienzo.getContext("2d");
      ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.strokeStyle = "#0A2540";
      var trazos = 0, dibujando = false;
      // Dos modos: ESCRIBIR (el nombre sale en letra manuscrita, siempre legible)
      // o DIBUJAR con el dedo. Escribir es el modo inicial.
      var modo = "escribir";
      var nombreInput = fondo.querySelector("#cl-firma-nombre");
      function pintarNombre() {
        ctx.clearRect(0, 0, lienzo.width, lienzo.height);
        var texto = nombreInput.value.trim();
        if (!texto) return;
        var tam = 72;
        ctx.save();
        do {
          ctx.font = "italic " + tam + 'px "Snell Roundhand","Segoe Script","Brush Script MT","Dancing Script",cursive';
          tam -= 4;
        } while (ctx.measureText(texto).width > lienzo.width - 60 && tam > 22);
        ctx.fillStyle = "#0A2540";
        ctx.textBaseline = "middle";
        ctx.fillText(texto, 30, lienzo.height / 2);
        ctx.restore();
      }
      var tabEscribir = fondo.querySelector("#cl-tab-escribir");
      var tabDibujar = fondo.querySelector("#cl-tab-dibujar");
      var subTexto = fondo.querySelector("#cl-firma-sub");
      function ponerModo(m) {
        modo = m;
        tabEscribir.className = "cl-boton cl-tab" + (m === "escribir" ? " on" : " secundario");
        tabDibujar.className = "cl-boton cl-tab" + (m === "dibujar" ? " on" : " secundario");
        ctx.clearRect(0, 0, lienzo.width, lienzo.height); trazos = 0;
        if (m === "escribir") { subTexto.textContent = ""; pintarNombre(); }
        else subTexto.textContent = TXT.firmaDibuja;
      }
      tabEscribir.addEventListener("click", function () { ponerModo("escribir"); });
      tabDibujar.addEventListener("click", function () { ponerModo("dibujar"); });
      nombreInput.addEventListener("input", function () { if (modo === "escribir") pintarNombre(); });
      function xy(e) {
        var r = lienzo.getBoundingClientRect();
        return [(e.clientX - r.left) * (lienzo.width / r.width), (e.clientY - r.top) * (lienzo.height / r.height)];
      }
      lienzo.addEventListener("pointerdown", function (e) {
        if (modo !== "dibujar") return;
        e.preventDefault(); dibujando = true;
        lienzo.setPointerCapture(e.pointerId);
        var p0 = xy(e); ctx.beginPath(); ctx.moveTo(p0[0], p0[1]);
      });
      lienzo.addEventListener("pointermove", function (e) {
        if (!dibujando) return;
        var p1 = xy(e); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
        trazos++; // solo cuenta tinta de verdad, no toques sueltos
      });
      lienzo.addEventListener("pointerup", function () { dibujando = false; });
      lienzo.addEventListener("pointercancel", function () { dibujando = false; });
      fondo.querySelector("#cl-firma-borrar").addEventListener("click", function () {
        ctx.clearRect(0, 0, lienzo.width, lienzo.height); trazos = 0;
        if (modo === "escribir") pintarNombre();
      });
      fondo.querySelector("#cl-firma-no").addEventListener("click", function () { fondo.remove(); });
      fondo.querySelector("#cl-firma-ok").addEventListener("click", function () {
        var nombre = fondo.querySelector("#cl-firma-nombre").value.trim();
        if (!fondo.querySelector("#cl-firma-acepto").checked) { alert(TXT.firmaConsent); return; }
        if (modo === "escribir") {
          if (!nombre) { alert(TXT.firmaFalta); return; }
          pintarNombre(); // asegura que el lienzo tenga la firma final
        } else if (!nombre || trazos === 0) { alert(TXT.firmaFalta); return; }
        var b = fondo.querySelector("#cl-firma-ok");
        b.disabled = true; b.textContent = "…";
        fetch(PORTAL, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ t: t, accion: "firmar_doc", id: docId, nombre: nombre, firma: lienzo.toDataURL("image/png") })
        }).then(function (r) {
          if (!r.ok) throw new Error("bad");
          fondo.remove();
          return cargar();
        }).catch(function () {
          b.disabled = false; b.textContent = TXT.reintentar;
          cargar().catch(function () {}); // refresca por si ya se firmó en otra pestaña
        });
      });
    }
  })();
  </script>
</body>
</html>
