    function conAccion(cuerpo) {
      var c = credencial();
      for (var k in cuerpo) c[k] = cuerpo[k];
      return c;
    }

    function mandar(cuerpo, boton) {
      boton.disabled = true;
      boton.textContent = "…";
      var cred = credencial();
      for (var k in cred) cuerpo[k] = cred[k];
      fetch(PORTAL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) })
        .then(function (r) { if (!r.ok) throw new Error("bad"); return cargar(); })
        .catch(function () { boton.disabled = false; boton.textContent = TXT.reintentar; });
    }

    // La llave viaja en el cuerpo del POST — no queda en los registros del
    // servidor. Solo si el guardián es el viejo (contesta 4xx al POST) se
    // reintenta por GET; un fallo de red NO manda la llave por la query.
    function cargar() {
      return fetch(PORTAL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(credencial()) })
        .then(function (r) {
          if (r.ok) return r.json();
          if (r.status >= 400 && r.status < 500 && r.status !== 401) {
            var q = llaveGC
              ? "?g=" + encodeURIComponent(g) + "&p=" + encodeURIComponent(pObra)
              : "?t=" + encodeURIComponent(t);
            return fetch(PORTAL + q)
              .then(function (r2) { if (!r2.ok) throw new Error("bad"); return r2.json(); });
          }
          throw new Error("bad");
        })
        .then(pintar);
    }

    cargar()
      .catch(function () {
        caja.innerHTML = '<p class="cl-cargando">' + esc(TXT.errAbrir) + '</p>';
      });

    var paqueteActual = null;   // el paquete de la obra, para saber si aplican los tres días
    function pintar(p) {
      paqueteActual = p;
      // Un bloque «Opcional …» o «… (modificado)» es informativo: ni suma ni resta
      // al avance de la obra. Si no, una obra terminada sale al 75 %.
      // Un bloque es INFORMATIVO cuando no es trabajo de esta obra: lo que se
      // aplazó, lo que se modificó, lo opcional y lo de una etapa futura. No
      // lleva palomita ni cuenta para el avance — si no, una obra terminada
      // sale al 77 %. Se reconoce por cómo lo escribe Edgar, en los dos idiomas.
      function esInformativo(x) {
        var g = String((x.grupo_en || x.grupo || "")).trim();
        return /^(opcional|optional|etapa futura|future stage|m[aá]s adelante|later)\b/i.test(g) ||
               /\((modificad[oa]|modified|aplazad[oa]|deferred|pendiente|pending|no se hizo|not performed)[^)]*\)\s*$/i.test(g);
      }
      var deObra = p.checklist.filter(function (x) { return !esInformativo(x); });
      var hechas = deObra.filter(function (x) { return x.hecho; }).length;
      var total = deObra.length;
      var pct = total ? Math.round(hechas / total * 100) : 0;

      var pasos = TXT.pasos;
      var idx = p.estado === "completado" ? 3
        : (p.inspecciones || []).some(function (i) { return i.resultado === "paso"; }) ? 2
        : p.estado === "ejecucion" ? 1 : 0;
      var stepper = pasos.map(function (nombre, i) {
        var clase = i < idx ? "h" : i === idx ? "a" : "";
        return '<div class="pt-paso ' + clase + '"><b></b>' + nombre + '</div>';
      }).join("");

      var usd = function (n) { return (Number(n) || 0).toLocaleString("en-US", { style: "currency", currency: "USD" }); };

      // ---- Los contratos del proyecto (v19) ----
      // Un proyecto puede tener varios SOW alternativos (A, B…). Cada uno con
      // su precio base y sus añadidos sueltos. El cliente elige UNO y marca
      // los extras que quiera; el total se ve al momento. El precio de verdad
      // lo vuelve a calcular el servidor: aquí solo se enseña.
      var paq = p.propuesta || null;
      var sows = paq && paq.propuestas ? paq.propuestas : [];
      var firmadaYa = sows.some(function (s) { return s.estado === "firmada"; });
      var sowElegido = null;
      var opciones = "";
      if (sows.length && !firmadaYa) {
        var varios = sows.length > 1;
        for (var k = 0; k < sows.length; k++) if (sows[k].elegida) { sowElegido = sows[k]; break; }
        opciones = sows.map(function (s) {
          var incluye = (s.incluye || []).slice(0, 14).map(function (x) {
            return '<li>' + esc(typeof x === "string" ? x : (x.item || x.titulo || "")) +
              (x && x.cantidad ? ' <span class="cl-op-cant">×' + esc(x.cantidad) + '</span>' : '') +
              (x && x.by_owner ? ' <span class="cl-op-cant">material by owner</span>' : '') + '</li>';
          }).join("");
          // 12, no 6: quedarse callado a partir de la séptima exclusión en un
          // documento que el cliente firma es la misma enfermedad que el $0 mudo.
          // Coincide con el corte de lineasNoIncluye, así que no se pierde ninguna.
          var noinc = (s.no_incluye || []).slice(0, 12).map(function (x) {
            return '<li>' + esc(typeof x === "string" ? x : (x.texto || "")) + '</li>'; }).join("");
          var adds = (s.addons || []).map(function (a) {
            var marcado = (s.addons_elegidos || []).indexOf(a.id) >= 0;
            return '<label class="cl-add' + (marcado ? ' marcado' : '') + '">' +
              '<input type="checkbox" data-add="' + a.id + '" data-sow="' + s.id + '"' + (marcado ? ' checked' : '') +
                (s.vencida ? ' disabled' : '') + '>' +
              '<span class="cl-add-tit">' + esc(a.titulo) + '</span>' +
              /* (22/09) un DEDUCT no se anuncia con un «+». Antes salía
                 «+ $-12,500.00» en el documento que firma el cliente. */
              '<span class="cl-add-precio' + (Number(a.precio) < 0 ? ' cl-add-deduct' : '') + '">' +
                (Number(a.precio) < 0 ? '− ' + usd(-a.precio) : '+ ' + usd(a.precio)) + '</span></label>';
          }).join("");
          return '<div class="cl-sow' + (s.elegida ? ' elegida' : (varios && sowElegido && sowElegido !== s ? ' apagada' : '')) +
              '" data-sowcard="' + s.id + '" data-base="' + s.precio_base + '" data-pct="' +
              esc(JSON.stringify(s.reparto_pct || [])) + '">' +
            (varios ? '<div class="cl-sow-letra">SOW ' + esc(s.letra_sow) + '</div>' : '') +
            '<div class="cl-op-tit">' + esc(s.titulo || ("SOW " + s.letra_sow)) + '</div>' +
            '<div class="cl-op-precio">' + usd(s.precio_base) + '</div>' +
            (incluye ? '<ul class="cl-op-lista">' + incluye + '</ul>' : '') +
            (noinc ? '<div class="cl-op-no">' + esc(TXT.opcNoInc) + '<ul>' + noinc + '</ul></div>' : '') +
            (adds ? '<div class="cl-adds"><div class="cl-adds-tit">' + esc(TXT.opcAddT) + '</div>' + adds + '</div>' : '') +
            '<div class="cl-sow-cuentas">' +
              '<div class="cl-sow-fila"><span>' + esc(TXT.opcTotal) + '</span><strong data-total="' + s.id + '">' + usd(s.precio_base) + '</strong></div>' +
              '<div class="cl-sow-fila chico"><span>' + esc(TXT.opcHoy2) + '</span><strong data-dep="' + s.id + '">—</strong></div>' +
            '</div>' +
            '<button type="button" class="cl-boton' + (s.elegida ? ' secundario' : '') + '" data-elegir="' + s.id + '"' +
              (s.vencida ? ' disabled style="opacity:.5"' : '') + '>' +
              esc(s.elegida ? TXT.opcElegida : TXT.opcElegir) + '</button>' +
            (s.elegida ? '<div class="cl-sow-nota ok">' + esc(TXT.opcFirmaAqui) + '</div>'
                       : (varios ? '<div class="cl-sow-nota">' + esc(TXT.opcNoElegida) + '</div>' : '')) +
          '</div>';
        }).join("");
        var algunaVencida = sows.some(function (s) { return s.vencida; });
        var vence1 = sows.length && sows[0].vence ? sows[0].vence : null;
        opciones = '<div class="cal-panel-card"><div class="cal-form-titulo">' +
          tit("opciones", sows.length > 1 ? TXT.opcT2 : TXT.opcT) + '</div>' +
          '<p class="alcance-estado" style="margin-bottom:.6rem">' +
            esc(algunaVencida ? TXT.opcVencida : (sows.length > 1 ? TXT.opcSub2 : TXT.opcSub)) +
            (!algunaVencida && vence1 ? ' ' + esc(TXT.opcVence) + esc(vence1) + '.' : '') + '</p>' +
          '<div class="cl-sows' + (sows.length > 1 ? ' dos' : '') + '">' + opciones + '</div></div>';
      }

      var pendientesDec = (p.decisiones || []).filter(function (d) { return !d.hecha; });
      var todos = (p.decisiones || []).map(function (d) {
        return '<div class="cl-todo' + (d.hecha ? " hecha" : "") + '">' +
          '<span class="cl-todo-txt">' + esc(d.texto) +
          (d.fecha_limite && !d.hecha ? '<span class="cl-todo-fecha">' + esc(TXT.necesita) + esc(d.fecha_limite) + '</span>' : '') +
          '</span>' +
          (d.hecha ? '<span class="cl-aprobado">' + esc(TXT.done) + '</span>'
            : '<button class="cl-boton" data-decision="' + d.id + '">' + esc(TXT.decidi) + '</button>') +
          '</div>';
      }).join("");

      var fotos = (p.fotos || []).filter(function (f) { return urlSegura(f.url); }).map(function (f) {
        var esVideo = /\.(mp4|mov|webm)(\?|$)/i.test(urlSegura(f.url));
        return '<figure class="cl-foto">' +
          (esVideo
            ? '<video src="' + esc(urlSegura(f.url)) + '" controls preload="metadata" playsinline></video>'
            : '<a href="' + esc(urlSegura(f.url)) + '" target="_blank" rel="noopener">' +
              '<img src="' + esc(urlSegura(f.url)) + '" alt="' + esc(f.nota || "Job photo") + '" loading="lazy"></a>') +
          (f.nota || f.fecha ? '<figcaption>' + esc(f.nota || "") + (f.fecha ? " · " + esc(f.fecha) : "") + '</figcaption>' : '') +
          '</figure>';
      }).join("");

      // ---- 🧱 El alcance por bloques (v31) ----
      // Cada punto puede traer su grupo (Fase 1, Generador…). Los bloques
      // terminados salen plegados; los que van en camino, abiertos. Si ningún
      // punto trae grupo, sale una sola lista como toda la vida.
      var bloques = [];
      p.checklist.forEach(function (x) {
        var g = (lang === "en" ? (x.grupo_en || x.grupo) : (x.grupo || x.grupo_en)) || "";
        var B = null;
        for (var bi = 0; bi < bloques.length; bi++) if (bloques[bi].n === g) { B = bloques[bi]; break; }
        if (!B) bloques.push(B = { n: g, items: [] });
        B.items.push(x);
      });
      var hayGrupos = bloques.length > 1 || (bloques.length === 1 && bloques[0].n);
      function puntoHTML(x) {
        var texto = lang === "en" ? (x.texto_en || x.texto) : x.texto;
        if (esInformativo(x)) {
          return '<div class="pt-it info"><span class="pt-it-c">·</span><span>' + esc(texto) + '</span></div>';
        }
        return '<div class="pt-it' + (x.hecho ? " h" : "") + '">' +
          '<span class="pt-it-c">' + (x.hecho ? "✓" : "") + '</span>' +
          '<span>' + esc(texto) + '</span></div>';
      }
      function barraHTML(pc, cls) {
        return '<div class="pt-bar"><div class="pt-bar-in ' + (cls || "") + '" style="width:' + pc + '%"></div></div>';
      }
      var lista = !hayGrupos
        ? '<div class="pt-grp-items">' + p.checklist.map(puntoHTML).join("") + '</div>'
        : bloques.map(function (B) {
            if (B.items.length && esInformativo(B.items[0])) {
              return '<details class="pt-grp info" open><summary>' +
                '<span class="pt-grp-n">' + esc(B.n) + '</span>' +
                '<span class="pt-grp-c">' + esc(TXT.soloInfo) + '</span></summary>' +
                '<div class="pt-grp-items">' + B.items.map(puntoHTML).join("") + '</div></details>';
            }
            var hechosB = B.items.filter(function (x) { return x.hecho; }).length;
            var todosB = hechosB === B.items.length;
            var pctB = Math.round(hechosB / B.items.length * 100);
            return '<details class="pt-grp"' + (todosB ? "" : " open") + '>' +
              '<summary><span class="pt-grp-n">' + esc(B.n || TXT.alcance) + '</span>' +
              '<span class="pt-grp-c' + (todosB ? " ok" : "") + '">' +
                (todosB ? esc(TXT.grupoListo) : hechosB + " " + esc(TXT.deTotal) + " " + B.items.length + " " + esc(TXT.grupoDe)) +
              '</span>' + barraHTML(pctB, todosB ? "ok" : "") + '</summary>' +
              '<div class="pt-grp-items">' + B.items.map(puntoHTML).join("") + '</div></details>';
          }).join("");

      var RES = TXT.res;
      var insp = (p.inspecciones || []).map(function (i) {
        return '<div class="cl-item"><span class="cl-check">' + (RES[i.resultado] || "🗓") + '</span>' +
          '<span class="cl-txt">' + esc(i.tipo) + (i.fecha ? " · " + esc(i.fecha) : "") + '</span></div>';
      }).join("");

      // ---- 📅 Las visitas, con su bloque de calendario ----
      // La fecha llega como 2026-09-18: se parte a mano para que no se corra un
      // día por la hora del teléfono.
      function bloqueFecha(iso) {
        var t = String(iso || "").split("-");
        if (t.length !== 3) return "";
        var d = new Date(Number(t[0]), Number(t[1]) - 1, Number(t[2]));
        if (isNaN(d.getTime())) return "";
        return '<div class="pt-fecha"><span>' + esc(TXT.meses[d.getMonth()]) + '</span>' +
          '<b>' + Number(t[2]) + '</b><span>' + esc(TXT.dias[d.getDay()]) + '</span></div>';
      }
      // «2026-09-18» → «Thu, Sep 18» / «jue, 18 sep»
      function fechaCorta(iso) {
        var t = String(iso || "").split("-");
        if (t.length !== 3) return esc(iso || "");
        var d = new Date(Number(t[0]), Number(t[1]) - 1, Number(t[2]));
        if (isNaN(d.getTime())) return esc(iso);
        var linda = function (x) { return x.charAt(0) + x.slice(1).toLowerCase(); };
        var dia = linda(TXT.dias[d.getDay()]), mes = linda(TXT.meses[d.getMonth()]);
        return lang === "en" ? dia + ", " + mes + " " + Number(t[2]) : dia + " " + Number(t[2]) + " " + mes;
      }
      var prox = (p.proximos || []).map(function (e) {
        var tituloEv = lang === "en" ? (e.titulo_en || e.titulo) : e.titulo;
        return '<div class="pt-ev">' + bloqueFecha(e.fecha) +
          '<div class="pt-ev-c"><div class="pt-ev-t">' + esc(tituloEv) + '</div>' +
          '<div class="pt-ev-s">' + fechaCorta(e.fecha) + (e.hora ? " · " + esc(e.hora) : "") + '</div></div></div>';
      }).join("");

      var diario = (p.diario || []).map(function (d) {
        return '<div class="cl-item"><span class="cl-diario-fecha">' + esc(d.fecha) + '</span>' +
          '<span class="cl-txt">' + esc(d.texto) + '</span></div>';
      }).join("");

      // ---- 💵 Pagos — solo llega si Edgar autorizó el dinero de esta obra ----
      // v31: el mismo detalle que lleva el estado de cuenta en papel — las
      // cuatro cifras arriba y la tabla de hitos con qué dispara cada pago.
      var pagos = "", debeAhora = 0, facturasAbiertas = 0;
      if (p.dinero) {
        debeAhora = Number(p.dinero.por_cobrar) || 0;
        facturasAbiertas = (p.dinero.facturas || []).filter(function (f) { return (Number(f.saldo) || 0) > 0; }).length;
        var contratoN = Number(p.dinero.contrato) || 0;
        var cobradoN = Number(p.dinero.cobrado) || 0;
        var pctPag = contratoN > 0 ? Math.round(cobradoN / contratoN * 1000) / 10 : 0;
        var porFacturarN = Number(p.dinero.por_facturar) || 0;
        var hitosPend = (p.dinero.hitos || []).filter(function (h) { return h.estado === "pendiente"; }).length;

        var filasF = (p.dinero.facturas || []).map(function (f) {
          // v22: con pago parcial se dice lo cobrado y lo que queda
          var parcial = (typeof f.saldo === "number" && f.saldo > 0 && f.cobrado > 0);
          var estadoF = f.pagada ? TXT.pagadaF
            : parcial ? (TXT.cobradoT + " " + usd(f.cobrado) + " · " + TXT.saldoT + " " + usd(f.saldo))
            : TXT.pendienteF;
          return '<div class="cl-item"><span class="cl-check">' + (f.pagada ? "✅" : parcial ? "◐" : "🕓") + '</span>' +
            '<span class="cl-txt">' + esc(f.fecha || "") + (f.num ? " · " + esc(f.num) : "") +
            ' — <strong>' + esc(usd(f.monto)) + '</strong> · ' + esc(estadoF) + '</span></div>';
        }).join("");

        var filasH = (p.dinero.hitos || []).map(function (h) {
          var etiqueta, pastilla;
          if (h.estado === "cobrado") {
            etiqueta = '<span class="pt-pill ok">' + esc(TXT.hPagado) + ' ✓</span>';
            pastilla = (h.factura ? esc(TXT.hFactura) + " " + esc(h.factura) : "") +
                       (h.pagada_el ? " · " + esc(String(h.pagada_el).slice(0, 10)) : "");
          } else if (h.estado === "facturado") {
            etiqueta = '<span class="pt-pill due">' + esc(TXT.debeAhoraT) + '</span>';
            pastilla = esc(TXT.facturadaEl) + (h.fecha ? " " + esc(h.fecha) : "") +
                       (h.factura ? " · " + esc(h.factura) : "");
          } else {
            etiqueta = '<span class="pt-pill">' + esc(TXT.hProximo) + '</span>';
            pastilla = esc(TXT.hPorFacturar);
          }
          return '<div class="pt-row ' + esc(h.estado || "pendiente") + '">' +
            '<div class="pt-row-t">' + esc(hitoEn(h.titulo || "")) +
              (h.condicion ? '<div class="pt-row-c">' + esc(hitoEn(h.condicion)) + '</div>' : '') + '</div>' +
            '<div class="pt-row-m">' + esc(usd(h.monto)) + '</div>' +
            '<div class="pt-row-e">' + etiqueta + '<span class="pt-meta">' + pastilla + '</span></div></div>';
        }).join("");

        pagos =
          '<div class="pt-sum">' +
            '<div class="pt-tile"><div class="pt-tile-k">' + esc(TXT.contratoT) + '</div>' +
              '<div class="pt-tile-v">' + esc(usd(contratoN)) + '</div></div>' +
            '<div class="pt-tile ok"><div class="pt-tile-k">' + esc(TXT.cobradoT) + '</div>' +
              '<div class="pt-tile-v">' + esc(usd(cobradoN)) + '</div>' +
              '<div class="pt-tile-s">' + pctPag + '% ' + esc(TXT.pctPagado) + '</div>' + barraHTML(pctPag, "ok") + '</div>' +
            '<div class="pt-tile' + (debeAhora > 0 ? ' due' : '') + '"><div class="pt-tile-k">' +
              esc(debeAhora > 0 ? TXT.debeAhoraT : TXT.saldoT) + '</div>' +
              '<div class="pt-tile-v">' + esc(usd(debeAhora > 0 ? debeAhora : (Number(p.dinero.falta) || 0))) + '</div>' +
              (debeAhora > 0 ? '<div class="pt-tile-s">' +
                (facturasAbiertas === 1 ? esc(TXT.unaFactura) : facturasAbiertas + esc(TXT.variasFacturas)) + '</div>' : '') + '</div>' +
            '<div class="pt-tile"><div class="pt-tile-k">' + esc(TXT.sinFacturarT) + '</div>' +
              '<div class="pt-tile-v">' + esc(usd(porFacturarN)) + '</div>' +
              (hitosPend ? '<div class="pt-tile-s">' + hitosPend + esc(TXT.hitosDelante) + '</div>' : '') + '</div>' +
          '</div>' +
          (filasH ? '<div class="pt-h" style="margin-top:.4rem">' + esc(TXT.planPagosT) +
                    '<span class="pt-hr">' + esc(TXT.planPagosS) + '</span></div>' + filasH : "") +
          (filasF ? '<details class="pt-grp" style="margin-top:.6rem"><summary>' +
                      '<span class="pt-grp-n">' + esc(TXT.fTitulo) + '</span>' +
                      '<span class="pt-grp-c">' + (p.dinero.facturas || []).length + '</span></summary>' +
                    '<div style="margin-top:.4rem">' + filasF + '</div></details>' : "");
      }

      // Quien solo coordina la obra mira, pero no firma ni aprueba: quien contrata
      // es el dueño de la propiedad. En vez de un botón que el guardián va a negar,
      // se le dice con todas las letras.
      var puedeFirmarYo = !p.gc || p.gc.puede_firmar;
      var primerDoc = true;
      var docs = (p.documentos || []).map(function (d) {
        if (!urlSegura(d.url)) return '';
        var acciones = "", detalle = "";
        if (!puedeFirmarYo && (d.pide_firma || d.pide_aprobacion)) {
          detalle = esc(TXT.gcSoloMirar);
        } else if (d.pide_firma) {
          // v19: solo se firma el contrato del SOW que el cliente eligió
          var suSow = null;
          for (var si = 0; si < sows.length; si++) if (sows[si].id === d.propuesta_id) suSow = sows[si];
          var bloqueado = !!(d.propuesta_id && suSow && !suSow.elegida && sows.length > 1);
          if (d.firmado_el) {
            detalle = esc(TXT.firmadoPor) + esc(d.firma_nombre || "") + ' · ' + esc(String(d.firmado_el).slice(0, 10)) +
              (d.contrafirma_el ? ' · ' + esc(TXT.ambos) : '');
          } else if (bloqueado) {
            detalle = esc(TXT.opcNoElegida);
          } else {
            acciones = '<button class="cl-boton" data-firmar="' + d.id + '" data-titulo="' + esc(d.titulo) + '"' +
              ' data-url="' + esc(urlSegura(d.url)) + '" data-visto="' + (d.visto_el ? 1 : 0) + '"' +
              ' data-consentido="' + (d.consentido ? 1 : 0) + '">' + esc(TXT.firmar) + '</button>' +
              '<button class="cl-boton secundario" data-cambio="' + d.id + '">' + esc(TXT.cambioBtn) + '</button>';
          }
          if (d.vence && !d.firmado_el) detalle = (detalle ? detalle + ' · ' : '') + esc(TXT.opcVence) + esc(d.vence);
        } else if (d.pide_aprobacion) {
          if (d.aprobado_el) detalle = esc(TXT.aprobado) + esc(String(d.aprobado_el).slice(0, 10));
          else acciones = '<button class="cl-boton" data-aprobar="' + d.id + '">' + esc(TXT.aprobar) + '</button>';
        }
        var primero = primerDoc; primerDoc = false;
        return '<div class="pt-doc"><div class="pt-doc-i">PDF</div>' +
          '<div class="pt-doc-c">' +
            '<a class="pt-doc-t" data-doc="' + d.id + '" target="_blank" rel="noopener" href="' +
              esc(urlSegura(d.url)) + '">' + esc(d.titulo) + '</a>' +
            (detalle ? '<div class="pt-doc-s">' + detalle + '</div>' : '') +
          '</div>' +
          '<div class="pt-doc-acc">' + acciones +
            '<a class="cl-boton' + (primero ? '' : ' secundario') + '" data-doc="' + d.id +
              '" target="_blank" rel="noopener" href="' + esc(urlSegura(d.url)) + '">' + esc(TXT.abrirBtn) + '</a>' +
          '</div></div>';
      }).join("");

      var emp = (p.empresa || []).map(function (d) {
        var tt = lang === "en" ? (d.titulo_en || d.titulo) : d.titulo;
        if (!urlSegura(d.url)) return '';
        return '<div class="pt-lic"><i>✓</i><a target="_blank" rel="noopener" href="' + esc(urlSegura(d.url)) + '">' +
          esc(tt) + '</a></div>';
      }).join("");

      // ---- 🏔 La cabecera: lo que hay que saber de un vistazo ----
      var ev1 = (p.proximos || [])[0] || null;
      var ev1Tit = ev1 ? (lang === "en" ? (ev1.titulo_en || ev1.titulo) : ev1.titulo) : "";
      var casillas =
        '<div class="pt-tile"><div class="pt-tile-k">' + esc(TXT.progresoT) + '</div>' +
          '<div class="pt-tile-v">' + pct + '% <small>· ' + hechas + ' ' + esc(TXT.deTotal) + ' ' + total + ' ' + esc(TXT.itemsCortos) + '</small></div>' +
          barraHTML(pct) + '</div>' +
        // En una obra TERMINADA no se anuncia ninguna visita: ni una que quedo
        // suelta en el calendario ni un «por programar» que no va a venir.
        (p.estado !== "completado"
          ? '<div class="pt-tile"><div class="pt-tile-k">' + esc(TXT.proxVisitaT) + '</div>' +
            '<div class="pt-tile-v">' + (ev1 ? fechaCorta(ev1.fecha) + (ev1.hora ? ' · ' + esc(ev1.hora) : '') : esc(TXT.sinVisita)) + '</div>' +
            (ev1 ? '<div class="pt-tile-s">' + esc(ev1Tit) + '</div>' : '') + '</div>'
          : '') +
        (p.dinero
          ? '<div class="pt-tile' + (debeAhora > 0 ? ' due' : '') + '"><div class="pt-tile-k">' +
              esc(debeAhora > 0 ? TXT.debeAhoraT : TXT.saldoT) + '</div>' +
              '<div class="pt-tile-v">' + esc(usd(debeAhora > 0 ? debeAhora : (Number(p.dinero.falta) || 0))) + '</div>' +
              (debeAhora > 0 ? '<div class="pt-tile-s">' +
                (facturasAbiertas === 1 ? esc(TXT.unaFactura) : facturasAbiertas + esc(TXT.variasFacturas)) + '</div>' : '') + '</div>' +
            '<div class="pt-tile"><div class="pt-tile-k">' + esc(TXT.cobradoT) + '</div>' +
              '<div class="pt-tile-v">' + esc(usd(p.dinero.cobrado)) + '</div>' +
              '<div class="pt-tile-s">' + ((Number(p.dinero.contrato) || 0) > 0
                ? Math.round((Number(p.dinero.cobrado) || 0) / (Number(p.dinero.contrato) || 1) * 1000) / 10 + '% ' +
                  esc(TXT.deTotal) + ' ' + esc(usd(p.dinero.contrato))
                : '') + '</div>' +
              barraHTML((Number(p.dinero.contrato) || 0) > 0
                ? Math.round((Number(p.dinero.cobrado) || 0) / (Number(p.dinero.contrato) || 1) * 100) : 0, "ok") + '</div>'
          : '');

      var resumenTxt = lang === "en" ? (p.resumen_en || p.resumen) : (p.resumen || p.resumen_en);

      caja.innerHTML =
        (p.gc ? '<div class="cl-volver"><a href="gc.html?g=' + encodeURIComponent(g) + '">&larr; ' + esc(TXT.gcVolver) + '</a>' +
                (p.gc.puede_firmar ? '' : ' <span class="cl-nota-gris">' + esc(TXT.gcSoloMirar) + '</span>') + '</div>' : '') +
        '<section class="pt-hero">' +
          '<div>' +
            '<div class="pt-kicker">' + esc(p.gc ? p.gc.empresa : TXT.kicker) + '</div>' +
            '<div class="pt-nombre">' + esc(p.nombre) + '</div>' +
            (p.direccion ? '<div class="pt-dir">📍 ' + esc(p.direccion) + '</div>' : '') +
            '<div class="pt-estado"><i></i>' + esc(pasos[idx]) + '</div>' +
          '</div>' +
          '<div class="pt-tiles' + (p.dinero ? '' : ' dos') + '">' + casillas + '</div>' +
          '<div class="pt-pasos">' + stepper + '</div>' +
        '</section>' +
        '<div class="cl-col pt-col-main">' +
        opciones +
        (pendientesDec.length ? '<div class="pt-card"><div class="pt-h">' + tit("todos", TXT.todos) + '</div>' + todos + '</div>' : '') +
        (resumenTxt ? '<div class="pt-card"><div class="pt-h">' + tit("donde", TXT.dondeT) + '</div>' +
          '<p class="pt-lead">' + esc(resumenTxt) + '</p></div>' : '') +
        (fotos ? '<div class="pt-card"><div class="pt-h">' + tit("fotos", TXT.fotosT) + '</div><div class="cl-fotos">' + fotos + '</div></div>' : '') +
        (total ? '<div class="pt-card"><div class="pt-h">' + tit("alcance", TXT.alcance) +
          '<span class="pt-hr">' + hechas + ' ' + esc(TXT.deTotal) + ' ' + total + ' ' + esc(TXT.grupoDe) + '</span></div>' + lista + '</div>' : '') +
        (pagos ? '<div class="pt-card"><div class="pt-h">' + tit("pagos", TXT.pagosT) + '</div>' + pagos + '</div>' : '') +
        (docs ? '<div class="pt-card"><div class="pt-h">' + tit("docs", TXT.docsT) + '</div>' + docs + '</div>' : '') +
        (p.estado === "completado" ? '<div class="pt-card" style="text-align:center">' +
          '<div class="pt-h">' + tit("garantia", TXT.garantiaT) + '</div>' +
          '<p class="pt-lead chico">' + esc(TXT.garantia) + '</p>' +
          // v32 del portal manda completado_el: se dice hasta cuándo va (P75)
          (p.completado_el ? (function () {
            var d = new Date(String(p.completado_el).slice(0, 10) + "T12:00:00");
            d.setFullYear(d.getFullYear() + 1);
            var f = d.toLocaleDateString(lang === "en" ? "en-US" : "es-US", { year: "numeric", month: "long", day: "numeric" });
            return '<p class="pt-lead chico"><b>' + esc(lang === "en" ? "Covered until " + f : "Cubierta hasta el " + f) + '</b></p>';
          })() : '') +
          (RESENA ? '<a class="pt-resena" target="_blank" rel="noopener" href="' + esc(RESENA) + '">' + esc(TXT.resena) + '</a>' : '') +
          '</div>' : '') +
        '</div>' +
        // En el escritorio esto va en la columna de la derecha; en el teléfono, debajo
        '<div class="cl-col pt-col-side">' +
        // En una obra TERMINADA no se anuncian días de trabajo: ni los que
        // quedaron sueltos en el calendario ni un «por programar» que no va a venir.
        (p.estado === "completado"
          ? ''
          : '<div class="pt-card"><div class="pt-h">' + tit("prox", TXT.proxT) + '</div>' +
            (prox || '<div class="pt-vacio">' + esc(TXT.sinProx) + '</div>') + '</div>') +
        (insp || p.estado === "ejecucion"
          ? '<div class="pt-card"><div class="pt-h">' + tit("insp", TXT.inspT) + '</div>' +
            (insp || '<div class="pt-vacio">' + esc(TXT.sinInsp) + '</div>') + '</div>' : '') +
        (diario ? '<div class="pt-card"><div class="pt-h">' + tit("actividad", TXT.actividad) + '</div>' + diario + '</div>' : '') +
        '<div class="pt-card"><div class="pt-h">' + tit("contacto", TXT.contactoT) + '</div>' +
          '<div class="pt-contacto"><div class="pt-avatar">EA</div>' +
            '<div><b>Edgar Arboleya</b><span>' + esc(TXT.contactoRol) + '</span>' +
            '<span>(305) 967-9311 · info@mxpes.com</span></div></div>' +
          '<a class="pt-wa" target="_blank" rel="noopener" href="' + WHATSAPP + '">' + esc(TXT.wa) + '</a>' +
        '</div>' +
        (emp ? '<div class="pt-card"><div class="pt-h">' + tit("docs", TXT.licT) + '</div>' + emp + '</div>' : '') +
        '</div>';

      caja.querySelectorAll("[data-aprobar]").forEach(function (b) {
        b.addEventListener("click", function () { mandar({ accion: "aprobar_doc", id: Number(b.dataset.aprobar) }, b); });
      });
      caja.querySelectorAll("[data-decision]").forEach(function (b) {
        b.addEventListener("click", function () { mandar({ accion: "decision_lista", id: Number(b.dataset.decision) }, b); });
      });
      // v19: las casillas de los añadidos recalculan el total al momento
      function cuentasSow(idSow) {
        var card = caja.querySelector('[data-sowcard="' + idSow + '"]');
        if (!card) return { total: 0, marcados: [] };
        var base = Number(card.dataset.base) || 0;
        var pcts = [];
        try { pcts = JSON.parse(card.dataset.pct || "[]"); } catch (e) { pcts = []; }
        var marcados = [], suma = 0;
        card.querySelectorAll("[data-add]").forEach(function (c) {
          var fila = c.closest(".cl-add");
          if (fila) fila.classList.toggle("marcado", c.checked);
          if (c.checked) {
            marcados.push(Number(c.dataset.add));
            /* (22/09) el signo se perdía aquí también: replace(/[^0-9.]/g,"")
               dejaba «− $12,500.00» en 12500 y el total del cliente SUMABA un
               descuento. Se lee el signo antes de tirar los símbolos. */
            var txt = (fila && fila.querySelector(".cl-add-precio") || {}).textContent || "";
            var neg = /^\s*[-\u2212\u2013\u2014]/.test(String(txt));
            var val = Number(String(txt).replace(/[^0-9.]/g, "")) || 0;
            suma += neg ? -val : val;
          }
        });
        var total = base + suma;
        var elT = caja.querySelector('[data-total="' + idSow + '"]');
        if (elT) elT.textContent = usd(total);
        var elD = caja.querySelector('[data-dep="' + idSow + '"]');
        if (elD) elD.textContent = pcts.length ? usd(Math.round(total * pcts[0]) / 100) : "—";
        return { total: total, marcados: marcados };
      }
      caja.querySelectorAll("[data-sowcard]").forEach(function (card) {
        cuentasSow(Number(card.dataset.sowcard));
      });
      caja.querySelectorAll("[data-add]").forEach(function (c) {
        c.addEventListener("change", function () { cuentasSow(Number(c.dataset.sow)); });
      });
      // El cliente elige SU contrato y sus extras, en SU teléfono
      caja.querySelectorAll("[data-elegir]").forEach(function (b) {
        b.addEventListener("click", function () {
          var idSow = Number(b.dataset.elegir);
          var c = cuentasSow(idSow);
          mandar({ accion: "elegir_propuesta", propuesta_id: idSow, addons: c.marcados }, b);
        });
      });
      // Pedir un cambio en vez de firmar: mismo tamaño que firmar, siempre visible
      caja.querySelectorAll("[data-cambio]").forEach(function (b) {
        b.addEventListener("click", function () { abrirCambio(Number(b.dataset.cambio) || null); });
      });
      // Cuando el cliente abre un documento queda constancia (mejor esfuerzo)
      caja.querySelectorAll("a[data-doc]").forEach(function (a) {
        a.addEventListener("click", function () {
          fetch(PORTAL, { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
            body: JSON.stringify(conAccion({ accion: "visto_doc", id: Number(a.dataset.doc) })) }).catch(function () {});
        });
      });
      caja.querySelectorAll("[data-firmar]").forEach(function (b) {
        b.addEventListener("click", function () {
          var id = Number(b.dataset.firmar);
          var abrir = function () {
            abrirFirma(id, b.dataset.titulo || "", b.dataset.url || "", b.dataset.visto === "1");
          };
          // Los avisos y el permiso van ANTES de abrir el contrato
          if (b.dataset.consentido === "1") abrir();
          else pedirConsentimiento(id, abrir);
        });
      });
      document.title = "Max Power — " + p.nombre;
    }

    // ---- ✏️ Pedir un cambio en vez de firmar ----
    // Que nadie firme por no tener salida: está a un toque y del mismo
    // tamaño que el botón de firmar.
    function abrirCambio(docId) {
      if (document.querySelector(".cl-firma-fondo")) return;
      var fondo = document.createElement("div");
      fondo.className = "cl-firma-fondo";
      fondo.innerHTML =
        '<div class="cl-firma-caja">' +
          '<h3>' + esc(TXT.cambioTit) + '</h3>' +
          '<p class="cl-firma-nota" style="font-size:.9rem">' + esc(TXT.cambioSub) + '</p>' +
          '<textarea id="cl-cambio-txt" rows="5" style="width:100%;font:inherit;font-size:16px;' +
            'border:1px solid var(--mp-line);border-radius:10px;padding:.6rem"></textarea>' +
          '<div class="cl-firma-botones">' +
            '<button type="button" class="cl-boton" id="cl-cambio-ok">' + esc(TXT.cambioEnviar) + '</button>' +
            '<button type="button" class="cl-boton secundario" id="cl-cambio-no">' + esc(TXT.firmaCancelar) + '</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(fondo);
      fondo.querySelector("#cl-cambio-no").addEventListener("click", function () { fondo.remove(); });
      fondo.querySelector("#cl-cambio-ok").addEventListener("click", function () {
        var txt = fondo.querySelector("#cl-cambio-txt").value.trim();
        if (!txt) return;
        var b = fondo.querySelector("#cl-cambio-ok");
        b.disabled = true; b.textContent = "…";
        fetch(PORTAL, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(conAccion({ accion: "pedir_cambio", id: docId, texto: txt }))
        }).then(function (r) {
          if (!r.ok) throw new Error("bad");
          fondo.innerHTML = '<div class="cl-firma-caja" style="text-align:center">' +
            '<h3>' + esc(TXT.cambioOk) + '</h3>' +
            '<button type="button" class="cl-boton" id="cl-cambio-fin">' + esc(TXT.firmadoOk) + '</button></div>';
          fondo.querySelector("#cl-cambio-fin").addEventListener("click", function () { fondo.remove(); });
          return cargar();
        }).catch(function () { b.disabled = false; b.textContent = TXT.reintentar; });
      });
    }

    // ---- ✅ El consentimiento: va ANTES de abrir el contrato ----
    // El aviso de gravámenes y el de cancelar se exigen "por escrito", y en
    // electrónico solo valen si el cliente consintió primero.
    function pedirConsentimiento(docId, seguir) {
      var fondo = document.createElement("div");
      fondo.className = "cl-firma-fondo";
      fondo.innerHTML =
        '<div class="cl-firma-caja">' +
          '<h3>' + esc(TXT.consentTit) + '</h3>' +
          '<p class="cl-firma-nota" style="font-size:.9rem">' + esc(TXT.consentSub) + '</p>' +
          '<ul class="cl-op-lista" style="font-size:.88rem">' +
            // A una empresa o en propiedad comercial no se le promete el aviso de gravámenes
            // ni los tres días: solo queda el punto de la firma electrónica.
            ((paqueteActual && (paqueteActual.gc || paqueteActual.sin_tres_dias)) ? TXT.consentPuntos.slice(-1) : TXT.consentPuntos)
              .map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") +
          '</ul>' +
          '<label class="cl-firma-nota" style="display:flex;gap:.5rem;align-items:flex-start;cursor:pointer">' +
            '<input type="checkbox" id="cl-cons-ok" style="margin-top:.2rem;width:1.1rem;height:1.1rem"> ' +
            '<span>' + esc(TXT.consentCaja) + '</span></label>' +
          '<div class="cl-firma-botones">' +
            '<button type="button" class="cl-boton" id="cl-cons-seguir">' + esc(TXT.consentSeguir) + '</button>' +
            '<button type="button" class="cl-boton secundario" id="cl-cons-no">' + esc(TXT.consentNo) + '</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(fondo);
      fondo.querySelector("#cl-cons-no").addEventListener("click", function () { fondo.remove(); });
      fondo.querySelector("#cl-cons-seguir").addEventListener("click", function () {
        if (!fondo.querySelector("#cl-cons-ok").checked) { alert(TXT.firmaConsent); return; }
        var b = fondo.querySelector("#cl-cons-seguir");
        b.disabled = true; b.textContent = "…";
        fetch(PORTAL, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(conAccion({ accion: "consentir", id: docId }))
        }).then(function (r) {
          if (!r.ok) throw new Error("bad");
          fondo.remove(); seguir();
        }).catch(function () { b.disabled = false; b.textContent = TXT.reintentar; });
      });
    }

    // ---- 🖊 Panel de firma: nombre + firma dibujada ----
    // yaLeyo: el botón de firmar solo se activa cuando el cliente ya abrió
    // el documento (antes, o desde el enlace de este mismo panel).
    function abrirFirma(docId, titulo, urlDoc, yaLeyo) {
      if (document.querySelector(".cl-firma-fondo")) return; // ya hay uno abierto
      var fondo = document.createElement("div");
      fondo.className = "cl-firma-fondo";
      var puerta = !yaLeyo && urlDoc
        ? '<a class="cl-boton secundario" id="cl-firma-leer" target="_blank" rel="noopener" href="' + esc(urlDoc) + '"' +
          ' style="display:block;text-align:center;margin-bottom:.5rem">' + esc(TXT.leerPrimero) + '</a>' +
          '<div class="cl-firma-nota" id="cl-firma-leer-nota">' + esc(TXT.leerNota) + '</div>'
        : '';
      fondo.innerHTML =
        '<div class="cl-firma-caja">' +
          '<h3>' + esc(TXT.firmaTitulo) + '</h3>' +
          '<div class="cl-firma-doc">📄 ' + esc(titulo) + '</div>' +
          puerta +
          '<input type="text" id="cl-firma-nombre" placeholder="' + esc(TXT.firmaNombre) + '" autocomplete="name">' +
          '<div class="cl-firma-tabs" style="display:flex;gap:.5rem;margin:.5rem 0">' +
            '<button type="button" class="cl-boton cl-tab on" id="cl-tab-escribir">✒️ ' + esc(TXT.modoEscribir) + '</button>' +
            '<button type="button" class="cl-boton secundario cl-tab" id="cl-tab-dibujar">🖊 ' + esc(TXT.modoDibujar) + '</button>' +
          '</div>' +
          '<div class="cl-firma-sub" id="cl-firma-sub">' + esc(TXT.firmaDibuja) + '</div>' +
          '<canvas class="cl-firma-lienzo" width="640" height="260" style="width:100%;height:auto;touch-action:none"></canvas>' +
          '<label class="cl-firma-nota" style="display:flex;gap:.5rem;align-items:flex-start;cursor:pointer">' +
            '<input type="checkbox" id="cl-firma-dos" style="margin-top:.2rem;width:1.1rem;height:1.1rem"> ' +
            '<span>' + esc(TXT.dosFirmas) + '</span></label>' +
          '<div id="cl-firma2" hidden>' +
            '<input type="text" id="cl-firma2-nombre" placeholder="' + esc(TXT.firma2Nombre) + '" autocomplete="name">' +
            '<div class="cl-firma-sub">' + esc(TXT.firma2Dibuja) + '</div>' +
            '<canvas class="cl-firma-lienzo" id="cl-firma2-lienzo" width="640" height="200" style="width:100%;height:auto;touch-action:none"></canvas>' +
          '</div>' +
          '<label class="cl-firma-nota" style="display:flex;gap:.5rem;align-items:flex-start;cursor:pointer">' +
            '<input type="checkbox" id="cl-firma-acepto" style="margin-top:.2rem;width:1.1rem;height:1.1rem"> ' +
            '<span>' + esc(TXT.firmaLegal) + '</span></label>' +
          '<div class="cl-firma-botones">' +
            '<button type="button" class="cl-boton" id="cl-firma-ok"' + (!yaLeyo && urlDoc ? ' disabled style="opacity:.5"' : '') + '>' + esc(TXT.firmaEnviar) + '</button>' +
            '<button type="button" class="cl-boton secundario" id="cl-firma-borrar">' + esc(TXT.firmaLimpiar) + '</button>' +
            '<button type="button" class="cl-boton secundario" id="cl-firma-cambio">' + esc(TXT.cambioBtn) + '</button>' +
            '<button type="button" class="cl-boton secundario" id="cl-firma-no">' + esc(TXT.firmaCancelar) + '</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(fondo);

      // La puerta: al abrir el documento desde aquí, queda registrado como
      // visto y el botón de firmar se desbloquea.
      var linkLeer = fondo.querySelector("#cl-firma-leer");
      if (linkLeer) {
        linkLeer.addEventListener("click", function () {
          fetch(PORTAL, { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
            body: JSON.stringify(conAccion({ accion: "visto_doc", id: docId })) }).catch(function () {});
          var ok = fondo.querySelector("#cl-firma-ok");
          ok.disabled = false; ok.style.opacity = "";
          var nota = fondo.querySelector("#cl-firma-leer-nota");
          if (nota) nota.textContent = "✓";
        });
      }

      var lienzo = fondo.querySelector(".cl-firma-lienzo");
      var ctx = lienzo.getContext("2d");
      ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.strokeStyle = "#0A2540";
      var trazos = 0, dibujando = false;
      // Dos modos: ESCRIBIR (el nombre sale en letra manuscrita, siempre legible)
      // o DIBUJAR con el dedo. Escribir es el modo inicial.
      var modo = "escribir";
      var nombreInput = fondo.querySelector("#cl-firma-nombre");
      function pintarNombre() {
        ctx.clearRect(0, 0, lienzo.width, lienzo.height);
        var texto = nombreInput.value.trim();
        if (!texto) return;
        var tam = 72;
        ctx.save();
        do {
          ctx.font = "italic " + tam + 'px "Snell Roundhand","Segoe Script","Brush Script MT","Dancing Script",cursive';
          tam -= 4;
        } while (ctx.measureText(texto).width > lienzo.width - 60 && tam > 22);
        ctx.fillStyle = "#0A2540";
        ctx.textBaseline = "middle";
        ctx.fillText(texto, 30, lienzo.height / 2);
        ctx.restore();
      }
      var tabEscribir = fondo.querySelector("#cl-tab-escribir");
      var tabDibujar = fondo.querySelector("#cl-tab-dibujar");
      var subTexto = fondo.querySelector("#cl-firma-sub");
      function ponerModo(m) {
        modo = m;
        tabEscribir.className = "cl-boton cl-tab" + (m === "escribir" ? " on" : " secundario");
        tabDibujar.className = "cl-boton cl-tab" + (m === "dibujar" ? " on" : " secundario");
        ctx.clearRect(0, 0, lienzo.width, lienzo.height); trazos = 0;
        if (m === "escribir") { subTexto.textContent = ""; pintarNombre(); }
        else subTexto.textContent = TXT.firmaDibuja;
      }
      tabEscribir.addEventListener("click", function () { ponerModo("escribir"); });
      tabDibujar.addEventListener("click", function () { ponerModo("dibujar"); });
      nombreInput.addEventListener("input", function () { if (modo === "escribir") pintarNombre(); });
      function xy(e) {
        var r = lienzo.getBoundingClientRect();
        return [(e.clientX - r.left) * (lienzo.width / r.width), (e.clientY - r.top) * (lienzo.height / r.height)];
      }
      lienzo.addEventListener("pointerdown", function (e) {
        if (modo !== "dibujar") return;
        e.preventDefault(); dibujando = true;
        lienzo.setPointerCapture(e.pointerId);
        var p0 = xy(e); ctx.beginPath(); ctx.moveTo(p0[0], p0[1]);
      });
      lienzo.addEventListener("pointermove", function (e) {
        if (!dibujando) return;
        var p1 = xy(e); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
        trazos++; // solo cuenta tinta de verdad, no toques sueltos
      });
      lienzo.addEventListener("pointerup", function () { dibujando = false; });
      lienzo.addEventListener("pointercancel", function () { dibujando = false; });
      fondo.querySelector("#cl-firma-borrar").addEventListener("click", function () {
        ctx.clearRect(0, 0, lienzo.width, lienzo.height); trazos = 0;
        if (modo === "escribir") pintarNombre();
      });
      // ---- El segundo firmante (casa a nombre de dos) ----
      // Las dos firmas viajan en la MISMA llamada: se sella una sola vez y
      // el plazo de cancelación cuenta desde la última firma.
      var lienzo2 = fondo.querySelector("#cl-firma2-lienzo");
      var ctx2 = lienzo2.getContext("2d");
      ctx2.lineWidth = 3; ctx2.lineCap = "round"; ctx2.lineJoin = "round"; ctx2.strokeStyle = "#0B2036";
      var trazos2 = 0, dibujando2 = false;
      function xy2(e) {
        var r = lienzo2.getBoundingClientRect();
        return [(e.clientX - r.left) * (lienzo2.width / r.width), (e.clientY - r.top) * (lienzo2.height / r.height)];
      }
      lienzo2.addEventListener("pointerdown", function (e) {
        e.preventDefault(); dibujando2 = true; lienzo2.setPointerCapture(e.pointerId);
        var q = xy2(e); ctx2.beginPath(); ctx2.moveTo(q[0], q[1]);
      });
      lienzo2.addEventListener("pointermove", function (e) {
        if (!dibujando2) return;
        var q = xy2(e); ctx2.lineTo(q[0], q[1]); ctx2.stroke(); trazos2++;
      });
      lienzo2.addEventListener("pointerup", function () { dibujando2 = false; });
      lienzo2.addEventListener("pointercancel", function () { dibujando2 = false; });
      var casillaDos = fondo.querySelector("#cl-firma-dos");
      casillaDos.addEventListener("change", function () {
        fondo.querySelector("#cl-firma2").hidden = !casillaDos.checked;
      });

      fondo.querySelector("#cl-firma-no").addEventListener("click", function () { fondo.remove(); });
      fondo.querySelector("#cl-firma-cambio").addEventListener("click", function () {
        fondo.remove(); abrirCambio(docId);
      });
      fondo.querySelector("#cl-firma-ok").addEventListener("click", function () {
        var nombre = fondo.querySelector("#cl-firma-nombre").value.trim();
        if (!fondo.querySelector("#cl-firma-acepto").checked) { alert(TXT.firmaConsent); return; }
        if (modo === "escribir") {
          if (!nombre) { alert(TXT.firmaFalta); return; }
          pintarNombre(); // asegura que el lienzo tenga la firma final
        } else if (!nombre || trazos === 0) { alert(TXT.firmaFalta); return; }
        var cuerpoFirma = conAccion({ accion: "firmar_doc", id: docId, nombre: nombre,
                            firma: lienzo.toDataURL("image/png") });
        if (casillaDos.checked) {
          var n2 = fondo.querySelector("#cl-firma2-nombre").value.trim();
          if (!n2 || trazos2 === 0) { alert(TXT.firma2Falta); return; }
          cuerpoFirma.nombre2 = n2;
          cuerpoFirma.firma2 = lienzo2.toDataURL("image/png");
        }
        var b = fondo.querySelector("#cl-firma-ok");
        b.disabled = true; b.textContent = "…";
        fetch(PORTAL, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(cuerpoFirma)
        }).then(function (r) {
          if (!r.ok) throw new Error("bad");
          // Pantalla de confirmación con su copia
          fondo.innerHTML =
            '<div class="cl-firma-caja" style="text-align:center">' +
              '<h3>' + esc(TXT.firmadoTit) + '</h3>' +
              '<p class="cl-firma-nota" style="font-size:.9rem">' + esc(TXT.firmadoTxt) + '</p>' +
              '<button type="button" class="cl-boton" id="cl-firma-fin">' + esc(TXT.firmadoOk) + '</button>' +
            '</div>';
          fondo.querySelector("#cl-firma-fin").addEventListener("click", function () { fondo.remove(); });
          return cargar();
        }).catch(function () {
          b.disabled = false; b.textContent = TXT.reintentar;
          cargar().catch(function () {}); // refresca por si ya se firmó en otra pestaña
        });
      });
    }
  })();
  </script>
</body>
</html>
