</head>
<body class="cl-portal">
  <div id="vista-app">
    <!-- La barra noche con el logo, «Aa», el idioma y el cable de cobre -->

        <div class="membrete-der">

      <div class="licencia mono">FL EC13016045</div>
    </footer>
  </div>

  <script src="js/portal-frases.js?v=239"></script>
  <script src="assets/logo.js?v=236"></script>
  <script>
  (function () {
    "use strict";
    var PORTAL = "https://zeogjvwcmstmkwxjvykz.supabase.co/functions/v1/portal";
    // El link de Google Reviews del negocio (lo mandó Edgar el 22-sep). Sale en la
    // tarjeta de garantía, solo cuando la obra está TERMINADA.
    var RESENA = "https://search.google.com/local/writereview?placeid=ChIJnT65jEah7C4RYhQfIV31j64";
    // El teléfono de los botones «Call» y «Text» de la tarjeta del contratista
    // (el que pide el pliego de la tanda 3)
    var TEL = "+13059679311";

    var logo = document.getElementById("logo");
    if (logo && window.MAXPOWER_LOGO) logo.src = window.MAXPOWER_LOGO;

    // ---- «Aa»: la letra grande (copia de MP.largeText del brief) ----
    // Todo ×1.25 y el texto secundario más oscuro. Se recuerda en ESTE teléfono.
    var largeText = {
      KEY: "mp-text-large",
      marcar: function () {
        var on = document.documentElement.getAttribute("data-text") === "large";
        var bs = document.querySelectorAll("[data-aa]");
        for (var i = 0; i < bs.length; i++) bs[i].setAttribute("aria-pressed", on ? "true" : "false");
      },
      init: function () {
        try { if (localStorage.getItem(this.KEY) === "1") document.documentElement.setAttribute("data-text", "large"); } catch (e) {}
        var btns = document.querySelectorAll("[data-aa]");
        for (var i = 0; i < btns.length; i++) btns[i].addEventListener("click", largeText.toggle);
        largeText.marcar();
      },
      toggle: function () {
        var root = document.documentElement;
        var on = root.getAttribute("data-text") === "large";
        if (on) root.removeAttribute("data-text"); else root.setAttribute("data-text", "large");
        try { localStorage.setItem(largeText.KEY, on ? "0" : "1"); } catch (e) {}
        largeText.marcar();
      }
    };
    largeText.init();

    // Idioma: inglés por defecto (el de los clientes); ES con el botoncito
    var lang = "en";
    try { lang = localStorage.getItem("mxp_cl_idioma") || "en"; } catch (e) {}
    if (lang !== "es") lang = "en";
    document.documentElement.lang = lang;
    var btnIdioma = document.getElementById("cl-idioma");
    btnIdioma.textContent = lang === "en" ? "ES" : "EN";
    btnIdioma.addEventListener("click", function () {
      try { localStorage.setItem("mxp_cl_idioma", lang === "en" ? "es" : "en"); } catch (e) {}
      location.reload();
    });
    var TXT = lang === "en" ? {
      opcNoInc: "Not included:", opcVence: "This proposal is valid through ",
      opcT: "Your proposal", opcT2: "Your proposals", opcSub: "Tap the one you want. You can change it until you sign.",
      opcSub2: "Two ways to do the work. Choose one; you can change it until you sign.",
      opcAddT: "Optional add-ons", opcTotal: "Total", opcHoy2: "Due today (deposit)",
      opcNoElegida: "Not selected — you can change your mind until you sign",
      opcElegidaSow: "This is the one you chose", opcFirmaAqui: "Sign this one below",
      opcElegida: "Your choice", opcElegir: "Choose this one",
      opcVencida: "This proposal has expired. Message us and we'll send you an updated price.",
      garantia: "All our workmanship is covered by a 1-year warranty from completion. Keep this link — it's your home's electrical file.",
      cargando: "Loading your project…",
      gcSoloMirar: "The property owner signs this job.",
      errLink: "This link is incomplete — please ask Max Power for your project link.",
      errAbrir: "We couldn't open this link. It may have been renewed — please ask Max Power for a fresh one.",
      reintentar: "Try again",
      firmaTitulo: "Sign this document",
      firmaNombre: "Your full legal name", firmaDibuja: "Draw your signature below (finger or mouse)",
      firmaLimpiar: "Clear", firmaEnviar: "Sign", firmaCancelar: "Cancel",
      firmaLegal: "I have reviewed this document and agree to its terms. My name, signature, date, time and device will be recorded.",
      modoEscribir: "Type your signature", modoDibujar: "Draw it instead",
      firmaConsent: "Please check the consent box to sign.",
      firmaFalta: "Please write your name and draw your signature.",
      leerPrimero: "Open and read the document first",
      leerNota: "The sign button unlocks after you open the document.",
      firmadoTit: "Document signed",
      firmadoTxt: "Thank you! Your signed copy, with its signature certificate, will appear in your document list in a few seconds.",
      firmadoOk: "Done",
      cambioBtn: "Request a change instead",
      cambioTit: "What would you like to change?",
      cambioSub: "Tell us in your own words. Nothing is signed and nothing is charged. Edgar gets this right away.",
      cambioEnviar: "Send", cambioOk: "Sent — Edgar will get back to you.",
      consentTit: "Before you sign",
      consentSub: "Florida law asks us to give you these notices in writing, and to have your consent to sign electronically. Please read and check the box.",
      consentPuntos: [
        "Construction Lien Law notice — anyone who works on your home or supplies material and is not paid can file a claim against the house. It is in your contract in full.",
        "You have three business days to cancel, for any reason, at no cost. The exact deadline and the cancellation form come with your signed copy.",
        "Signing electronically has the same legal effect as signing in ink. You can ask for paper at any time, free of charge."
      ],
      consentCaja: "I have read these notices and I agree to sign and receive documents electronically.",
      consentSeguir: "I agree — continue", consentNo: "Not now",
      dosFirmas: "Someone else also signs (both owners)",
      firma2Nombre: "Second signer's full legal name",
      firma2Dibuja: "Second signer: draw your signature",
      firma2Falta: "The second signer needs their name and their signature."
    } : {
      opcNoInc: "No incluye:", opcVence: "Esta propuesta vale hasta el ",
      opcT: "Tu propuesta", opcT2: "Tus propuestas", opcSub: "Toca la que quieras. Puedes cambiarla hasta que firmes.",
      opcSub2: "Dos formas de hacer el trabajo. Elige una; puedes cambiarla hasta que firmes.",
      opcAddT: "Extras opcionales", opcTotal: "Total", opcHoy2: "A pagar hoy (depósito)",
      opcNoElegida: "No elegida — puedes cambiar de idea hasta que firmes",
      opcElegidaSow: "Esta es la que elegiste", opcFirmaAqui: "Firma esta abajo",
      opcElegida: "Tu elección", opcElegir: "Elegir esta",
      opcVencida: "Esta propuesta venció. Escríbenos y te mandamos el precio al día.",
      garantia: "Toda nuestra mano de obra tiene garantía de 1 año desde la entrega. Guarda este link — es el expediente eléctrico de tu casa.",
      cargando: "Cargando tu proyecto…",
      gcSoloMirar: "Esta obra la firma el dueño de la propiedad.",
      errLink: "Este link está incompleto — pídele a Max Power el link de tu proyecto.",
      errAbrir: "No pudimos abrir este link. Puede que se haya renovado — pídele a Max Power uno nuevo.",
      reintentar: "Intentar otra vez",
      firmaTitulo: "Firmar este documento",
      firmaNombre: "Tu nombre legal completo", firmaDibuja: "Dibuja tu firma abajo (dedo o mouse)",
      firmaLimpiar: "Borrar", firmaEnviar: "Firmar", firmaCancelar: "Cancelar",
      firmaLegal: "Revisé este documento y acepto sus términos. Se guardará mi nombre, mi firma, la fecha, la hora y el dispositivo.",
      modoEscribir: "Escribe tu firma", modoDibujar: "Prefiero dibujarla",
      firmaConsent: "Marca la casilla de consentimiento para firmar.",
      firmaFalta: "Escribe tu nombre y dibuja tu firma, por favor.",
      leerPrimero: "Abre y lee el documento primero",
      leerNota: "El botón de firmar se activa después de que abras el documento.",
      firmadoTit: "Documento firmado",
      firmadoTxt: "¡Gracias! Tu copia firmada, con su certificado de firma, aparecerá en tu lista de documentos en unos segundos.",
      firmadoOk: "Listo",
      cambioBtn: "Pedir un cambio",
      cambioTit: "¿Qué te gustaría cambiar?",
      cambioSub: "Dínoslo con tus palabras. No se firma nada ni se cobra nada. A Edgar le llega al momento.",
      cambioEnviar: "Enviar", cambioOk: "Enviado — Edgar te contesta enseguida.",
      consentTit: "Antes de firmar",
      consentSub: "La ley de Florida nos pide darte estos avisos por escrito y tener tu permiso para firmar electrónicamente. Léelos y marca la casilla.",
      consentPuntos: [
        "Aviso de la Ley de Gravámenes — quien trabaje en tu casa o ponga material y no cobre puede reclamar contra la propiedad. Está completo en tu contrato.",
        "Tienes tres días hábiles para cancelar, por el motivo que sea y sin costo. La fecha exacta y el formulario van con tu copia firmada.",
        "Firmar electrónicamente vale igual que firmar con pluma. Puedes pedir papel cuando quieras, gratis."
      ],
      consentCaja: "He leído estos avisos y acepto firmar y recibir documentos electrónicamente.",
      consentSeguir: "Acepto — seguir", consentNo: "Ahora no",
      dosFirmas: "Firma otra persona también (los dos dueños)",
      firma2Nombre: "Nombre legal completo del segundo firmante",
      firma2Dibuja: "Segundo firmante: dibuja tu firma",
      firma2Falta: "Al segundo firmante le falta su nombre o su firma."
    };
    // Los textos nuevos de la tanda 3 viven en js/portal-frases.js, en los dos idiomas
    var NUEVOS = (window.MXP_PORTAL_TXT || {})[lang] || {};
    for (var kN in NUEVOS) TXT[kN] = NUEVOS[kN];
    // Rellena {n}, {d}, {x}, {e} de un texto
    function F(plantilla, datos) {
      return String(plantilla || "").replace(/\{(\w)\}/g, function (m, k) { return datos && datos[k] != null ? datos[k] : ""; });
    }
    var aaBtn = document.querySelector("[data-aa]");
    if (aaBtn && TXT.aaEtiqueta) { aaBtn.setAttribute("aria-label", TXT.aaEtiqueta); aaBtn.title = TXT.aaEtiqueta; }

    // Iconos de línea del oficio: 24×24, trazo 1.7, del color del texto (cobre donde toca)
    var ICO = {
      doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
      pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
      check: '<path d="M5 12l5 5L20 7"/>',
      tel: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
      sms: '<path d="M21 11.5a7.5 7.5 0 0 1-7.5 7.5H6.2L3 21.5l.9-4.6A7.5 7.5 0 1 1 21 11.5z"/>',
      escudo: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="m9 12 2 2 4-4"/>',
      web: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
      play: '<path d="M8 5v14l11-7z"/>',
      cerrar: '<path d="M6 6l12 12M18 6L6 18"/>',
      reloj: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      bajar: '<path d="M6 9l6 6 6-6"/>',
      estrella: '<path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>'
    };
    function svg(nombre, tam, grueso) {
      return '<svg class="cl-ico" width="' + (tam || 24) + '" height="' + (tam || 24) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' +
        (grueso || 1.7) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICO[nombre] + '</svg>';
    }

    // Los hitos se escriben en español en la ficha; al cliente que lee en
    // inglés se le traducen por frase (js/portal-frases.js). Si no está en la
    // lista, sale tal cual: no se inventa nada.
    var FRASES = window.MXP_FRASES || [];
    function hitoEn(t) {
      t = String(t || "").trim();
      if (lang !== "en" || !t) return t;
      for (var i = 0; i < FRASES.length; i++) if (FRASES[i][0].test(t)) return t.replace(FRASES[i][0], FRASES[i][1]);
      return t;
    }

    // ---- Fechas y horas en llano, en el idioma elegido y con la hora de Florida ----
    var LOCALE = lang === "en" ? "en-US" : "es-US";
    var hoyFL = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" }).format(new Date());
    // «2026-09-18» se lee al mediodía: así el día no se corre por la hora del teléfono
    function fechaDe(iso) {
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
      return m ? new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12)) : null;
    }
    function fechaLlano(iso, opciones) {
      var d = fechaDe(iso);
      if (!d) return String(iso || "");
      var o = { timeZone: "America/New_York" };
      var base = opciones || { month: "short", day: "numeric" };
      for (var k in base) o[k] = base[k];
      try { return new Intl.DateTimeFormat(LOCALE, o).format(d); } catch (e) { return String(iso); }
    }
    // La hora llega como «13:00» o como «10:30 AM»: sale como la dice la gente
    function horaLlano(h) {
      var m = /^\s*(\d{1,2}):(\d{2})\s*(?:([AaPp])\.?\s*[Mm]\.?)?\s*$/.exec(String(h || ""));
      if (!m) return String(h || "");
      var hh = Number(m[1]), mm = Number(m[2]);
      if (m[3]) { var pm = /p/i.test(m[3]); if (hh === 12) hh = pm ? 12 : 0; else if (pm) hh += 12; }
      if (hh > 23 || mm > 59) return String(h);
      try {
        return new Intl.DateTimeFormat(LOCALE, { hour: "numeric", minute: "2-digit", timeZone: "UTC" })
          .format(new Date(Date.UTC(2026, 0, 1, hh, mm)));
      } catch (e) { return String(h); }
    }

    var qs = new URLSearchParams(location.search);
    var t = qs.get("t") || "";
    // v20: un contratista entra con la llave de su empresa (g) y la obra (p)
    var g = qs.get("g") || "";
    var pObra = qs.get("p") || "";
    var llaveGC = !!(g && pObra);
    var caja = document.getElementById("cl-panel");
    caja.querySelector(".cl-cargando").textContent = TXT.cargando;
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    // Solo enlaces reales (https) — nada de esquemas raros
    function urlSegura(u) { return /^https?:\/\//i.test(String(u || "").trim()) ? String(u).trim() : ""; }
    if (!t && !llaveGC) { caja.innerHTML = '<p class="cl-cargando">' + esc(TXT.errLink) + '</p>'; return; }
    // Lo que identifica a quien pide: la llave del cliente, o empresa + obra
    function credencial() { return llaveGC ? { g: g, p: pObra } : { t: t }; }
    // Cualquier cosa que se le mande al guardián lleva la llave que toque: la del
    // cliente o la de la empresa. Nunca se escribe «t» a mano.
    function conAccion(cuerpo) {
      var c = credencial();
      for (var k in cuerpo) c[k] = cuerpo[k];
      return c;
    }

    function mandar(cuerpo, boton) {
      boton.disabled = true;
      boton.textContent = "…";
      var cred = credencial();
      for (var k in cred) cuerpo[k] = cred[k];
      fetch(PORTAL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) })
        .then(function (r) { if (!r.ok) throw new Error("bad"); return cargar(); })
        .catch(function () { boton.disabled = false; boton.textContent = TXT.reintentar; });
    }

    // La llave viaja en el cuerpo del POST — no queda en los registros del
    // servidor. Solo si el guardián es el viejo (contesta 4xx al POST) se
    // reintenta por GET; un fallo de red NO manda la llave por la query.
    function cargar() {
      return fetch(PORTAL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(credencial()) })
        .then(function (r) {
          if (r.ok) return r.json();
          if (r.status >= 400 && r.status < 500 && r.status !== 401) {
            var q = llaveGC
              ? "?g=" + encodeURIComponent(g) + "&p=" + encodeURIComponent(pObra)
              : "?t=" + encodeURIComponent(t);
            return fetch(PORTAL + q)
              .then(function (r2) { if (!r2.ok) throw new Error("bad"); return r2.json(); });
          }
          throw new Error("bad");
        })
        .then(pintar);
    }

    cargar()
      .catch(function () {
        caja.innerHTML = '<p class="cl-cargando">' + esc(TXT.errAbrir) + '</p>';
      });

    // Las etapas de la obra como un circuito (copia de MP.renderStages del brief):
    // las pasadas encendidas, la actual latiendo, las que faltan en cobre.
    // En el teléfono las letras van una arriba y otra abajo del cable: a 14 px
    // las cinco no caben en una sola fila sin pisarse.
    function etapasHTML(nombres, actual) {
      var palomita = svg("check", 14, 3);
      var pista = '<div class="stages">', letreros = "";
      nombres.forEach(function (nombre, i) {
        var st = i < actual ? "on" : (i === actual ? "now" : "off");
        pista += '<div class="node ' + st + '">' + (st === "on" ? palomita : "") + '</div>';
        if (i < nombres.length - 1) {
          var seg = i < actual - 1 ? "on" : (i === actual - 1 ? "half" : "");
          pista += '<div class="seg ' + seg + '"></div>';
        }
        var lado = i === 0 ? "ini" : (i === nombres.length - 1 ? "fin" : "centro");
        letreros += '<div class="cl-etapa-l ' + st + ' ' + lado + (i % 2 ? ' abajo' : ' arriba') + '" style="grid-column:' + (i + 1) + '">' + esc(nombre) + '</div>';
      });
      var aria = actual >= nombres.length ? TXT.todasListas : TXT.etapaActual + nombres[actual];
      return '<div class="cl-etapas" role="img" aria-label="' + esc(aria) + '">' + pista + '</div>' + letreros + '</div>';
    }

    // El panel de breakers (copia de MP.renderPanel del brief): impares a la
    // izquierda, pares a la derecha, barras de cobre y el MAIN arriba. Cada
    // breaker es un botón de 44 px que baja a su punto en la lista de abajo.
    function panelHTML(items) {
      var n = items.length, filas = Math.ceil(n / 2), html = "";
      html += '<div class="prow main"><div></div><div class="bkr main on"><div class="h"></div></div>' +
              '<div class="plabel main">MAIN</div></div>';
      function hueco(lado) {
        return '<div class="pslot ' + lado + ' blank">' + (lado === "l" ? '<span class="plabel l"></span><span class="pnum"></span><span class="bkr blank"></span>'
          : '<span class="bkr blank"></span><span class="pnum"></span><span class="plabel r"></span>') + '</div>';
      }
      function slot(item, idx, lado) {
        if (!item) return hueco(lado);
        var st = item.status === "done" ? "on" : (item.status === "now" ? "now" : "off");
        var demora = st === "on" ? ' style="animation-delay:' + (idx * 0.05).toFixed(2) + 's"' : "";
        var bkr = '<span class="bkr ' + st + '"><span class="h"' + demora + '></span></span>';
        var num = '<span class="pnum">' + (idx + 1) + '</span>';
        var lab = '<span class="plabel ' + lado + '">' + esc(item.name) + '</span>';
        return '<button type="button" class="pslot ' + lado + '" data-bkr="' + idx + '" aria-label="' +
          esc(F(TXT.irAlPunto, { n: idx + 1 }) + item.name) + '">' + (lado === "l" ? lab + num + bkr : bkr + num + lab) + '</button>';
      }
      for (var r = 0; r < filas; r++) {
        html += '<div class="prow">' + slot(items[2 * r], 2 * r, "l") + '<div class="bus"></div>' + slot(items[2 * r + 1], 2 * r + 1, "r") + '</div>';
      }
      var hechos = items.filter(function (i) { return i.status === "done"; }).length;
      return '<div class="panel" role="group" aria-label="' + esc(F(TXT.panelAria, { d: hechos, n: n })) + '">' + html + '</div>';
    }

    var paqueteActual = null;   // el paquete de la obra, para saber si aplican los tres días
    var fotosLista = [];        // las fotos de la obra, para abrirlas en grande
    function pintar(p) {
      paqueteActual = p;
      var checklist = p.checklist || [];
      // Un bloque es INFORMATIVO cuando no es trabajo de esta obra: lo que se
      // aplazó, lo que se modificó, lo opcional y lo de una etapa futura. No
      // lleva casilla ni cuenta para el avance — si no, una obra terminada
      // sale al 77 %. Se reconoce por cómo lo escribe Edgar, en los dos idiomas.
      function esInformativo(x) {
        var g = String((x.grupo_en || x.grupo || "")).trim();
        return /^(opcional|optional|etapa futura|future stage|m[aá]s adelante|later)\b/i.test(g) ||
               /\((modificad[oa]|modified|aplazad[oa]|deferred|pendiente|pending|no se hizo|not performed)[^)]*\)\s*$/i.test(g);
      }
      var deObra = checklist.filter(function (x) { return !esInformativo(x); });
      var hechas = deObra.filter(function (x) { return x.hecho; }).length;
      var total = deObra.length;

      var usd = function (n) { return (Number(n) || 0).toLocaleString("en-US", { style: "currency", currency: "USD" }); };
      var terminada = p.estado === "completado";
      var esServicio = String(p.tipo || "") === "servicio";
      var enPropuesta = ["estimando", "enviado", "no_aprobado"].indexOf(p.estado) >= 0;
      var ETAPAS = TXT.etapas || ["Permit", "Rough-in", "Inspection", "Trim", "Final"];
      var FASE_IDX = { mobilizacion: 0, rough: 1, "insp-rough": 2, trim: 3, "insp-final": 4 };
      var etapaIdx = terminada ? ETAPAS.length : (FASE_IDX[p.fase] != null ? FASE_IDX[p.fase] : 0);
      // Una obra en curso a la que nadie le marcó la fase: se dice «en curso», no «Permit»
      var sinFase = !terminada && !esServicio && !enPropuesta && FASE_IDX[p.fase] == null;
      var etapaTxt = terminada ? TXT.terminada : esServicio ? TXT.servicio : enPropuesta ? TXT.propuestaEtapa
        : p.estado === "pausa" ? TXT.enPausa : sinFase ? TXT.enCurso : F(TXT.etapaDe, { e: ETAPAS[etapaIdx] });

      // ---- Los contratos del proyecto (v19) ----
      // Un proyecto puede tener varios SOW alternativos (A, B…). Cada uno con
      // su precio base y sus añadidos sueltos. El cliente elige UNO y marca
      // los extras que quiera; el total se ve al momento. El precio de verdad
      // lo vuelve a calcular el servidor: aquí solo se enseña.
      var paq = p.propuesta || null;
      var sows = paq && paq.propuestas ? paq.propuestas : [];
      var firmadaYa = sows.some(function (s) { return s.estado === "firmada"; });
      var sowElegido = null;
      var opciones = "";
      if (sows.length && !firmadaYa) {
        var varios = sows.length > 1;
        for (var k = 0; k < sows.length; k++) if (sows[k].elegida) { sowElegido = sows[k]; break; }
        opciones = sows.map(function (s) {
          var incluye = (s.incluye || []).slice(0, 14).map(function (x) {
            return '<li>' + esc(typeof x === "string" ? x : (x.item || x.titulo || "")) +
              (x && x.cantidad ? ' <span class="cl-op-cant">×' + esc(x.cantidad) + '</span>' : '') +
              (x && x.by_owner ? ' <span class="cl-op-cant">material by owner</span>' : '') + '</li>';
          }).join("");
          // 12, no 6: quedarse callado a partir de la séptima exclusión en un
          // documento que el cliente firma es la misma enfermedad que el $0 mudo.
          // Coincide con el corte de lineasNoIncluye, así que no se pierde ninguna.
          var noinc = (s.no_incluye || []).slice(0, 12).map(function (x) {
            return '<li>' + esc(typeof x === "string" ? x : (x.texto || "")) + '</li>'; }).join("");
          var adds = (s.addons || []).map(function (a) {
            var marcado = (s.addons_elegidos || []).indexOf(a.id) >= 0;
            return '<label class="cl-add' + (marcado ? ' marcado' : '') + '">' +
              '<input type="checkbox" data-add="' + a.id + '" data-sow="' + s.id + '"' + (marcado ? ' checked' : '') +
                (s.vencida ? ' disabled' : '') + '>' +
              '<span class="cl-add-tit">' + esc(a.titulo) + '</span>' +
              /* (22/09) un DEDUCT no se anuncia con un «+». Antes salía
                 «+ $-12,500.00» en el documento que firma el cliente. */
              '<span class="cl-add-precio' + (Number(a.precio) < 0 ? ' cl-add-deduct' : '') + '">' +
                (Number(a.precio) < 0 ? '− ' + usd(-a.precio) : '+ ' + usd(a.precio)) + '</span></label>';
          }).join("");
          return '<div class="cl-sow' + (s.elegida ? ' elegida' : (varios && sowElegido && sowElegido !== s ? ' apagada' : '')) +
              '" data-sowcard="' + s.id + '" data-base="' + s.precio_base + '" data-pct="' +
              esc(JSON.stringify(s.reparto_pct || [])) + '">' +
            (varios ? '<div class="cl-sow-letra">SOW ' + esc(s.letra_sow) + '</div>' : '') +
            '<div class="cl-op-tit">' + esc(s.titulo || ("SOW " + s.letra_sow)) + '</div>' +
            '<div class="cl-op-precio">' + usd(s.precio_base) + '</div>' +
            (incluye ? '<ul class="cl-op-lista">' + incluye + '</ul>' : '') +
            (noinc ? '<div class="cl-op-no">' + esc(TXT.opcNoInc) + '<ul>' + noinc + '</ul></div>' : '') +
            (adds ? '<div class="cl-adds"><div class="cl-adds-tit">' + esc(TXT.opcAddT) + '</div>' + adds + '</div>' : '') +
            '<div class="cl-sow-cuentas">' +
              '<div class="cl-sow-fila"><span>' + esc(TXT.opcTotal) + '</span><strong data-total="' + s.id + '">' + usd(s.precio_base) + '</strong></div>' +
              '<div class="cl-sow-fila chico"><span>' + esc(TXT.opcHoy2) + '</span><strong data-dep="' + s.id + '">—</strong></div>' +
            '</div>' +
            '<button type="button" class="btn sm ' + (s.elegida ? 'btn-white' : 'btn-navy') + '" data-elegir="' + s.id + '"' +
              (s.vencida ? ' disabled style="opacity:.5"' : '') + '>' +
              (s.elegida ? svg("check", 20, 2.4) : '') + esc(s.elegida ? TXT.opcElegida : TXT.opcElegir) + '</button>' +
            (s.elegida ? '<div class="cl-sow-nota ok">' + esc(TXT.opcFirmaAqui) + '</div>'
                       : (varios ? '<div class="cl-sow-nota">' + esc(TXT.opcNoElegida) + '</div>' : '')) +
          '</div>';
        }).join("");
        var algunaVencida = sows.some(function (s) { return s.vencida; });
        var vence1 = sows.length && sows[0].vence ? sows[0].vence : null;
        opciones = '<section class="card card-white cl-propuesta" style="order:4">' +
          '<h2 class="label-cu cl-card-tit">' + esc(sows.length > 1 ? TXT.opcT2 : TXT.opcT) + '</h2>' +
          '<p class="cl-nota">' +
            esc(algunaVencida ? TXT.opcVencida : (sows.length > 1 ? TXT.opcSub2 : TXT.opcSub)) +
            (!algunaVencida && vence1 ? ' ' + esc(TXT.opcVence) + esc(fechaLlano(vence1, { month: "long", day: "numeric", year: "numeric" })) + '.' : '') + '</p>' +
          '<div class="cl-sows' + (sows.length > 1 ? ' dos' : '') + '">' + opciones + '</div></section>';
      }

      // ---- Los papeles: qué pide firma o aprobación, y la lista entera ----
      // Quien solo coordina la obra mira, pero no firma ni aprueba: quien contrata
      // es el dueño de la propiedad. En vez de un botón que el guardián va a negar,
      // se le dice con todas las letras.
      var puedeFirmarYo = !p.gc || p.gc.puede_firmar;
      var docsOk = (p.documentos || []).filter(function (d) { return urlSegura(d.url); });
      function sowDe(d) {
        for (var si = 0; si < sows.length; si++) if (sows[si].id === d.propuesta_id) return sows[si];
        return null;
      }
      // v19: solo se firma el contrato del SOW que el cliente eligió
      function bloqueado(d) { var s = sowDe(d); return !!(d.propuesta_id && s && !s.elegida && sows.length > 1); }
      // Un contrato vencido ya no se puede firmar (el guardián lo niega): no se le pone el botón
      function vencido(d) { return !!(d.pide_firma && !d.firmado_el && d.vence && String(d.vence).slice(0, 10) < hoyFL); }
      var porFirmar = !puedeFirmarYo ? [] : docsOk.filter(function (d) {
        if (d.pide_firma) return !d.firmado_el && !bloqueado(d) && !vencido(d);
        if (d.pide_aprobacion) return !d.aprobado_el;
        return false;
      });
      // Un solo Pulso por pantalla: el primero que pide algo; los demás llevan Anillo
      var firmas = porFirmar.map(function (d, i) {
        var clase = i === 0 ? "btn btn-pulse" : "btn btn-ring";
        var boton = d.pide_firma
          ? '<button type="button" class="' + clase + '" data-firmar="' + d.id + '" data-titulo="' + esc(d.titulo) + '"' +
              ' data-url="' + esc(urlSegura(d.url)) + '" data-visto="' + (d.visto_el ? 1 : 0) + '"' +
              ' data-consentido="' + (d.consentido ? 1 : 0) + '">' + esc(TXT.revisarFirmar) + '</button>' +
            // Pedir un cambio: siempre a un toque, para que nadie firme por no tener salida
            '<button type="button" class="btn sm btn-white" data-cambio="' + d.id + '">' + esc(TXT.cambioBtn) + '</button>'
          : '<button type="button" class="' + clase + '" data-revisar-aprobar="' + d.id + '" data-titulo="' + esc(d.titulo) + '"' +
              ' data-url="' + esc(urlSegura(d.url)) + '">' + esc(TXT.revisarAprobar) + '</button>';
        return '<section class="card card-volt cl-firmar" style="order:4">' +
          '<div class="cl-volt-cab"><i class="dot dot-warn"></i>' + esc(d.pide_firma ? TXT.firmaT : TXT.aprobT) + '</div>' +
          '<h2 class="cl-volt-tit">' + esc(d.titulo) + '</h2>' +
          (d.vence ? '<div class="cl-volt-vence">' + esc(F(TXT.valeHasta, { x: fechaLlano(d.vence, { month: "long", day: "numeric", year: "numeric" }) })) + '</div>' : '') +
          '<div class="cl-volt-botones">' + boton + '</div></section>';
      }).join("");

      // La lista de documentos: filas de 56 px con su estado en una etiqueta
      var docs = docsOk.map(function (d) {
        var chip = "", detalle = [], extraFila = "";
        if (!puedeFirmarYo && (d.pide_firma || d.pide_aprobacion)) {
          detalle.push(esc(TXT.gcSoloMirar));
        } else if (d.pide_firma) {
          if (d.firmado_el) {
            chip = '<span class="chip chip-ok chip-pill">' + svg("check", 16, 2.4) + esc(TXT.stFirmado) + '</span>';
            var quien = (d.firma_nombre || "") + (d.firma2_nombre ? TXT.yOtro + d.firma2_nombre : "");
            detalle.push(esc(F(TXT.firmadoPor, { x: quien, d: fechaLlano(String(d.firmado_el).slice(0, 10), { month: "short", day: "numeric", year: "numeric" }) })));
            if (d.contrafirma_el) detalle.push(esc(TXT.ambos));
          } else if (vencido(d)) {
            chip = '<span class="chip chip-pill cl-chip-gris">' + esc(TXT.stVencido) + '</span>';
            detalle.push(esc(TXT.opcVencida));
            // Como antes: el cliente puede pedir un precio al día sin salir del portal
            if (puedeFirmarYo) extraFila = '<button type="button" class="btn sm btn-white cl-doc-cambio" data-cambio="' + d.id + '">' + esc(TXT.cambioBtn) + '</button>';
          } else if (bloqueado(d)) {
            chip = '<span class="chip chip-pill cl-chip-gris">' + esc(TXT.stNoElegida) + '</span>';
            detalle.push(esc(TXT.opcNoElegida));
          } else {
            chip = '<span class="chip chip-warn chip-pill">' + esc(TXT.stPideFirma) + '</span>';
            if (d.vence) detalle.push(esc(F(TXT.valeHasta, { x: fechaLlano(d.vence, { month: "short", day: "numeric", year: "numeric" }) })));
          }
        } else if (d.pide_aprobacion) {
          if (d.aprobado_el) {
            chip = '<span class="chip chip-ok chip-pill">' + svg("check", 16, 2.4) + esc(TXT.stAprobado) + '</span>';
            detalle.push(esc(F(TXT.aprobadoEl, { x: fechaLlano(String(d.aprobado_el).slice(0, 10), { month: "short", day: "numeric", year: "numeric" }) })));
          } else {
            chip = '<span class="chip chip-warn chip-pill">' + esc(TXT.stPideAprob) + '</span>';
          }
        }
        // El código con que se comprueba la copia firmada (verificar.html)
        var codigo = d.codigo_verificacion
          ? '<span class="cl-doc-codigo">' + esc(TXT.codigoVer) + ' <span class="chip chip-data">' + esc(d.codigo_verificacion) + '</span></span>' : '';
        return '<a class="cl-doc" data-doc="' + d.id + '" target="_blank" rel="noopener" href="' + esc(urlSegura(d.url)) + '">' +
          '<span class="cl-doc-i">' + svg("doc", 24) + '</span>' +
          '<span class="cl-doc-c"><span class="cl-doc-t">' + esc(d.titulo) + '</span>' +
            (chip ? '<span class="cl-doc-chips">' + chip + '</span>' : '') +
            (detalle.length ? '<span class="cl-doc-s">' + detalle.join(" · ") + '</span>' : '') + codigo +
          '</span><span class="cl-doc-flecha" aria-hidden="true">›</span></a>' +
          (extraFila ? '<div class="cl-doc-extra">' + extraFila + '</div>' : '');
      }).join("");

      // ---- «Amount due»: solo con dinero y algo por cobrar ----
      var deuda = "", pagado = "", pagos = "";
      if (p.dinero) {
        var facs = p.dinero.facturas || [];
        var conSaldo = facs.filter(function (f) { return (Number(f.saldo) || 0) > 0; });
        var saldoTotal = Math.round(conSaldo.reduce(function (s, f) { return s + (Number(f.saldo) || 0); }, 0) * 100) / 100;
        if (saldoTotal > 0) {
          var vieja = conSaldo[0];
          // El botón «View invoice» solo si esa factura tiene su papel en el paquete
          var docFac = null;
          var num = String(vieja.num || "").trim();
          if (num.length >= 3) {
            var reNum = new RegExp("(^|[^0-9A-Za-z])" + num.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "($|[^0-9A-Za-z])", "i");
            for (var di = 0; di < docsOk.length; di++) if (reNum.test(String(docsOk[di].titulo || ""))) { docFac = docsOk[di]; break; }
          }
          deuda = '<section class="card card-night cl-deuda" style="order:3">' +
            '<div class="wire-cu" aria-hidden="true"></div>' +
            '<div class="cl-fila-sep"><h2 class="label-cu cl-card-tit">' + esc(TXT.debeT) + '</h2>' +
              '<span class="chip chip-warn chip-pill">' + esc(TXT.debeYa) + '</span></div>' +
            '<div class="money cl-deuda-monto">' + esc(usd(saldoTotal)) + '</div>' +
            '<div class="cl-deuda-fac mono">' + esc(num || "") + (vieja.fecha ? (num ? ' · ' : '') + esc(F(TXT.emitida, { x: fechaLlano(vieja.fecha) })) : '') + '</div>' +
            (docFac ? '<a class="btn sm btn-ghost-dark" data-doc="' + docFac.id + '" target="_blank" rel="noopener" href="' +
              esc(urlSegura(docFac.url)) + '">' + svg("doc", 20) + esc(TXT.verFactura) + '</a>' : '') +
            '<p class="cl-deuda-nota">' + esc(TXT.notaPago) + '</p></section>';
        }
        var contratoN = Number(p.dinero.contrato) || 0;
        var cobradoN = Number(p.dinero.cobrado) || 0;
        var pctPag = contratoN > 0 ? Math.max(0, Math.min(100, Math.round(cobradoN / contratoN * 100))) : 0;
        pagado = '<section class="card card-white cl-pagado">' +
          '<h2 class="label-cu cl-card-tit">' + esc(TXT.pagadoT) + '</h2>' +
          '<div class="cl-cifra">' + esc(usd(cobradoN)) + '</div>' +
          (contratoN > 0 ? '<div class="cl-nota">' + esc(F(TXT.deContrato, { x: usd(contratoN) })) + '</div>' +
            '<div class="bar ok" role="img" aria-label="' + pctPag + '%"><i style="width:' + pctPag + '%"></i></div>' : '') +
          '</section>';

        // La tabla de pagos de siempre, restilizada y plegada
        var hitos = p.dinero.hitos || [];
        var filasH = hitos.map(function (h) {
          var chip, meta = "";
          if (h.estado === "cobrado") {
            chip = '<span class="chip chip-ok chip-pill">' + svg("check", 16, 2.4) + esc(TXT.hPagado) + '</span>';
            meta = (h.factura ? h.factura : "") + (h.pagada_el ? (h.factura ? " · " : "") + fechaLlano(String(h.pagada_el).slice(0, 10)) : "");
          } else if (h.estado === "facturado") {
            chip = '<span class="chip chip-warn chip-pill">' + esc(TXT.hFacturado) + '</span>';
            meta = (h.factura ? h.factura : "") + (h.fecha ? (h.factura ? " · " : "") + fechaLlano(h.fecha) : "");
          } else {
            chip = '<span class="chip chip-pill cl-chip-gris">' + esc(TXT.hProximo) + '</span>';
          }
          return '<div class="cl-hito ' + esc(h.estado || "pendiente") + '">' +
            '<div class="cl-hito-t">' + esc(hitoEn(h.titulo || "")) +
              (h.condicion ? '<div class="cl-hito-c">' + esc(hitoEn(h.condicion)) + '</div>' : '') + '</div>' +
            '<div class="cl-hito-m mono">' + esc(usd(h.monto)) + '</div>' +
            '<div class="cl-hito-e">' + chip + (meta ? '<span class="cl-hito-meta mono">' + esc(meta) + '</span>' : '') + '</div></div>';
        }).join("");
        var filasF = facs.map(function (f) {
          var parcial = (typeof f.saldo === "number" && f.saldo > 0 && f.cobrado > 0);
          var chip = f.pagada || (Number(f.saldo) <= 0 && Number(f.monto) > 0)
            ? '<span class="chip chip-ok chip-pill">' + svg("check", 16, 2.4) + esc(TXT.fPagada) + '</span>'
            : parcial ? '<span class="chip chip-warn chip-pill">' + esc(TXT.fParcial) + '</span>'
            : '<span class="chip chip-warn chip-pill">' + esc(TXT.fAbierta) + '</span>';
          return '<div class="cl-hito">' +
            '<div class="cl-hito-t"><span class="mono">' + esc(f.num || "") + '</span>' +
              (f.fecha ? '<div class="cl-hito-c">' + esc(fechaLlano(f.fecha, { month: "short", day: "numeric", year: "numeric" })) + '</div>' : '') + '</div>' +
            '<div class="cl-hito-m mono">' + esc(usd(f.monto)) + '</div>' +
            '<div class="cl-hito-e">' + chip +
              (parcial ? '<span class="cl-hito-meta">' + esc(F(TXT.fDetalleParcial, { x: usd(f.cobrado), d: usd(f.saldo) })) + '</span>' : '') + '</div></div>';
        }).join("");
        var cuentas = [[TXT.contratoT, p.dinero.contrato], [TXT.facturadoT, p.dinero.facturado],
          [TXT.porFacturarT, p.dinero.por_facturar], [TXT.saldoT, p.dinero.falta]]
          .map(function (c) { return '<div class="cl-cuenta"><span>' + esc(c[0]) + '</span><b class="mono">' + esc(usd(c[1])) + '</b></div>'; }).join("");
        if (filasH || filasF) {
          pagos = '<section class="card card-white cl-pagos" style="order:10">' +
            '<details class="cl-pliegue"><summary><h2 class="label-cu cl-card-tit">' + esc(TXT.pagosT) + '</h2>' +
              '<span class="cl-pliegue-der">' + esc(hitos.length === 1 ? TXT.hito1 : F(TXT.hitosN, { n: hitos.length })) + svg("bajar", 22) + '</span></summary>' +
              '<div class="cl-cuentas">' + cuentas + '</div>' + filasH +
              (filasF ? '<details class="cl-pliegue cl-facturas"><summary><span class="cl-sub-tit">' + esc(TXT.facturasT) + '</span>' +
                '<span class="cl-pliegue-der">' + facs.length + svg("bajar", 22) + '</span></summary>' + filasF + '</details>' : '') +
            '</details></section>';
        }
      }

      // ---- «Next visit»: la primera del calendario (en una obra terminada, ninguna) ----
      var ev1 = !terminada ? (p.proximos || [])[0] || null : null;
      var proxima = ev1 ? '<section class="card card-tint cl-proxima">' +
          '<h2 class="label-cu cl-card-tit">' + esc(TXT.proxT) + '</h2>' +
          '<div class="cl-cifra-txt">' + esc(fechaLlano(ev1.fecha, { weekday: "short", month: "short", day: "numeric" })) +
            (ev1.hora ? ' · ' + esc(horaLlano(ev1.hora)) : '') + '</div>' +
          '<div class="cl-nota">' + esc(lang === "en" ? (ev1.titulo_en || ev1.titulo) : (ev1.titulo || ev1.titulo_en)) + '</div></section>' : "";
      var par = (pagado || proxima) ? '<div class="cl-par" style="order:9">' + pagado + proxima + '</div>' : "";

      // ---- «Job stages»: el circuito (un servicio no lleva circuito) ----
      var etapas = (enPropuesta || sinFase) ? "" : '<section class="card card-white cl-etapas-card" style="order:5">' +
        '<h2 class="label-cu cl-card-tit">' + esc(TXT.etapasT) + '</h2>' +
        (esServicio && !terminada
          ? '<span class="chip chip-pill cl-chip-servicio"><i class="dot dot-live"></i>' + esc(TXT.servicio) + '</span>'
          : etapasHTML(ETAPAS, etapaIdx)) + '</section>';

      // ---- «Work items»: el panel de breakers + la lista completa (la verdad) ----
      var trabajos = "";
      if (checklist.length) {
        var primeroSinHacer = -1;
        for (var ai = 0; ai < deObra.length; ai++) if (!deObra[ai].hecho) { primeroSinHacer = ai; break; }
        var textoDe = function (x) { return lang === "en" ? (x.texto_en || x.texto) : (x.texto || x.texto_en); };
        var itemsPanel = deObra.map(function (x, i) {
          return { name: textoDe(x) || "", status: x.hecho ? "done" : (i === primeroSinHacer ? "now" : "todo") };
        });
        // La lista por bloques (Fase 1, Generador…), en el orden en que aparecen
        var bloques = [];
        checklist.forEach(function (x) {
          var gN = (lang === "en" ? (x.grupo_en || x.grupo) : (x.grupo || x.grupo_en)) || "";
          var B = null;
          for (var bi = 0; bi < bloques.length; bi++) if (bloques[bi].n === gN) { B = bloques[bi]; break; }
          if (!B) bloques.push(B = { n: gN, items: [] });
          B.items.push(x);
        });
        var hayGrupos = bloques.length > 1 || (bloques.length === 1 && bloques[0].n);
        var PLEGAR = 8, visto = 0;
        var lista = bloques.map(function (B) {
          var info = B.items.length && esInformativo(B.items[0]);
          var hechosB = B.items.filter(function (x) { return x.hecho; }).length;
          var cab = hayGrupos ? '<div class="cl-grp' + (visto >= PLEGAR ? ' extra' : '') + '"><span class="cl-grp-n">' + esc(B.n || TXT.trabajosT) + '</span>' +
            '<span class="cl-grp-c">' + esc(info ? TXT.soloInfo : F(TXT.grupoCuenta, { d: hechosB, n: B.items.length })) + '</span></div>' : "";
          var filas = B.items.map(function (x) {
            var extra = visto >= PLEGAR ? " extra" : "";
            visto++;
            if (esInformativo(x)) {
              return '<div class="cl-punto info' + extra + '"><span class="cl-punto-bala" aria-hidden="true"></span><span class="cl-punto-txt">' + esc(textoDe(x)) + '</span></div>';
            }
            var i = deObra.indexOf(x);
            return '<div class="cl-punto' + (x.hecho ? ' on' : '') + (i === primeroSinHacer ? ' ahora' : '') + extra + '" id="cl-punto-' + i + '" data-punto="' + i + '" tabindex="-1">' +
              '<span class="chk' + (x.hecho ? ' on' : '') + '" aria-hidden="true">' + (x.hecho ? svg("check", 16, 3) : '') + '</span>' +
              '<span class="cl-punto-txt">' + esc(textoDe(x)) +
                (i === primeroSinHacer ? ' <span class="chip chip-pill cl-chip-ahora"><i class="dot dot-live"></i>' + esc(TXT.ahora) + '</span>' : '') +
              '</span></div>';
          }).join("");
          return cab + filas;
        }).join("");
        trabajos = '<section class="card card-white cl-trabajos" style="order:6">' +
          '<div class="cl-fila-sep"><h2 class="label-cu cl-card-tit">' + esc(TXT.trabajosT) + '</h2>' +
            (total ? '<span class="mono cl-cuenta-mono">' + esc(F(TXT.hechosCuenta, { d: hechas, n: total })) + '</span>' : '') + '</div>' +
          (itemsPanel.length ? panelHTML(itemsPanel) + '<p class="cl-nota cl-nota-panel">' + esc(TXT.notaPanel) + '</p>' : '') +
          '<div class="cl-lista' + (checklist.length > PLEGAR ? ' plegada' : '') + '" id="cl-lista">' + lista + '</div>' +
          (checklist.length > PLEGAR ? '<button type="button" class="btn sm btn-white cl-ver-todos" id="cl-ver-todos" aria-expanded="false">' +
            esc(F(TXT.verTodos, { n: checklist.length })) + '</button>' : '') +
          '</section>';
      }

      // ---- «Latest visit»: las fotos del día más reciente que tenga fotos ----
      fotosLista = (p.fotos || []).filter(function (f) { return urlSegura(f.url); });
      var visita = "";
      if (fotosLista.length) {
        var dias = [];
        fotosLista.forEach(function (f, i) {
          var dia = /^\d{4}-\d{2}-\d{2}/.test(String(f.fecha || "")) ? String(f.fecha).slice(0, 10) : "";
          var D = null;
          for (var q = 0; q < dias.length; q++) if (dias[q].dia === dia) { D = dias[q]; break; }
          if (!D) dias.push(D = { dia: dia, fotos: [] });
          D.fotos.push(i);
        });
        // Los días con fecha, del más nuevo al más viejo; las fotos sin fecha, al final
        dias.sort(function (a, b) { return a.dia === b.dia ? 0 : !a.dia ? 1 : !b.dia ? -1 : (a.dia < b.dia ? 1 : -1); });
        var fila = function (D) {
          return (D.dia ? '<div class="cl-foto-dia">' + esc(fechaLlano(D.dia, { weekday: "long", month: "long", day: "numeric" })) + '</div>' : '') +
            '<div class="cl-fotos">' + D.fotos.map(function (i) {
              var f = fotosLista[i], u = urlSegura(f.url);
              var esVideo = /\.(mp4|mov|webm)(\?|$)/i.test(u);
              return '<figure class="cl-foto"><button type="button" class="cl-foto-btn" data-foto="' + i + '" aria-label="' +
                  esc(f.nota || (esVideo ? TXT.videoAlt : TXT.abrirFoto)) + '">' +
                (esVideo ? '<video src="' + esc(u) + '" preload="metadata" muted playsinline></video><span class="cl-foto-play">' + svg("play", 28) + '</span>'
                         : '<img src="' + esc(u) + '" alt="' + esc(f.nota || TXT.fotoAlt) + '" loading="lazy">') +
                '</button>' + (f.nota ? '<figcaption>' + esc(f.nota) + '</figcaption>' : '') + '</figure>';
            }).join("") + '</div>';
        };
        visita = '<section class="card card-white cl-visita" style="order:7">' +
          '<h2 class="label-cu cl-card-tit">' + esc(TXT.visitaT) + '</h2>' + fila(dias[0]) +
          (dias.length > 1 ? '<div class="cl-fotos-mas" id="cl-fotos-mas" hidden>' + dias.slice(1).map(fila).join("") + '</div>' +
            '<button type="button" class="btn sm btn-white" id="cl-ver-fotos" aria-expanded="false">' +
              esc(F(TXT.verFotos, { n: fotosLista.length })) + '</button>' : '') + '</section>';
      }

      // ---- «Permit & inspections»: la próxima arriba ----
      var insps = (p.inspecciones || []).slice();
      var inspecciones = "";
      if (insps.length) {
        var esProx = function (i) { return i.resultado !== "paso" && i.resultado !== "fallo" && (!i.fecha || String(i.fecha) >= hoyFL); };
        var prox = insps.filter(esProx).sort(function (a, b) { return String(a.fecha || "9") < String(b.fecha || "9") ? -1 : 1; });
        var resto = insps.filter(function (i) { return !esProx(i); }).sort(function (a, b) { return String(a.fecha || "") < String(b.fecha || "") ? 1 : -1; });
        inspecciones = '<section class="card card-tint cl-insp-card" style="order:8">' +
          '<h2 class="label-cu cl-card-tit">' + esc(TXT.inspT) + '</h2>' +
          prox.concat(resto).map(function (i) {
            var chip = i.resultado === "paso" ? '<span class="chip chip-ok chip-pill">' + svg("check", 16, 2.4) + esc(TXT.paso) + '</span>'
              : i.resultado === "fallo" ? '<span class="chip chip-warn chip-pill">' + esc(TXT.fallo) + '</span>'
              : '<span class="chip chip-pill cl-chip-gris">' + svg("reloj", 16, 2) + esc(TXT.programada) + '</span>';
            var datos = (i.permiso ? '<span class="chip chip-data" aria-label="' + esc(TXT.permisoAria) + '">' + esc(i.permiso) + '</span>' : '') +
                        (i.jurisdiccion ? '<span class="chip chip-data" aria-label="' + esc(TXT.jurisAria) + '">' + esc(i.jurisdiccion) + '</span>' : '');
            return '<div class="cl-insp"><div class="cl-insp-cab"><span class="cl-insp-t">' + esc(i.tipo || "") + '</span>' + chip + '</div>' +
              (i.fecha ? '<div class="cl-insp-f">' + esc(fechaLlano(i.fecha, { weekday: "short", month: "short", day: "numeric", year: "numeric" })) + '</div>' : '') +
              (datos ? '<div class="cl-insp-datos">' + datos + '</div>' : '') + '</div>';
          }).join("") + '</section>';
      }

      // ---- «Decisions we need from you» y «Job log» ----
      var pendientesDec = (p.decisiones || []).filter(function (d) { return !d.hecha; });
      var decisiones = pendientesDec.length ? '<section class="card card-white cl-decisiones" style="order:11">' +
        '<h2 class="label-cu cl-card-tit">' + esc(TXT.decT) + '</h2>' +
        (p.decisiones || []).map(function (d) {
          return '<div class="cl-dec' + (d.hecha ? ' hecha' : '') + '"><div class="cl-dec-txt">' + esc(d.texto) +
            (d.fecha_limite && !d.hecha ? '<div class="cl-dec-fecha">' + svg("reloj", 18, 2) +
              esc(F(TXT.necesita, { x: fechaLlano(d.fecha_limite, { month: "long", day: "numeric" }) })) + '</div>' : '') + '</div>' +
            (d.hecha ? '<span class="chip chip-ok chip-pill">' + svg("check", 16, 2.4) + esc(TXT.hecha) + '</span>'
              : '<button type="button" class="btn sm btn-navy cl-dec-btn" data-decision="' + d.id + '">' + esc(TXT.decidi) + '</button>') + '</div>';
        }).join("") + '</section>' : "";
      var diarioL = p.diario || [];
      var diario = diarioL.length ? '<section class="card card-white cl-diario" style="order:12">' +
        '<h2 class="label-cu cl-card-tit">' + esc(TXT.diarioT) + '</h2>' +
        diarioL.map(function (d, i) {
          return '<div class="cl-log' + (i >= 5 ? ' extra' : '') + '"><div class="cl-log-f">' +
            esc(/^\d{4}-\d{2}-\d{2}/.test(String(d.fecha || "")) ? fechaLlano(d.fecha, { weekday: "short", month: "short", day: "numeric" }) : (d.fecha || "")) +
            '</div><div class="cl-log-t">' + esc(d.texto) + '</div></div>';
        }).join("") +
        (diarioL.length > 5 ? '<button type="button" class="btn sm btn-white" id="cl-diario-mas" aria-expanded="false">' + esc(TXT.verMas) + '</button>' : '') +
        '</section>' : "";

      var documentos = docs ? '<section class="card card-white cl-docs" style="order:13">' +
        '<h2 class="label-cu cl-card-tit">' + esc(TXT.docsT) + '</h2>' + docs + '</section>' : "";

      // ---- La garantía: solo en la obra terminada ----
      var garantia = "";
      if (terminada) {
        var hasta = "";
        // v32 del portal manda completado_el: se dice hasta cuándo va (P75)
        if (p.completado_el) {
          var dG = fechaDe(String(p.completado_el).slice(0, 10));
          if (dG) { dG.setUTCFullYear(dG.getUTCFullYear() + 1); hasta = dG.toISOString().slice(0, 10); }
        }
        garantia = '<section class="card card-white cl-garantia" style="order:14">' +
          '<h2 class="label-cu cl-card-tit">' + esc(TXT.garantiaT) + '</h2>' +
          '<p class="cl-texto">' + esc(TXT.garantia) + '</p>' +
          (hasta ? '<p class="cl-texto"><b>' + esc(F(TXT.cubierta, { x: fechaLlano(hasta, { month: "long", day: "numeric", year: "numeric" }) })) + '</b></p>' : '') +
          (RESENA ? '<a class="btn sm btn-white" target="_blank" rel="noopener" href="' + esc(RESENA) + '">' + svg("estrella", 20) + esc(TXT.resena) + '</a>' : '') +
          '</section>';
      }

      // ---- La tarjeta del contratista ----
      var emp = (p.empresa || []).map(function (d) {
        var tt = lang === "en" ? (d.titulo_en || d.titulo) : d.titulo;
        if (!urlSegura(d.url)) return '';
        return '<a class="row-link cl-lic" target="_blank" rel="noopener" href="' + esc(urlSegura(d.url)) + '">' + svg("escudo", 24) +
          '<span class="row-txt">' + esc(tt) + '</span><span class="row-flecha" aria-hidden="true">›</span></a>';
      }).join("");
      var contratista = '<section class="card card-white cl-contratista" style="order:15">' +
        '<div class="wire-cu" aria-hidden="true"></div>' +
        '<img class="cl-lockup" src="assets/lockup.png" width="220" alt="Max Power Electrical Solutions Inc." decoding="async">' +
        '<div class="cl-edgar">Edgar Arboleya</div>' +
        '<div class="cl-nota">' + esc(TXT.edgarRol) + '</div>' +
        '<div class="mono cl-licencia">FL EC13016045</div>' +
        (emp ? '<h3 class="label-cu cl-sub-tit">' + esc(TXT.licT) + '</h3>' + emp : '') +
        '<a class="row-link cl-lic" target="_blank" rel="noopener" href="https://mxpes.com">' + svg("web", 24) +
          '<span class="row-txt">' + esc(TXT.sitio) + '</span><span class="row-flecha" aria-hidden="true">›</span></a>' +
        '<div class="cl-dos">' +
          '<a class="btn sm btn-navy" href="tel:' + TEL + '">' + svg("tel", 20) + esc(TXT.llamar) + '</a>' +
          '<a class="btn sm btn-white" href="sms:' + TEL + '">' + svg("sms", 20) + esc(TXT.mensaje) + '</a>' +
        '</div></section>';

      // ---- La cabecera de la obra ----
      var resumenTxt = lang === "en" ? (p.resumen_en || p.resumen) : (p.resumen || p.resumen_en);
      var cabecera = '<section class="cl-obra">' +
        (p.gc && p.gc.empresa ? '<div class="cl-obra-gc">' + esc(F(TXT.gcPara, { x: p.gc.empresa })) + '</div>' : '') +
        '<span class="chip chip-pill cl-etapa-chip"><i class="dot ' + (terminada ? 'dot-ok' : 'dot-live') + '"></i>' +
          esc(TXT.tuObra) + ' · ' + esc(etapaTxt) + '</span>' +
        '<h1 class="cl-obra-nombre">' + esc(p.nombre) + '</h1>' +
        (p.direccion ? '<div class="cl-obra-dir">' + svg("pin", 18) + '<span>' + esc(p.direccion) + '</span></div>' : '') +
        (resumenTxt ? '<div class="cl-obra-resumen"><h2 class="label-cu">' + esc(TXT.dondeT) + '</h2><p>' + esc(resumenTxt) + '</p></div>' : '') +
        '</section>';

      caja.innerHTML =
        // Modo contratista: vuelve a la lista de sus obras (gc.html)
        (p.gc ? '<div class="cl-volver"><a href="gc.html?g=' + encodeURIComponent(g) + '"><span aria-hidden="true">‹</span> ' + esc(TXT.gcTodas) + '</a>' +
                (p.gc.puede_firmar ? '' : '<span class="cl-volver-nota">' + esc(TXT.gcSoloMirar) + '</span>') + '</div>' : '') +
        cabecera +
        // En el teléfono todo va en una columna, en el orden del pliego (style="order");
        // en la computadora, dos columnas: el trabajo a la izquierda, lo demás a la derecha
        '<div class="cl-cuerpo">' +
          '<div class="cl-col cl-col-a">' + opciones + firmas + etapas + trabajos + visita + decisiones + diario + '</div>' +
          '<div class="cl-col cl-col-b">' + deuda + par + inspecciones + documentos + pagos + garantia + contratista + '</div>' +
        '</div>';

      // ---- Los manejadores de siempre ----
      caja.querySelectorAll("[data-revisar-aprobar]").forEach(function (b) {
        b.addEventListener("click", function () {
          abrirAprobar(Number(b.dataset.revisarAprobar), b.dataset.titulo || "", b.dataset.url || "");
        });
      });
      caja.querySelectorAll("[data-decision]").forEach(function (b) {
        b.addEventListener("click", function () { mandar({ accion: "decision_lista", id: Number(b.dataset.decision) }, b); });
      });
      // v19: las casillas de los añadidos recalculan el total al momento
      function cuentasSow(idSow) {
        var card = caja.querySelector('[data-sowcard="' + idSow + '"]');
        if (!card) return { total: 0, marcados: [] };
        var base = Number(card.dataset.base) || 0;
        var pcts = [];
        try { pcts = JSON.parse(card.dataset.pct || "[]"); } catch (e) { pcts = []; }
        var marcados = [], suma = 0;
        card.querySelectorAll("[data-add]").forEach(function (c) {
          var fila = c.closest(".cl-add");
          if (fila) fila.classList.toggle("marcado", c.checked);
          if (c.checked) {
            marcados.push(Number(c.dataset.add));
            /* (22/09) el signo se perdía aquí también: replace(/[^0-9.]/g,"")
               dejaba «− $12,500.00» en 12500 y el total del cliente SUMABA un
               descuento. Se lee el signo antes de tirar los símbolos. */
            var txt = (fila && fila.querySelector(".cl-add-precio") || {}).textContent || "";
            var neg = /^\s*[-−–—]/.test(String(txt));
            var val = Number(String(txt).replace(/[^0-9.]/g, "")) || 0;
            suma += neg ? -val : val;
          }
        });
        var total = base + suma;
        var elT = caja.querySelector('[data-total="' + idSow + '"]');
        if (elT) elT.textContent = usd(total);
        var elD = caja.querySelector('[data-dep="' + idSow + '"]');
        if (elD) elD.textContent = pcts.length ? usd(Math.round(total * pcts[0]) / 100) : "—";
        return { total: total, marcados: marcados };
      }
      caja.querySelectorAll("[data-sowcard]").forEach(function (card) {
        cuentasSow(Number(card.dataset.sowcard));
      });
      caja.querySelectorAll("[data-add]").forEach(function (c) {
        c.addEventListener("change", function () { cuentasSow(Number(c.dataset.sow)); });
      });
      // El cliente elige SU contrato y sus extras, en SU teléfono
      caja.querySelectorAll("[data-elegir]").forEach(function (b) {
        b.addEventListener("click", function () {
          var idSow = Number(b.dataset.elegir);
          var c = cuentasSow(idSow);
          mandar({ accion: "elegir_propuesta", propuesta_id: idSow, addons: c.marcados }, b);
        });
      });
      // Pedir un cambio en vez de firmar: siempre visible junto a la firma
      caja.querySelectorAll("[data-cambio]").forEach(function (b) {
        b.addEventListener("click", function () { abrirCambio(Number(b.dataset.cambio) || null); });
      });
      // Cuando el cliente abre un documento queda constancia (mejor esfuerzo)
      caja.querySelectorAll("a[data-doc]").forEach(function (a) {
        a.addEventListener("click", function () { avisarVisto(Number(a.dataset.doc)); });
      });
      caja.querySelectorAll("[data-firmar]").forEach(function (b) {
        b.addEventListener("click", function () {
          var id = Number(b.dataset.firmar);
          var abrir = function () {
            abrirFirma(id, b.dataset.titulo || "", b.dataset.url || "", b.dataset.visto === "1");
          };
          // Los avisos y el permiso van ANTES de abrir el contrato
          if (b.dataset.consentido === "1") abrir();
          else pedirConsentimiento(id, abrir);
        });
      });
      // Tocar un breaker baja a su punto en la lista (y la despliega si hace falta)
      var lista = caja.querySelector("#cl-lista");
      var verTodos = caja.querySelector("#cl-ver-todos");
      function desplegar(abrir) {
        if (!lista) return;
        lista.classList.toggle("plegada", !abrir);
        if (verTodos) {
          verTodos.setAttribute("aria-expanded", abrir ? "true" : "false");
          verTodos.textContent = abrir ? TXT.verMenos : F(TXT.verTodos, { n: checklist.length });
        }
      }
      if (verTodos) verTodos.addEventListener("click", function () { desplegar(lista.classList.contains("plegada")); });
      var suave = !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      caja.querySelectorAll("[data-bkr]").forEach(function (b) {
        b.addEventListener("click", function () {
          var punto = caja.querySelector("#cl-punto-" + b.dataset.bkr);
          if (!punto) return;
          if (punto.classList.contains("extra")) desplegar(true);
          caja.querySelectorAll(".cl-punto.marcado").forEach(function (x) { x.classList.remove("marcado"); });
          punto.classList.add("marcado");
          punto.scrollIntoView({ block: "center", behavior: suave ? "smooth" : "auto" });
          try { punto.focus({ preventScroll: true }); } catch (e) { /* sin foco no pasa nada */ }
          setTimeout(function () { punto.classList.remove("marcado"); }, 2400);
        });
      });
      // Las fotos: tocar abre la grande; «See all photos» despliega los otros días
      caja.querySelectorAll("[data-foto]").forEach(function (b) {
        b.addEventListener("click", function () { abrirFoto(Number(b.dataset.foto)); });
      });
      var verFotos = caja.querySelector("#cl-ver-fotos");
      if (verFotos) verFotos.addEventListener("click", function () {
        var mas = caja.querySelector("#cl-fotos-mas");
        var abrir = mas.hidden;
        mas.hidden = !abrir;
        verFotos.setAttribute("aria-expanded", abrir ? "true" : "false");
        verFotos.textContent = abrir ? TXT.ocultarFotos : F(TXT.verFotos, { n: fotosLista.length });
      });
      var diarioMas = caja.querySelector("#cl-diario-mas");
      if (diarioMas) diarioMas.addEventListener("click", function () {
        var card = diarioMas.closest(".cl-diario");
        var abrir = !card.classList.contains("abierta");
        card.classList.toggle("abierta", abrir);
        diarioMas.setAttribute("aria-expanded", abrir ? "true" : "false");
        diarioMas.textContent = abrir ? TXT.verMenosLog : TXT.verMas;
      });
      document.title = "Max Power — " + p.nombre;
    }

    // Abrir un documento deja constancia de que el cliente lo vio (mejor esfuerzo)
    function avisarVisto(id) {
      fetch(PORTAL, { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
        body: JSON.stringify(conAccion({ accion: "visto_doc", id: id })) }).catch(function () {});
    }

    // ---- La foto en grande: un <dialog> sencillo con «Cerrar» de 44 px ----
    function abrirFoto(i) {
      var f = fotosLista[i];
      if (!f) return;
      var u = urlSegura(f.url);
      var esVideo = /\.(mp4|mov|webm)(\?|$)/i.test(u);
      var dlg = document.getElementById("cl-visor");
      if (!dlg) {
        dlg = document.createElement("dialog");
        dlg.id = "cl-visor";
        dlg.className = "cl-visor";
        document.body.appendChild(dlg);
        dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });
        dlg.addEventListener("close", function () { dlg.innerHTML = ""; });
      }
      dlg.innerHTML = '<div class="cl-visor-caja">' +
        '<button type="button" class="btn sm btn-white cl-visor-cerrar">' + svg("cerrar", 20, 2) + esc(TXT.cerrar) + '</button>' +
        (esVideo ? '<video src="' + esc(u) + '" controls playsinline autoplay></video>'
                 : '<img src="' + esc(u) + '" alt="' + esc(f.nota || TXT.fotoAlt) + '">') +
        ((f.nota || f.fecha) ? '<p class="cl-visor-nota">' + esc(f.nota || "") +
          (f.fecha ? (f.nota ? " · " : "") + esc(fechaLlano(String(f.fecha).slice(0, 10), { month: "long", day: "numeric", year: "numeric" })) : "") + '</p>' : '') +
        '</div>';
      dlg.querySelector(".cl-visor-cerrar").addEventListener("click", function () { dlg.close(); });
      if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
    }

    // ---- Aprobar un documento: primero se abre y se lee, luego «Aprobar» ----
    // La acción es la de siempre (aprobar_doc); la ventanita solo evita aprobar
    // de un toque algo que no se leyó.
    function abrirAprobar(docId, titulo, urlDoc) {
      if (document.querySelector(".cl-firma-fondo")) return;
      var fondo = document.createElement("div");
      fondo.className = "cl-firma-fondo";
      fondo.innerHTML =
        '<div class="cl-firma-caja" role="dialog" aria-modal="true">' +
          '<h3>' + esc(TXT.aprobarTit) + '</h3>' +
          '<div class="cl-firma-doc">' + svg("doc", 20) + '<span>' + esc(titulo) + '</span></div>' +
          '<p class="cl-firma-nota">' + esc(TXT.aprobarNota) + '</p>' +
          (urlDoc ? '<a class="cl-boton secundario cl-boton-ancho" id="cl-aprobar-leer" target="_blank" rel="noopener" href="' + esc(urlDoc) + '">' +
            esc(TXT.abrirDoc) + '</a>' : '') +
          '<div class="cl-firma-botones">' +
            '<button type="button" class="cl-boton" id="cl-aprobar-ok">' + esc(TXT.aprobarBtn) + '</button>' +
            '<button type="button" class="cl-boton secundario" id="cl-aprobar-no">' + esc(TXT.firmaCancelar) + '</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(fondo);
      var leer = fondo.querySelector("#cl-aprobar-leer");
      if (leer) leer.addEventListener("click", function () { avisarVisto(docId); });
      fondo.querySelector("#cl-aprobar-no").addEventListener("click", function () { fondo.remove(); });
      fondo.querySelector("#cl-aprobar-ok").addEventListener("click", function () {
        var b = fondo.querySelector("#cl-aprobar-ok");
        b.disabled = true; b.textContent = "…";
        fetch(PORTAL, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(conAccion({ accion: "aprobar_doc", id: docId }))
        }).then(function (r) {
          if (!r.ok) throw new Error("bad");
          fondo.remove();
          return cargar();
        }).catch(function () { b.disabled = false; b.textContent = TXT.reintentar; });
      });
    }

    // ---- Pedir un cambio en vez de firmar ----
    // Que nadie firme por no tener salida: está a un toque y del mismo
    // tamaño que el botón de firmar.
    // P180: un aviso en rojo dentro del formulario (antes era un cuadro gris del
    // navegador). Se pone encima del botón y se va solo al tocar cualquier cosa.
    function avisoRojo(fondo, botonSel, texto) {
      var viejo = fondo.querySelector(".cl-aviso-rojo");
      if (viejo) viejo.remove();
      var boton = fondo.querySelector(botonSel);
      var aviso = document.createElement("div");
      aviso.className = "cl-aviso-rojo";
      aviso.setAttribute("role", "alert");
      aviso.textContent = texto;
      if (boton && boton.parentNode) boton.parentNode.insertBefore(aviso, boton); else fondo.appendChild(aviso);
      var quitar = function () { aviso.remove(); fondo.removeEventListener("input", quitar); fondo.removeEventListener("change", quitar); fondo.removeEventListener("pointerdown", quitar, true); };
      fondo.addEventListener("input", quitar); fondo.addEventListener("change", quitar);
      setTimeout(function () { fondo.addEventListener("pointerdown", quitar, true); }, 300);
    }
    function abrirCambio(docId) {
      if (document.querySelector(".cl-firma-fondo")) return;
      var fondo = document.createElement("div");
      fondo.className = "cl-firma-fondo";
      fondo.innerHTML =
        '<div class="cl-firma-caja" role="dialog" aria-modal="true">' +
          '<h3>' + esc(TXT.cambioTit) + '</h3>' +
          '<p class="cl-firma-nota">' + esc(TXT.cambioSub) + '</p>' +
          '<textarea id="cl-cambio-txt" rows="5"></textarea>' +
          '<div class="cl-firma-botones">' +
            '<button type="button" class="cl-boton" id="cl-cambio-ok">' + esc(TXT.cambioEnviar) + '</button>' +
            '<button type="button" class="cl-boton secundario" id="cl-cambio-no">' + esc(TXT.firmaCancelar) + '</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(fondo);
      fondo.querySelector("#cl-cambio-no").addEventListener("click", function () { fondo.remove(); });
      fondo.querySelector("#cl-cambio-ok").addEventListener("click", function () {
        var txt = fondo.querySelector("#cl-cambio-txt").value.trim();
        if (!txt) return;
        var b = fondo.querySelector("#cl-cambio-ok");
        b.disabled = true; b.textContent = "…";
        fetch(PORTAL, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(conAccion({ accion: "pedir_cambio", id: docId, texto: txt }))
        }).then(function (r) {
          if (!r.ok) throw new Error("bad");
          fondo.innerHTML = '<div class="cl-firma-caja cl-firma-fin" role="dialog" aria-modal="true">' +
            '<h3>' + esc(TXT.cambioOk) + '</h3>' +
            '<button type="button" class="cl-boton" id="cl-cambio-fin">' + esc(TXT.firmadoOk) + '</button></div>';
          fondo.querySelector("#cl-cambio-fin").addEventListener("click", function () { fondo.remove(); });
          return cargar();
        }).catch(function () { b.disabled = false; b.textContent = TXT.reintentar; });
      });
    }

    // ---- El consentimiento: va ANTES de abrir el contrato ----
    // El aviso de gravámenes y el de cancelar se exigen "por escrito", y en
    // electrónico solo valen si el cliente consintió primero.
    function pedirConsentimiento(docId, seguir) {
      var fondo = document.createElement("div");
      fondo.className = "cl-firma-fondo";
      fondo.innerHTML =
        '<div class="cl-firma-caja" role="dialog" aria-modal="true">' +
          '<h3>' + esc(TXT.consentTit) + '</h3>' +
          '<p class="cl-firma-nota">' + esc(TXT.consentSub) + '</p>' +
          '<ul class="cl-op-lista cl-consent-lista">' +
            // A una empresa o en propiedad comercial no se le promete el aviso de gravámenes
            // ni los tres días: solo queda el punto de la firma electrónica.
            ((paqueteActual && (paqueteActual.gc || paqueteActual.sin_tres_dias)) ? TXT.consentPuntos.slice(-1) : TXT.consentPuntos)
              .map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") +
          '</ul>' +
          '<label class="cl-firma-nota cl-casilla">' +
            '<input type="checkbox" id="cl-cons-ok"> ' +
            '<span>' + esc(TXT.consentCaja) + '</span></label>' +
          '<div class="cl-firma-botones">' +
            '<button type="button" class="cl-boton" id="cl-cons-seguir">' + esc(TXT.consentSeguir) + '</button>' +
            '<button type="button" class="cl-boton secundario" id="cl-cons-no">' + esc(TXT.consentNo) + '</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(fondo);
      fondo.querySelector("#cl-cons-no").addEventListener("click", function () { fondo.remove(); });
      fondo.querySelector("#cl-cons-seguir").addEventListener("click", function () {
        if (!fondo.querySelector("#cl-cons-ok").checked) { avisoRojo(fondo, "#cl-cons-seguir", TXT.firmaConsent); return; }
        var b = fondo.querySelector("#cl-cons-seguir");
        b.disabled = true; b.textContent = "…";
        fetch(PORTAL, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(conAccion({ accion: "consentir", id: docId }))
        }).then(function (r) {
          if (!r.ok) throw new Error("bad");
          fondo.remove(); seguir();
        }).catch(function () { b.disabled = false; b.textContent = TXT.reintentar; });
      });
    }

    // ---- Panel de firma: nombre + firma dibujada ----
    // yaLeyo: el botón de firmar solo se activa cuando el cliente ya abrió
    // el documento (antes, o desde el enlace de este mismo panel).
    function abrirFirma(docId, titulo, urlDoc, yaLeyo) {
      if (document.querySelector(".cl-firma-fondo")) return; // ya hay uno abierto
      var fondo = document.createElement("div");
      fondo.className = "cl-firma-fondo";
      var puerta = !yaLeyo && urlDoc
        ? '<a class="cl-boton secundario cl-boton-ancho" id="cl-firma-leer" target="_blank" rel="noopener" href="' + esc(urlDoc) + '">' +
          svg("doc", 20) + esc(TXT.leerPrimero) + '</a>' +
          '<div class="cl-firma-nota" id="cl-firma-leer-nota">' + esc(TXT.leerNota) + '</div>'
        : '';
      fondo.innerHTML =
        '<div class="cl-firma-caja" role="dialog" aria-modal="true">' +
          '<h3>' + esc(TXT.firmaTitulo) + '</h3>' +
          '<div class="cl-firma-doc">' + svg("doc", 20) + '<span>' + esc(titulo) + '</span></div>' +
          puerta +
          '<input type="text" id="cl-firma-nombre" placeholder="' + esc(TXT.firmaNombre) + '" autocomplete="name">' +
          '<div class="cl-firma-tabs">' +
            '<button type="button" class="cl-boton cl-tab on" id="cl-tab-escribir">' + esc(TXT.modoEscribir) + '</button>' +
            '<button type="button" class="cl-boton secundario cl-tab" id="cl-tab-dibujar">' + esc(TXT.modoDibujar) + '</button>' +
          '</div>' +
          // Empieza en «escribir»: la línea de «dibuja tu firma» sale al cambiar a dibujar
          '<div class="cl-firma-sub" id="cl-firma-sub"></div>' +
          '<canvas class="cl-firma-lienzo" width="640" height="260" style="width:100%;height:auto;touch-action:none"></canvas>' +
          '<label class="cl-firma-nota cl-casilla">' +
            '<input type="checkbox" id="cl-firma-dos"> ' +
            '<span>' + esc(TXT.dosFirmas) + '</span></label>' +
          '<div id="cl-firma2" hidden>' +
            '<input type="text" id="cl-firma2-nombre" placeholder="' + esc(TXT.firma2Nombre) + '" autocomplete="name">' +
            '<div class="cl-firma-sub">' + esc(TXT.firma2Dibuja) + '</div>' +
            '<canvas class="cl-firma-lienzo" id="cl-firma2-lienzo" width="640" height="200" style="width:100%;height:auto;touch-action:none"></canvas>' +
          '</div>' +
          '<label class="cl-firma-nota cl-casilla">' +
            '<input type="checkbox" id="cl-firma-acepto"> ' +
            '<span>' + esc(TXT.firmaLegal) + '</span></label>' +
          '<div class="cl-firma-botones">' +
            '<button type="button" class="cl-boton" id="cl-firma-ok"' + (!yaLeyo && urlDoc ? ' disabled style="opacity:.5"' : '') + '>' + esc(TXT.firmaEnviar) + '</button>' +
            '<button type="button" class="cl-boton secundario" id="cl-firma-borrar">' + esc(TXT.firmaLimpiar) + '</button>' +
            '<button type="button" class="cl-boton secundario" id="cl-firma-cambio">' + esc(TXT.cambioBtn) + '</button>' +
            '<button type="button" class="cl-boton secundario" id="cl-firma-no">' + esc(TXT.firmaCancelar) + '</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(fondo);

      // La puerta: al abrir el documento desde aquí, queda registrado como
      // visto y el botón de firmar se desbloquea.
      var linkLeer = fondo.querySelector("#cl-firma-leer");
      if (linkLeer) {
        linkLeer.addEventListener("click", function () {
          fetch(PORTAL, { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
            body: JSON.stringify(conAccion({ accion: "visto_doc", id: docId })) }).catch(function () {});
          var ok = fondo.querySelector("#cl-firma-ok");
          ok.disabled = false; ok.style.opacity = "";
          var nota = fondo.querySelector("#cl-firma-leer-nota");
          if (nota) nota.textContent = TXT.abiertoOk;
        });
      }

      var lienzo = fondo.querySelector(".cl-firma-lienzo");
      var ctx = lienzo.getContext("2d");
      ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.strokeStyle = "#0A2540";
      var trazos = 0, dibujando = false;
      // Dos modos: ESCRIBIR (el nombre sale en letra manuscrita, siempre legible)
      // o DIBUJAR con el dedo. Escribir es el modo inicial.
      var modo = "escribir";
      var nombreInput = fondo.querySelector("#cl-firma-nombre");
      function pintarNombre() {
        ctx.clearRect(0, 0, lienzo.width, lienzo.height);
        var texto = nombreInput.value.trim();
        if (!texto) return;
        var tam = 72;
        ctx.save();
        do {
          ctx.font = "italic " + tam + 'px "Snell Roundhand","Segoe Script","Brush Script MT","Dancing Script",cursive';
          tam -= 4;
        } while (ctx.measureText(texto).width > lienzo.width - 60 && tam > 22);
        ctx.fillStyle = "#0A2540";
        ctx.textBaseline = "middle";
        ctx.fillText(texto, 30, lienzo.height / 2);
        ctx.restore();
      }
      var tabEscribir = fondo.querySelector("#cl-tab-escribir");
      var tabDibujar = fondo.querySelector("#cl-tab-dibujar");
      var subTexto = fondo.querySelector("#cl-firma-sub");
      function ponerModo(m) {
        modo = m;
        tabEscribir.className = "cl-boton cl-tab" + (m === "escribir" ? " on" : " secundario");
        tabDibujar.className = "cl-boton cl-tab" + (m === "dibujar" ? " on" : " secundario");
        ctx.clearRect(0, 0, lienzo.width, lienzo.height); trazos = 0;
        if (m === "escribir") { subTexto.textContent = ""; pintarNombre(); }
        else subTexto.textContent = TXT.firmaDibuja;
      }
      tabEscribir.addEventListener("click", function () { ponerModo("escribir"); });
      tabDibujar.addEventListener("click", function () { ponerModo("dibujar"); });
      nombreInput.addEventListener("input", function () { if (modo === "escribir") pintarNombre(); });
      function xy(e) {
        var r = lienzo.getBoundingClientRect();
        return [(e.clientX - r.left) * (lienzo.width / r.width), (e.clientY - r.top) * (lienzo.height / r.height)];
      }
      lienzo.addEventListener("pointerdown", function (e) {
        if (modo !== "dibujar") return;
        e.preventDefault(); dibujando = true;
        lienzo.setPointerCapture(e.pointerId);
        var p0 = xy(e); ctx.beginPath(); ctx.moveTo(p0[0], p0[1]);
      });
      lienzo.addEventListener("pointermove", function (e) {
        if (!dibujando) return;
        var p1 = xy(e); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
        trazos++; // solo cuenta tinta de verdad, no toques sueltos
      });
      lienzo.addEventListener("pointerup", function () { dibujando = false; });
      lienzo.addEventListener("pointercancel", function () { dibujando = false; });
      fondo.querySelector("#cl-firma-borrar").addEventListener("click", function () {
        ctx.clearRect(0, 0, lienzo.width, lienzo.height); trazos = 0;
        if (modo === "escribir") pintarNombre();
      });
      // ---- El segundo firmante (casa a nombre de dos) ----
      // Las dos firmas viajan en la MISMA llamada: se sella una sola vez y
      // el plazo de cancelación cuenta desde la última firma.
      var lienzo2 = fondo.querySelector("#cl-firma2-lienzo");
      var ctx2 = lienzo2.getContext("2d");
      ctx2.lineWidth = 3; ctx2.lineCap = "round"; ctx2.lineJoin = "round"; ctx2.strokeStyle = "#0B2036";
      var trazos2 = 0, dibujando2 = false;
      function xy2(e) {
        var r = lienzo2.getBoundingClientRect();
        return [(e.clientX - r.left) * (lienzo2.width / r.width), (e.clientY - r.top) * (lienzo2.height / r.height)];
      }
      lienzo2.addEventListener("pointerdown", function (e) {
        e.preventDefault(); dibujando2 = true; lienzo2.setPointerCapture(e.pointerId);
        var q = xy2(e); ctx2.beginPath(); ctx2.moveTo(q[0], q[1]);
      });
      lienzo2.addEventListener("pointermove", function (e) {
        if (!dibujando2) return;
        var q = xy2(e); ctx2.lineTo(q[0], q[1]); ctx2.stroke(); trazos2++;
      });
      lienzo2.addEventListener("pointerup", function () { dibujando2 = false; });
      lienzo2.addEventListener("pointercancel", function () { dibujando2 = false; });
      var casillaDos = fondo.querySelector("#cl-firma-dos");
      casillaDos.addEventListener("change", function () {
        fondo.querySelector("#cl-firma2").hidden = !casillaDos.checked;
      });

      fondo.querySelector("#cl-firma-no").addEventListener("click", function () { fondo.remove(); });
      fondo.querySelector("#cl-firma-cambio").addEventListener("click", function () {
        fondo.remove(); abrirCambio(docId);
      });
      fondo.querySelector("#cl-firma-ok").addEventListener("click", function () {
        var nombre = fondo.querySelector("#cl-firma-nombre").value.trim();
        if (!fondo.querySelector("#cl-firma-acepto").checked) { avisoRojo(fondo, "#cl-firma-ok", TXT.firmaConsent); return; }
        if (modo === "escribir") {
          if (!nombre) { avisoRojo(fondo, "#cl-firma-ok", TXT.firmaFalta); return; }
          pintarNombre(); // asegura que el lienzo tenga la firma final
        } else if (!nombre || trazos === 0) { avisoRojo(fondo, "#cl-firma-ok", TXT.firmaFalta); return; }
        var cuerpoFirma = conAccion({ accion: "firmar_doc", id: docId, nombre: nombre,
                            firma: lienzo.toDataURL("image/png") });
        if (casillaDos.checked) {
          var n2 = fondo.querySelector("#cl-firma2-nombre").value.trim();
          if (!n2 || trazos2 === 0) { avisoRojo(fondo, "#cl-firma-ok", TXT.firma2Falta); return; }
          cuerpoFirma.nombre2 = n2;
          cuerpoFirma.firma2 = lienzo2.toDataURL("image/png");
        }
        var b = fondo.querySelector("#cl-firma-ok");
        b.disabled = true; b.textContent = "…";
        fetch(PORTAL, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(cuerpoFirma)
        }).then(function (r) {
          if (!r.ok) throw new Error("bad");
          // Pantalla de confirmación con su copia
          fondo.innerHTML =
            '<div class="cl-firma-caja cl-firma-fin" role="dialog" aria-modal="true">' +
              '<div class="cl-firma-hecho">' + svg("check", 32, 2.6) + '</div>' +
              '<h3>' + esc(TXT.firmadoTit) + '</h3>' +
              '<p class="cl-firma-nota">' + esc(TXT.firmadoTxt) + '</p>' +
              '<button type="button" class="cl-boton" id="cl-firma-fin">' + esc(TXT.firmadoOk) + '</button>' +
            '</div>';
          fondo.querySelector("#cl-firma-fin").addEventListener("click", function () { fondo.remove(); });
          return cargar();
        }).catch(function () {
          b.disabled = false; b.textContent = TXT.reintentar;
          cargar().catch(function () {}); // refresca por si ya se firmó en otra pestaña
        });
      });
    }
  })();
  </script>
</body>
</html>
